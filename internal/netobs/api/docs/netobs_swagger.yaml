definitions:
  api.DropEntry:
    properties:
      drop_category:
        type: string
      drop_reason:
        type: string
      dst_ip:
        type: string
      dst_port:
        type: integer
      event_count:
        type: integer
      events_per_sec:
        type: number
      ip_version:
        type: string
      node:
        type: string
      protocol:
        type: string
      src_ip:
        type: string
      src_namespace:
        type: string
      src_pod:
        type: string
      src_port:
        type: integer
    type: object
  api.DropListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.DropEntry'
        type: array
      page:
        $ref: '#/definitions/api.PageInfo'
    type: object
  api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/api.ErrorDetail'
    type: object
  api.FlowEntry:
    properties:
      bytes_per_sec:
        type: number
      bytes_total:
        type: integer
      direction:
        type: string
      dst_ip:
        type: string
      dst_namespace:
        type: string
      dst_pod:
        type: string
      dst_port:
        type: integer
      ip_version:
        type: string
      node:
        type: string
      protocol:
        type: string
      src_ip:
        type: string
      src_namespace:
        type: string
      src_pod:
        type: string
      src_port:
        type: integer
    type: object
  api.FlowListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.FlowEntry'
        type: array
      page:
        $ref: '#/definitions/api.PageInfo'
    type: object
  api.PageInfo:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/v1/drops:
    get:
      description: drop_reason 별 5-tuple 분포 조회. namespace 와 reason 필터 후 pagination
        적용
      parameters:
      - description: drop reason 필터
        in: query
        name: drop_reason
        type: string
      - description: drop category 필터
        in: query
        name: drop_category
        type: string
      - description: src Pod 의 namespace 필터
        in: query
        name: src_namespace
        type: string
      - description: src Pod 의 이름 필터
        in: query
        name: src_pod
        type: string
      - description: 'IP version 필터 (4 또는 6, #103 IPv6 확장)'
        in: query
        name: ip_version
        type: string
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DropListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List packet drop events
      tags:
      - netobs
  /api/v1/flows:
    get:
      description: 5-tuple 기준 flow bytes 와 rate 조회. namespace/pod/protocol/direction
        필터 후 pagination 적용
      parameters:
      - description: src Pod 의 namespace 필터
        in: query
        name: src_namespace
        type: string
      - description: src Pod 의 이름 필터
        in: query
        name: src_pod
        type: string
      - description: dst Pod 의 namespace 필터
        in: query
        name: dst_namespace
        type: string
      - description: dst Pod 의 이름 필터
        in: query
        name: dst_pod
        type: string
      - description: 프로토콜 필터 (tcp/udp)
        in: query
        name: protocol
        type: string
      - description: 방향 필터 (egress/ingress)
        in: query
        name: direction
        type: string
      - description: 'IP version 필터 (4 또는 6, #103 IPv6 확장)'
        in: query
        name: ip_version
        type: string
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.FlowListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List Pod-to-Pod network flows
      tags:
      - netobs
swagger: "2.0"
