definitions:
  api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/api.ErrorDetail'
    type: object
  api.GPUEntry:
    properties:
      gpu_index:
        type: string
      gpu_model:
        type: string
      gpu_uuid:
        type: string
      memory_total_bytes:
        type: integer
      memory_used_bytes:
        type: integer
      node:
        type: string
      power_limit_watts:
        type: number
      power_usage_watts:
        type: number
      scope:
        type: string
      src_namespace:
        type: string
      src_pod:
        type: string
      temperature_celsius:
        type: number
      utilization_percent:
        type: number
    type: object
  api.GPUListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.GPUEntry'
        type: array
      page:
        $ref: '#/definitions/api.PageInfo'
    type: object
  api.PageInfo:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/v1/gpu:
    get:
      description: device scope 또는 pod scope 의 GPU utilization 과 memory 와 temperature
        와 power 통합 조회
      parameters:
      - description: scope (device 또는 pod, 기본 device)
        in: query
        name: scope
        type: string
      - description: node 필터
        in: query
        name: node
        type: string
      - description: gpu_uuid 필터
        in: query
        name: gpu_uuid
        type: string
      - description: Pod 의 namespace 필터 (scope=pod 일 때만 유효)
        in: query
        name: src_namespace
        type: string
      - description: Pod 의 이름 필터 (scope=pod 일 때만 유효)
        in: query
        name: src_pod
        type: string
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GPUListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List GPU resource usage
      tags:
      - gpuobs
swagger: "2.0"
