definitions:
  api.DropEntry:
    properties:
      drop_category:
        type: string
      drop_reason:
        type: string
      dst_ip:
        type: string
      dst_port:
        type: integer
      event_count:
        type: integer
      events_per_sec:
        type: number
      ip_version:
        type: string
      node:
        type: string
      protocol:
        type: string
      src_ip:
        type: string
      src_namespace:
        type: string
      src_pod:
        type: string
      src_port:
        type: integer
    type: object
  api.DropListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.DropEntry'
        type: array
      page:
        $ref: '#/definitions/internal_netobs_api.PageInfo'
    type: object
  api.FlowEntry:
    properties:
      bytes_per_sec:
        type: number
      bytes_total:
        type: integer
      direction:
        type: string
      dst_ip:
        type: string
      dst_namespace:
        type: string
      dst_pod:
        type: string
      dst_port:
        type: integer
      ip_version:
        type: string
      node:
        type: string
      protocol:
        type: string
      src_ip:
        type: string
      src_namespace:
        type: string
      src_pod:
        type: string
      src_port:
        type: integer
    type: object
  api.FlowListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.FlowEntry'
        type: array
      page:
        $ref: '#/definitions/internal_netobs_api.PageInfo'
    type: object
  api.GPUEntry:
    properties:
      gpu_index:
        type: string
      gpu_model:
        type: string
      gpu_uuid:
        type: string
      memory_total_bytes:
        type: integer
      memory_used_bytes:
        type: integer
      node:
        type: string
      power_limit_watts:
        type: number
      power_usage_watts:
        type: number
      scope:
        type: string
      src_namespace:
        type: string
      src_pod:
        type: string
      temperature_celsius:
        type: number
      utilization_percent:
        type: number
    type: object
  api.GPUListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.GPUEntry'
        type: array
      page:
        $ref: '#/definitions/internal_gpuobs_api.PageInfo'
    type: object
  internal_correlation_api.CrossNodeListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.NodeInterference'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  internal_correlation_api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  internal_correlation_api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_correlation_api.ErrorDetail'
    type: object
  internal_correlation_api.NoisyNeighborListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.NoisyNeighbor'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  internal_gpuobs_api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  internal_gpuobs_api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_gpuobs_api.ErrorDetail'
    type: object
  internal_gpuobs_api.PageInfo:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  internal_netobs_api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  internal_netobs_api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_netobs_api.ErrorDetail'
    type: object
  internal_netobs_api.PageInfo:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  netobs_internal_apicommon.Page:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  netobs_internal_correlation.NodeInterference:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      p_value:
        type: number
      rank:
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect_metric:
        type: string
      suspect_node:
        type: string
      victim_metric:
        type: string
      victim_node:
        type: string
    type: object
  netobs_internal_correlation.NoisyNeighbor:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      impact_ok:
        type: boolean
      impact_seconds:
        description: |-
          #146 effect size 결과. Impact 는 suspect 압박 시 victim latency 증가량 (seconds) 으로 간섭의
          절대 영향 크기다. Score (상관 강도) 와 독립된 지표라 운영자가 우선순위 판단에 함께 활용한다.
          ImpactOK=false 면 표본 부족 등으로 산정이 skip 되어 Impact 는 0 이다.
        type: number
      lag_steps:
        type: integer
      p_value:
        description: |-
          #69 Granger causality 결과. PValue 는 src 가 dst 를 Granger-cause 하는지의 통계적 유의성.
          GrangerOK=false 면 표본 부족 또는 행렬 singular 로 산정이 자연 skip 되었다.
        type: number
      rank:
        description: Rank 는 (victim, dimension) 그룹 내 max_abs_value 내림차순 1-based 순위다.
          1 이 가장 강한 상관.
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      suspect_metric:
        type: string
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_metric:
        type: string
    type: object
  netobs_internal_correlation.PodIdentity:
    properties:
      namespace:
        type: string
      pod:
        type: string
      pod_uid:
        type: string
    type: object
  netobs_internal_correlation.ResourceDimension:
    enum:
    - cpu
    - memory
    - network
    - gpu
    - ""
    type: string
    x-enum-varnames:
    - DimensionCPU
    - DimensionMemory
    - DimensionNetwork
    - DimensionGPU
    - DimensionUnknown
info:
  contact: {}
paths:
  /api/v1/cross-node-interference:
    get:
      description: victim_node 와 suspect_node 와 dimension 과 rank 필터 후 pagination 적용한
        cross-node interference 시리즈 반환
      parameters:
      - description: victim node 이름 필터
        in: query
        name: victim_node
        type: string
      - description: suspect node 이름 필터
        in: query
        name: suspect_node
        type: string
      - description: 리소스 차원 필터 (cpu/memory/network/gpu)
        in: query
        name: dimension
        type: string
      - description: max rank (기본 무제한)
        in: query
        name: rank_max
        type: integer
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.CrossNodeListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: List cross-node interference top-N
      tags:
      - correlation
  /api/v1/drops:
    get:
      description: drop_reason 별 5-tuple 분포 조회. namespace 와 reason 필터 후 pagination
        적용
      parameters:
      - description: drop reason 필터
        in: query
        name: drop_reason
        type: string
      - description: drop category 필터
        in: query
        name: drop_category
        type: string
      - description: src Pod 의 namespace 필터
        in: query
        name: src_namespace
        type: string
      - description: src Pod 의 이름 필터
        in: query
        name: src_pod
        type: string
      - description: 'IP version 필터 (4 또는 6, #103 IPv6 확장)'
        in: query
        name: ip_version
        type: string
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DropListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_netobs_api.ErrorResponse'
      summary: List packet drop events
      tags:
      - netobs
  /api/v1/flows:
    get:
      description: 5-tuple 기준 flow bytes 와 rate 조회. namespace/pod/protocol/direction
        필터 후 pagination 적용
      parameters:
      - description: src Pod 의 namespace 필터
        in: query
        name: src_namespace
        type: string
      - description: src Pod 의 이름 필터
        in: query
        name: src_pod
        type: string
      - description: dst Pod 의 namespace 필터
        in: query
        name: dst_namespace
        type: string
      - description: dst Pod 의 이름 필터
        in: query
        name: dst_pod
        type: string
      - description: 프로토콜 필터 (tcp/udp)
        in: query
        name: protocol
        type: string
      - description: 방향 필터 (egress/ingress)
        in: query
        name: direction
        type: string
      - description: 'IP version 필터 (4 또는 6, #103 IPv6 확장)'
        in: query
        name: ip_version
        type: string
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.FlowListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_netobs_api.ErrorResponse'
      summary: List Pod-to-Pod network flows
      tags:
      - netobs
  /api/v1/gpu:
    get:
      description: device scope 또는 pod scope 의 GPU utilization 과 memory 와 temperature
        와 power 통합 조회
      parameters:
      - description: scope (device 또는 pod, 기본 device)
        in: query
        name: scope
        type: string
      - description: node 필터
        in: query
        name: node
        type: string
      - description: gpu_uuid 필터
        in: query
        name: gpu_uuid
        type: string
      - description: Pod 의 namespace 필터 (scope=pod 일 때만 유효)
        in: query
        name: src_namespace
        type: string
      - description: Pod 의 이름 필터 (scope=pod 일 때만 유효)
        in: query
        name: src_pod
        type: string
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GPUListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_gpuobs_api.ErrorResponse'
      summary: List GPU resource usage
      tags:
      - gpuobs
  /api/v1/noisy-neighbor:
    get:
      description: victim/suspect 와 dimension 과 rank 필터 후 pagination 적용한 noisy neighbor
        시리즈 반환
      parameters:
      - description: victim Pod 의 namespace 필터
        in: query
        name: victim_namespace
        type: string
      - description: victim Pod 의 이름 필터
        in: query
        name: victim_pod
        type: string
      - description: suspect Pod 의 namespace 필터
        in: query
        name: suspect_namespace
        type: string
      - description: suspect Pod 의 이름 필터
        in: query
        name: suspect_pod
        type: string
      - description: 리소스 차원 필터 (cpu/memory/network/gpu)
        in: query
        name: dimension
        type: string
      - description: max rank (기본 무제한)
        in: query
        name: rank_max
        type: integer
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NoisyNeighborListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: List noisy neighbor top-N
      tags:
      - correlation
swagger: "2.0"
