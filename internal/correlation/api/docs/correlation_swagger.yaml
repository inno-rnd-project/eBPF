basePath: /
definitions:
  internal_correlation_api.AgentHealth:
    properties:
      agent:
        type: string
      bpf_attach_failures_5m:
        description: BpfAttachFailures5m 는 최근 5분 attach 실패 누적 (netobs 전용) 이다.
        type: number
      bpf_programs_loaded:
        description: BpfProgramsLoaded / Total 은 netobs 전용. loaded < total 이면 일부 kprobe
          가 detach 상태다.
        type: number
      bpf_programs_total:
        type: number
      cuda_driver_symbols:
        description: |-
          CudaDriverSymbols / CudaRuntimeSymbols 는 cuda uprobe 심볼 부착 상태 (gpuobs 전용, #279) 다.
          driver (cu*) 는 CUDA pod 귀속의 필수 조건이고 runtime (cuda*) 은 선택이라는 규약은
          GPUObsCudaSymbolUnavailable alert 와 같다. gpu-status 의 pod_attribution 과 동일 소스다.
        type: boolean
      cuda_runtime_symbols:
        type: boolean
      informer_lag_seconds:
        description: InformerLagSeconds 는 kube informer 마지막 watch event 이후 경과 초다.
        type: number
      issues:
        items:
          type: string
        type: array
      node:
        type: string
      nvml_errors_per_sec:
        description: NvmlErrorsPerSec 는 NVML 호출 실패율 (gpuobs 전용) 이다.
        type: number
      status:
        description: |-
          Status 는 healthy 또는 degraded 다. 판정 임계는 기존 알림 규칙과 동일하고, 걸린 규칙의
          alertname 이 Issues 에 담긴다.
        type: string
      up:
        type: boolean
    type: object
  internal_correlation_api.AgentsResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/internal_correlation_api.AgentHealth'
        type: array
      generated_at:
        type: string
      summary:
        type: string
    type: object
  internal_correlation_api.Anomaly:
    properties:
      dimension:
        type: string
      severity:
        type: string
      window:
        type: string
      zscore:
        type: number
    type: object
  internal_correlation_api.BandwidthNode:
    properties:
      nic_capacity_bytes_per_sec:
        type: number
      nic_tx_bytes_per_sec:
        type: number
      nic_utilization:
        type: number
      node:
        type: string
      rx_bytes_per_sec:
        type: number
      tx_bytes_per_sec:
        type: number
    type: object
  internal_correlation_api.BandwidthPod:
    properties:
      namespace:
        type: string
      nic_tx_bytes_per_sec:
        type: number
      node:
        type: string
      pod:
        type: string
      rx_bytes_per_sec:
        type: number
      tx_bytes_per_sec:
        type: number
    type: object
  internal_correlation_api.BandwidthResponse:
    properties:
      generated_at:
        type: string
      nodes:
        description: |-
          Nodes 는 NIC 포화 판단 근거다. namespace 필터와 무관하게 항상 클러스터 전체 pod 합계로
          산출해 필터로 합계가 왜곡되지 않게 한다.
        items:
          $ref: '#/definitions/internal_correlation_api.BandwidthNode'
        type: array
      pods:
        items:
          $ref: '#/definitions/internal_correlation_api.BandwidthPod'
        type: array
      summary:
        type: string
      window:
        type: string
    type: object
  internal_correlation_api.CiliumDropGroup:
    properties:
      direction:
        type: string
      drops_per_sec:
        type: number
      node:
        type: string
      reason:
        type: string
    type: object
  internal_correlation_api.CrossLevelListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.CrossLevel'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  internal_correlation_api.CrossNodeListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.NodeInterference'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  internal_correlation_api.DimensionHealth:
    properties:
      health:
        type: number
      hotspot:
        $ref: '#/definitions/internal_correlation_api.Hotspot'
      status:
        type: string
    type: object
  internal_correlation_api.DominantPressure:
    properties:
      dimension:
        type: string
      node:
        type: string
      pod:
        type: string
      pressure:
        type: number
    type: object
  internal_correlation_api.DropFlow:
    properties:
      category:
        type: string
      direction:
        type: string
      drops_per_sec:
        type: number
      dst_ip:
        type: string
      dst_port:
        type: string
      ip_version:
        type: string
      last_seen_unix:
        type: number
      namespace:
        type: string
      node:
        type: string
      pod:
        type: string
      protocol:
        type: string
      reason:
        type: string
      src_ip:
        type: string
      src_port:
        type: string
    type: object
  internal_correlation_api.DropGroup:
    properties:
      category:
        type: string
      direction:
        type: string
      drops_per_sec:
        type: number
      dst_namespace:
        type: string
      dst_workload:
        type: string
      namespace:
        type: string
      node:
        type: string
      reason:
        type: string
      stage:
        type: string
      workload:
        type: string
    type: object
  internal_correlation_api.DropStack:
    properties:
      category:
        type: string
      drops_per_sec:
        type: number
      func:
        type: string
      reason:
        type: string
    type: object
  internal_correlation_api.DropsResponse:
    properties:
      cilium_drops:
        description: |-
          CiliumDrops 는 #225 의 CNI(BPF) 계층 drop 이다. kfree_skb_reason 기반 drops 가 커널 스택 drop
          만 잡는 사각 (NetworkPolicy 거부 등) 을 cilium_drop_count_total 합성으로 보완한다. cilium-agent
          단위 메트릭이라 pod 귀속이 없는 node 수준 신호다.
        items:
          $ref: '#/definitions/internal_correlation_api.CiliumDropGroup'
        type: array
      drops:
        items:
          $ref: '#/definitions/internal_correlation_api.DropGroup'
        type: array
      flow_detail_enabled:
        type: boolean
      flows:
        items:
          $ref: '#/definitions/internal_correlation_api.DropFlow'
        type: array
      generated_at:
        type: string
      retrans:
        description: |-
          Retrans 는 #226 의 workload 단위 TCP 재전송 랭킹이다. drop 과 함께 패킷 손실 계열 신호라 한
          응답으로 묶는다. 항상 수집되는 netobs_retrans_events_labeled_total 기반이다.
        items:
          $ref: '#/definitions/internal_correlation_api.RetransGroup'
        type: array
      stacks:
        items:
          $ref: '#/definitions/internal_correlation_api.DropStack'
        type: array
      summary:
        type: string
      window:
        type: string
    type: object
  internal_correlation_api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  internal_correlation_api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_correlation_api.ErrorDetail'
    type: object
  internal_correlation_api.Event:
    properties:
      causal_strength:
        type: number
      dimension:
        type: string
      explanation:
        type: string
      id:
        type: string
      kind:
        type: string
      links:
        additionalProperties:
          type: string
        type: object
      severity:
        type: string
      zscore:
        type: number
    type: object
  internal_correlation_api.EventsResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/internal_correlation_api.Event'
        type: array
      generated_at:
        type: string
      summary:
        type: string
      window:
        type: string
    type: object
  internal_correlation_api.FlowEdge:
    properties:
      bytes_per_sec:
        type: number
      direction:
        type: string
      dst_ip:
        type: string
      dst_namespace:
        type: string
      dst_pod_uid:
        type: string
      mbps:
        type: number
      node:
        type: string
      protocol:
        type: string
      src_namespace:
        type: string
      src_pod:
        type: string
      src_workload:
        type: string
    type: object
  internal_correlation_api.FlowsResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/internal_correlation_api.FlowEdge'
        type: array
      flow_collection_enabled:
        type: boolean
      generated_at:
        type: string
      summary:
        type: string
      window:
        type: string
    type: object
  internal_correlation_api.GpuCauseWeight:
    properties:
      cause:
        type: string
      weight:
        type: number
    type: object
  internal_correlation_api.GpuDevice:
    properties:
      bar1_memory_total_bytes:
        type: number
      bar1_memory_used_bytes:
        type: number
      clocks_mhz:
        additionalProperties:
          format: float64
          type: number
        description: |-
          ClocksMhz 는 clock 라벨 (sm / mem / graphics) 별 클럭이고, TemperatureThresholdsCelsius 는
          threshold 라벨 (slowdown / shutdown / mem_max / gpu_max) 별 임계다. 서브라벨로 device 당
          다중 시리즈라 단일 필드가 아닌 map 으로 담는다.
        type: object
      compute_mode:
        type: number
      decoder_utilization_percent:
        type: number
      encoder_utilization_percent:
        type: number
      energy_consumption_joules:
        type: number
      fan_speed_percent:
        type: number
      gpu_index:
        type: string
      gpu_uuid:
        type: string
      memory_total_bytes:
        type: number
      memory_used_bytes:
        type: number
      memory_used_ratio:
        type: number
      model:
        type: string
      node:
        type: string
      pcie_link_generation:
        type: number
      pcie_link_width:
        type: number
      pcie_rx_bytes_per_second:
        type: number
      pcie_tx_bytes_per_second:
        type: number
      performance_state:
        type: number
      persistence_mode:
        type: number
      pod_attribution:
        allOf:
        - $ref: '#/definitions/internal_correlation_api.PodAttribution'
        description: |-
          PodAttribution 은 CUDA pod 귀속 능력 메타데이터 (#279) 다. pods 가 비었을 때 "실행 중 GPU
          프로세스 없음" 과 "귀속 자체가 불가능" 을 프론트가 구분하는 근거다. 심볼 신호 부재 시 생략된다.
      pods:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuPod'
        type: array
      power_limit_enforced_watts:
        type: number
      power_limit_watts:
        type: number
      power_usage_watts:
        type: number
      sm_active_percent:
        description: |-
          아래는 #267 의 device 상세 확장 필드다. gpuobs 가 수집하나 기존 gpu-status 가 노출하지 않던
          신호로, heatmap 온도 위험도 색칠 (temperature_thresholds_celsius) 과 GPU Detail 페이지
          (클럭, 팬, PCIe, performance state 등) 의 데이터를 채운다. 전부 수집 공백 시 생략되도록
          pointer 또는 omitempty map 이다.

          SMActivePercent 는 gpm_utilization_percent 의 sm_occupancy 다. consumer GPU (RTX 등) 는 GPM
          미지원이라 빈 값이고 데이터센터 GPU (A100+) 에서만 채워진다.
        type: number
      status:
        description: |-
          Status 는 device 3단 판정 (#279) 이다. 성능성 throttle 활성이면 degraded, 온도가 slowdown
          임계의 90% 이상이거나 노드의 유의미 NVML 오류율이 alert 임계 (1/s) 를 넘으면 warning, 그 외
          healthy 다. #273 의 GPU health 판정 신호를 device 뱃지 입도로 적용한 것이다.
        type: string
      temperature_celsius:
        type: number
      temperature_thresholds_celsius:
        additionalProperties:
          format: float64
          type: number
        type: object
      throttle_reasons:
        description: |-
          ThrottleReasons 는 값이 1 (활성) 인 throttle reason 라벨 목록이다. gpu_idle 같은 정보성 사유도
          NVML 이 주는 그대로 노출해 프론트가 필터 여부를 결정하게 한다.
        items:
          type: string
        type: array
      throttle_violation_seconds:
        type: number
      utilization_percent:
        type: number
    type: object
  internal_correlation_api.GpuIdleAttribution:
    properties:
      causes:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuCauseWeight'
        type: array
      dominant_cause:
        type: string
    type: object
  internal_correlation_api.GpuIdleResponse:
    properties:
      cluster:
        $ref: '#/definitions/internal_correlation_api.GpuIdleAttribution'
      generated_at:
        type: string
      node_attributions:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuNodeAttribution'
        type: array
      nodes:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuNodeIdle'
        type: array
      scope:
        type: string
      summary:
        type: string
      victims:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuVictimIdle'
        type: array
      window:
        type: string
    type: object
  internal_correlation_api.GpuNodeAttribution:
    properties:
      causes:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuCauseWeight'
        type: array
      dominant_cause:
        type: string
      node:
        type: string
    type: object
  internal_correlation_api.GpuNodeIdle:
    properties:
      idle:
        type: number
      node:
        type: string
      severity:
        type: string
    type: object
  internal_correlation_api.GpuPod:
    properties:
      memory_used_bytes:
        type: number
      namespace:
        type: string
      pod:
        type: string
      utilization_percent:
        type: number
    type: object
  internal_correlation_api.GpuStatusResponse:
    properties:
      devices:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuDevice'
        type: array
      generated_at:
        type: string
      summary:
        type: string
    type: object
  internal_correlation_api.GpuVictimIdle:
    properties:
      causes:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuCauseWeight'
        type: array
      dominant_cause:
        type: string
      namespace:
        type: string
      node:
        type: string
      pod:
        type: string
    type: object
  internal_correlation_api.HealthResponse:
    properties:
      anomalies:
        items:
          $ref: '#/definitions/internal_correlation_api.Anomaly'
        type: array
      cluster_health:
        description: |-
          ClusterHealth 는 차원 health 의 최솟값 (가장 약한 고리 원칙, #248) 이다. 프론트 랜딩 카드의
          단일 % 표기가 본 필드를 그대로 쓴다. health 를 아는 차원이 하나도 없으면 생략된다.
        type: number
      dimensions:
        additionalProperties:
          $ref: '#/definitions/internal_correlation_api.DimensionHealth'
        type: object
      dominant_pressure:
        $ref: '#/definitions/internal_correlation_api.DominantPressure'
      generated_at:
        type: string
      summary:
        type: string
      weakest:
        allOf:
        - $ref: '#/definitions/internal_correlation_api.WeakestSignal'
        description: Weakest 는 ClusterHealth 를 만든 차원이다. 동률은 차원 이름 사전순 첫 항목으로 결정적이다.
      window:
        type: string
    type: object
  internal_correlation_api.Hotspot:
    properties:
      node:
        type: string
      pressure:
        type: number
      severity:
        type: string
      top_pod:
        type: string
    type: object
  internal_correlation_api.ImpactGraphResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactGraphEdge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactGraphNode'
        type: array
      summary:
        $ref: '#/definitions/internal_correlation_api.ImpactGraphSummary'
    type: object
  internal_correlation_api.ImpactGraphSummary:
    properties:
      edge_count:
        type: integer
      node_count:
        type: integer
    type: object
  internal_correlation_api.ImpactPathsResponse:
    properties:
      paths:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactPath'
        type: array
      roots:
        items:
          $ref: '#/definitions/netobs_internal_correlation.RootSuspect'
        type: array
      summary:
        $ref: '#/definitions/internal_correlation_api.ImpactPathsSummary'
    type: object
  internal_correlation_api.ImpactPathsSummary:
    properties:
      path_count:
        type: integer
      root_count:
        type: integer
    type: object
  internal_correlation_api.Incident:
    properties:
      alertname:
        type: string
      component:
        type: string
      ends_at:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      severity:
        type: string
      starts_at:
        type: string
      status:
        type: string
      truncated:
        type: boolean
    type: object
  internal_correlation_api.IncidentsResponse:
    properties:
      generated_at:
        type: string
      incidents:
        items:
          $ref: '#/definitions/internal_correlation_api.Incident'
        type: array
      range:
        type: string
      step:
        type: string
      summary:
        type: string
    type: object
  internal_correlation_api.LatencyBreakdownResponse:
    properties:
      direction:
        type: string
      generated_at:
        type: string
      scope:
        type: string
      summary:
        type: string
      targets:
        items:
          $ref: '#/definitions/internal_correlation_api.LatencyTarget'
        type: array
      window:
        type: string
    type: object
  internal_correlation_api.LatencyTarget:
    properties:
      dominant_stage:
        type: string
      namespace:
        type: string
      node:
        type: string
      pod:
        type: string
      stages:
        items:
          $ref: '#/definitions/internal_correlation_api.StageLatency'
        type: array
      tcp_state:
        allOf:
        - $ref: '#/definitions/internal_correlation_api.TcpStateInfo'
        description: |-
          TcpState 는 #226 의 수신 pod TCP 상태 (srtt 와 cwnd) 다. netobs_tcp_state_* 가 pod 단위 라벨이라
          scope=pod 에서만 join 되고 workload / node scope 에서는 생략된다. srtt 는 경로 RTT 신호라 커널
          단계 처리 지연 (stages) 과 구분해 병목이 경로인지 처리인지 가른다.
      workload:
        type: string
    type: object
  internal_correlation_api.MemoryResponse:
    properties:
      generated_at:
        type: string
      pods:
        items:
          $ref: '#/definitions/internal_correlation_api.PodMemory'
        type: array
      summary:
        type: string
      window:
        type: string
    type: object
  internal_correlation_api.NodeCapacity:
    properties:
      cpu:
        type: number
      gpu:
        type: number
      memory_bytes:
        type: number
    type: object
  internal_correlation_api.NodeGpuRcaResponse:
    properties:
      causes:
        items:
          $ref: '#/definitions/internal_correlation_api.GpuCauseWeight'
        type: array
      confidence:
        description: |-
          Confidence 는 dominant 판정 신뢰도 (0-1). top1 과 top2 cause weight 의 격차 (margin) 로,
          단일 cause 가 지배적일수록 1 에 가깝고 두 cause 가 백중이면 0 에 가깝다. GPUIdleDominantCause
          Ambiguous alert 의 격차 < 0.1 판정과 동일 축이다.
        type: number
      dominant_cause:
        type: string
      evidence:
        allOf:
        - $ref: '#/definitions/internal_correlation_api.RcaEvidence'
        description: Evidence 는 narrative 를 뒷받침하는 근거 수치다.
      generated_at:
        type: string
      gpu:
        description: Gpu 는 device 스코프 조회 시 요청 gpu 파라미터 (GPU UUID 또는 device index)
          의 echo 다.
        type: string
      idle:
        description: Idle 은 node:gpu_idle:5m (0-1). 유휴 게이팅 미충족 시 cause 귀속이 비므로 함께
          노출한다.
        type: number
      narrative:
        type: string
      node:
        type: string
      suspects:
        items:
          $ref: '#/definitions/internal_correlation_api.RcaSuspect'
        type: array
    type: object
  internal_correlation_api.NodeInventory:
    properties:
      capacity:
        $ref: '#/definitions/internal_correlation_api.NodeCapacity'
      external_ip:
        type: string
      internal_ip:
        type: string
      kernel_version:
        type: string
      kubelet_version:
        type: string
      name:
        type: string
      os_image:
        type: string
      ready:
        type: boolean
      roles:
        description: |-
          Roles 는 kube_node_role 기반 노드 역할 (control-plane 등) 이다 (#248). 역할 라벨이 없는
          worker 노드는 생략된다.
        items:
          type: string
        type: array
      runtime_version:
        type: string
      uid:
        type: string
    type: object
  internal_correlation_api.NodeMapNode:
    properties:
      gpu:
        type: boolean
      gpu_devices:
        type: integer
      name:
        type: string
      pod_count:
        type: integer
