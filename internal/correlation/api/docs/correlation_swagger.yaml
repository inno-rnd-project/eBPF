definitions:
  internal_correlation_api.CrossLevelListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.CrossLevel'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  internal_correlation_api.CrossNodeListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.NodeInterference'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  internal_correlation_api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  internal_correlation_api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_correlation_api.ErrorDetail'
    type: object
  internal_correlation_api.ImpactGraphResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactGraphEdge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactGraphNode'
        type: array
      summary:
        $ref: '#/definitions/internal_correlation_api.ImpactGraphSummary'
    type: object
  internal_correlation_api.ImpactGraphSummary:
    properties:
      edge_count:
        type: integer
      node_count:
        type: integer
    type: object
  internal_correlation_api.ImpactPathsResponse:
    properties:
      paths:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactPath'
        type: array
      roots:
        items:
          $ref: '#/definitions/netobs_internal_correlation.RootSuspect'
        type: array
      summary:
        $ref: '#/definitions/internal_correlation_api.ImpactPathsSummary'
    type: object
  internal_correlation_api.ImpactPathsSummary:
    properties:
      path_count:
        type: integer
      root_count:
        type: integer
    type: object
  internal_correlation_api.NoisyNeighborListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.NoisyNeighbor'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  internal_correlation_api.ServiceImpactListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ServiceImpact'
        type: array
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
    type: object
  netobs_internal_apicommon.Page:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  netobs_internal_correlation.CrossLevel:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      direction:
        $ref: '#/definitions/netobs_internal_correlation.CrossLevelDirection'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      node:
        type: string
      p_value:
        type: number
      pod:
        type: string
      pod_namespace:
        type: string
      pod_uid:
        type: string
      rank:
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect_metric:
        type: string
      victim_metric:
        type: string
    type: object
  netobs_internal_correlation.CrossLevelDirection:
    enum:
    - node_to_pod
    - pod_to_node
    type: string
    x-enum-varnames:
    - DirectionNodeToPod
    - DirectionPodToNode
  netobs_internal_correlation.ImpactGraphEdge:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      p_value:
        type: number
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_signal:
        $ref: '#/definitions/netobs_internal_correlation.VictimSignal'
    type: object
  netobs_internal_correlation.ImpactGraphNode:
    properties:
      in_degree:
        type: integer
      namespace:
        type: string
      out_degree:
        type: integer
      pod:
        type: string
      pod_uid:
        type: string
    type: object
  netobs_internal_correlation.ImpactPath:
    properties:
      depth:
        type: integer
      hops:
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactPathHop'
        type: array
      root:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      root_kind:
        $ref: '#/definitions/netobs_internal_correlation.RootKind'
      score:
        type: number
      terminal:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
    type: object
  netobs_internal_correlation.ImpactPathHop:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      lag_steps:
        type: integer
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_signal:
        $ref: '#/definitions/netobs_internal_correlation.VictimSignal'
    type: object
  netobs_internal_correlation.NodeInterference:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      p_value:
        type: number
      rank:
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect_metric:
        type: string
      suspect_node:
        type: string
      victim_metric:
        type: string
      victim_node:
        type: string
    type: object
  netobs_internal_correlation.NoisyNeighbor:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      impact_ok:
        type: boolean
      impact_seconds:
        description: |-
          #146 effect size 결과. Impact 는 suspect 압박 시 victim latency 증가량 (seconds) 으로 간섭의
          절대 영향 크기다. Score (상관 강도) 와 독립된 지표라 운영자가 우선순위 판단에 함께 활용한다.
          ImpactOK=false 면 표본 부족 등으로 산정이 skip 되어 Impact 는 0 이다.
        type: number
      lag_steps:
        type: integer
      p_value:
        description: |-
          #69 Granger causality 결과. PValue 는 src 가 dst 를 Granger-cause 하는지의 통계적 유의성.
          GrangerOK=false 면 표본 부족 또는 행렬 singular 로 산정이 자연 skip 되었다.
        type: number
      rank:
        description: Rank 는 (victim, victim_signal, dimension) 그룹 내 max_abs_value
          내림차순 1-based 순위다. 1 이 가장 강한 상관.
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      suspect_metric:
        type: string
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_metric:
        type: string
      victim_signal:
        allOf:
        - $ref: '#/definitions/netobs_internal_correlation.VictimSignal'
        description: |-
          VictimSignal 은 victim 영향 종착 차원 (#150 의 latency / throughput / error 와 #174 의 gpu) 이다.
          dimension 이 suspect 의 자원 종류라면 VictimSignal 은 victim 측 품질 저하의 종류다. Top-N 은
          (victim, victim_signal, dimension) 그룹별로 산정되어 한 victim 이 신호별로 독립 순위를 갖는다.
    type: object
  netobs_internal_correlation.PodIdentity:
    properties:
      namespace:
        type: string
      pod:
        type: string
      pod_uid:
        type: string
    type: object
  netobs_internal_correlation.ResourceDimension:
    enum:
    - cpu
    - memory
    - network
    - gpu
    - ""
    type: string
    x-enum-varnames:
    - DimensionCPU
    - DimensionMemory
    - DimensionNetwork
    - DimensionGPU
    - DimensionUnknown
  netobs_internal_correlation.RootKind:
    enum:
    - source
    - net_source
    type: string
    x-enum-varnames:
    - RootKindSource
    - RootKindNetSource
  netobs_internal_correlation.RootSuspect:
    properties:
      kind:
        $ref: '#/definitions/netobs_internal_correlation.RootKind'
      path_count:
        type: integer
      reach:
        type: integer
      root:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
    type: object
  netobs_internal_correlation.ServiceImpact:
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      p_value:
        type: number
      rank:
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect_metric:
        type: string
      suspect_node:
        type: string
      victim_metric:
        type: string
      victim_namespace:
        type: string
      victim_workload:
        type: string
    type: object
  netobs_internal_correlation.VictimSignal:
    enum:
    - latency
    - throughput
    - error
    - gpu
    - ""
    type: string
    x-enum-varnames:
    - SignalLatency
    - SignalThroughput
    - SignalError
    - SignalGPU
    - SignalNone
info:
  contact: {}
paths:
  /api/v1/cross-level:
    get:
      description: node 와 pod 와 direction 과 dimension 과 rank 필터 후 pagination 적용한 cross-level
        시리즈 반환
      parameters:
      - description: 공유 node 이름 필터
        in: query
        name: node
        type: string
      - description: pod 의 namespace 필터
        in: query
        name: pod_namespace
        type: string
      - description: pod 이름 필터
        in: query
        name: pod
        type: string
      - description: 방향 필터 (node_to_pod/pod_to_node)
        in: query
        name: direction
        type: string
      - description: 리소스 차원 필터 (cpu/memory/network/gpu)
        in: query
        name: dimension
        type: string
      - description: max rank (기본 무제한)
        in: query
        name: rank_max
        type: integer
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.CrossLevelListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: List cross-level interference top-N
      tags:
      - correlation
  /api/v1/cross-node-interference:
    get:
      description: victim_node 와 suspect_node 와 dimension 과 rank 필터 후 pagination 적용한
        cross-node interference 시리즈 반환
      parameters:
      - description: victim node 이름 필터
        in: query
        name: victim_node
        type: string
      - description: suspect node 이름 필터
        in: query
        name: suspect_node
        type: string
      - description: 리소스 차원 필터 (cpu/memory/network/gpu)
        in: query
        name: dimension
        type: string
      - description: max rank (기본 무제한)
        in: query
        name: rank_max
        type: integer
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.CrossNodeListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: List cross-node interference top-N
      tags:
      - correlation
  /api/v1/impact-graph:
    get:
      description: suspect → victim 1-hop 엣지로 구성된 영향 전파 그래프의 정점 (out/in degree 포함)
        과 엣지 반환. namespace / min_score 로 유도 부분그래프를 추릴 수 있다
      parameters:
      - description: suspect 또는 victim 이 이 namespace 인 엣지만 (유도 부분그래프)
        in: query
        name: namespace
        type: string
      - description: score 가 이 값 이상인 엣지만
        in: query
        name: min_score
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ImpactGraphResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: Get impact propagation graph
      tags:
      - correlation
  /api/v1/impact-paths:
    get:
      description: 근원 suspect(root)에서 종착 victim(terminal)으로 이어지는 다단계 경로와 근원 요약 반환.
        root_pod / terminal_pod / namespace / min_score 필터 지원
      parameters:
      - description: 근원 suspect pod 이름 필터
        in: query
        name: root_pod
        type: string
      - description: 종착 victim pod 이름 필터
        in: query
        name: terminal_pod
        type: string
      - description: root 또는 terminal 의 namespace 필터
        in: query
        name: namespace
        type: string
      - description: 경로 weakest-link score 하한 필터
        in: query
        name: min_score
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ImpactPathsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: List multi-hop impact propagation paths
      tags:
      - correlation
  /api/v1/noisy-neighbor:
    get:
      description: victim/suspect 와 dimension 과 rank 필터 후 pagination 적용한 noisy neighbor
        시리즈 반환
      parameters:
      - description: victim Pod 의 namespace 필터
        in: query
        name: victim_namespace
        type: string
      - description: victim Pod 의 이름 필터
        in: query
        name: victim_pod
        type: string
      - description: suspect Pod 의 namespace 필터
        in: query
        name: suspect_namespace
        type: string
      - description: suspect Pod 의 이름 필터
        in: query
        name: suspect_pod
        type: string
      - description: 리소스 차원 필터 (cpu/memory/network/gpu)
        in: query
        name: dimension
        type: string
      - description: victim 영향 종착 차원 필터 (latency/throughput/error/gpu)
        in: query
        name: victim_signal
        type: string
      - description: max rank (기본 무제한)
        in: query
        name: rank_max
        type: integer
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NoisyNeighborListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: List noisy neighbor top-N
      tags:
      - correlation
  /api/v1/service-impact:
    get:
      description: victim_namespace 와 victim_workload 와 suspect_node 와 dimension 과
        rank 필터 후 pagination 적용한 service-impact 시리즈 반환
      parameters:
      - description: victim workload 의 namespace 필터
        in: query
        name: victim_namespace
        type: string
      - description: victim workload (Service 근사) 이름 필터
        in: query
        name: victim_workload
        type: string
      - description: suspect node 이름 필터
        in: query
        name: suspect_node
        type: string
      - description: 리소스 차원 필터 (cpu/memory/network/gpu)
        in: query
        name: dimension
        type: string
      - description: max rank (기본 무제한)
        in: query
        name: rank_max
        type: integer
      - description: 응답 item 최대 개수 (기본 100, 최대 1000)
        in: query
        name: limit
        type: integer
      - description: 응답 시작 offset (기본 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ServiceImpactListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
      summary: List service-impact top-N
      tags:
      - correlation
swagger: "2.0"
