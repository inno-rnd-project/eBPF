    properties:
      causal_strength:
        description: |-
          #176 CausalStrength 는 Pearson 강도와 Granger 유의성과 effect size 유의성을 가중합한 [0,1] 통합
          인과강도다. 운영자가 개별 필드 (Score / PValue / ImpactPValue) 를 종합하지 않고 한 값으로 간섭
          여부를 판단하게 한다. 산정식과 가중치는 ComputeCausalStrength 가 단일 진실원으로 보유한다.
        type: number
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      impact_magnitude:
        description: |-
          #175 ImpactMagnitude 는 victim 신호별 native 단위 degradation 크기 (latency=seconds, throughput=
          bytes/s 감소, error=drops/s 증가, gpu=util 감소) 로 latency 외 신호까지 확장된 effect size 다.
          ImpactPValue 는 high / low 구간 평균 차이의 Welch t-test two-sided p-value 로 effect size 의 통계적
          유의성이다. *OK 가 false 면 표본 부족이나 구간 분산 0 등으로 산정이 graceful skip 된 상태다.
        type: number
      impact_magnitude_ok:
        type: boolean
      impact_ok:
        type: boolean
      impact_pvalue:
        type: number
      impact_pvalue_ok:
        type: boolean
      impact_seconds:
        description: |-
          #146 effect size 결과. Impact 는 suspect 압박 시 victim latency 증가량 (seconds) 으로 간섭의
          절대 영향 크기다. Score (상관 강도) 와 독립된 지표라 운영자가 우선순위 판단에 함께 활용한다.
          ImpactOK=false 면 표본 부족 등으로 산정이 skip 되어 Impact 는 0 이다. #175 부터 본 두 필드는
          latency victim 전용 legacy 로 유지된다.
        type: number
      lag_steps:
        type: integer
      p_value:
        description: |-
          #69 Granger causality 결과. PValue 는 src 가 dst 를 Granger-cause 하는지의 통계적 유의성.
          GrangerOK=false 면 표본 부족 또는 행렬 singular 로 산정이 자연 skip 되었다.
        type: number
      rank:
        description: Rank 는 (victim, victim_signal, dimension) 그룹 내 max_abs_value
          내림차순 1-based 순위다. 1 이 가장 강한 상관.
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      suspect_metric:
        type: string
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_metric:
        type: string
      victim_signal:
        allOf:
