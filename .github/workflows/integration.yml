name: integration

# 본 워크플로우는 #36 의 통합 테스트 6종 (T1~T6) 을 GitHub-hosted runner 에서 실행해 main 브랜치
# 머지 게이트로 동작한다. 실 BPF kernel attach / 실 multi-GPU 노드 / 실 NVML 의존성은 별도 e2e
# 이슈로 분리되어 있어 본 워크플로우는 그 항목들을 포함하지 않는다.
#
# 실행 시간 예산: setup-envtest binary 다운로드 / 캐시 hit 시 60 초 이내, race detector 항상 on,
# 재시도 정책 없음 (fail-fast). 이 ceiling 을 깨지면 본 워크플로우 자체를 따로 분할한다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVTEST_K8S_VERSION: 1.31.0
      # setup-envtest 는 controller-runtime 에서 분리된 별도 Go 모듈로 자체 태그 (v0.24.0~) 를 가진다.
      # 본체 v0.19.4 와 태그 체계가 다르며 현재 발행된 단일 안정 태그인 v0.24.0 으로 고정해 비결정성
      # (자산 해석 동작 변경 / 업스트림 회귀) 을 차단한다.
      SETUP_ENVTEST_VERSION: v0.24.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # cuda 패키지의 cudauprobe_bpfel.o 가 //go:embed 로 참조되지만 .o 와 bpf/vmlinux.h 는 gitignore
      # 대상이라 CI 환경에는 존재하지 않는다. clang 은 apt 로 설치하지만 bpftool 은 ubuntu-latest 의
      # 직접 설치 가능 패키지가 아니다 (linux-tools-common 의 wrapper 는 host kernel 매칭이 필요해
      # GHA runner 환경에서 깨짐). libbpf 의 prebuilt static bpftool binary 를 GitHub Releases 에서
      # 받아 /usr/local/bin 에 둔다. release tag 고정으로 재현성 확보. 통합 테스트는 본 .o 를 실제
      # BPF 로 load 하지 않지만 Go 컴파일 단계의 embed 검증 때문에 파일이 반드시 있어야 한다.
      # libbpf-dev 는 bpf/bpf_helpers.h / bpf_core_read.h / bpf_tracing.h 등 BPF 프로그램이 include
      # 하는 헤더를 /usr/include/bpf/ 에 제공한다. clang 만 설치하면 이 헤더를 못 찾아 BPF 컴파일이
      # "bpf/bpf_helpers.h file not found" 로 즉시 실패한다.
      - name: Install clang / llvm / libbpf-dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev

      - name: Install bpftool (libbpf prebuilt static)
        env:
          BPFTOOL_VERSION: v7.4.0
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version

      - name: Verify host BTF availability
        run: |
          if [ ! -r /sys/kernel/btf/vmlinux ]; then
            echo "::error::/sys/kernel/btf/vmlinux not readable on this runner; BPF generation cannot proceed"
            exit 1
          fi

      - name: Generate BPF artifacts (vmlinux.h + .o)
        run: make generate-gpuobs

      # envtest binary (etcd / kube-apiserver) 를 setup-envtest 로 받아 KUBEBUILDER_ASSETS 경로를
      # 산출한다. setup-envtest 가 자체 캐시 디렉토리 (~/.local/share/kubebuilder-envtest) 를 두므로
      # actions/cache 는 별도 적용하지 않고, setup-go 의 모듈 캐시만 활용한다.
      - name: Resolve envtest assets path
        id: envtest
        run: |
          set -euo pipefail
          ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@$SETUP_ENVTEST_VERSION use $ENVTEST_K8S_VERSION -p path)
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"

      # -Wl,-z,lazy 는 host gcc 가 강제하는 BIND_NOW 플래그를 override 한다. 통합 테스트 binary 가
      # cuda 패키지를 통해 go-nvml CGO PLT 엔트리를 가지지만 libnvidia-ml.so 가 없는 ubuntu-latest
      # runner 에서는 BIND_NOW 가 startup 시점에 NVML 심볼 해상을 강제해 binary 가 깨진다. lazy
      # binding 으로 변경하면 NVML 심볼은 runtime 의 dlopen / dlsym 경로로만 접근되어 production
      # 동작 (go-nvml 의 dlopen) 과 일치한다.
      - name: Run integration tests
        env:
          KUBEBUILDER_ASSETS: ${{ steps.envtest.outputs.assets }}
        run: |
          go test -tags=integration -race -timeout=60s \
            -ldflags='-extldflags "-Wl,-z,lazy"' \
            ./internal/gpuobs/integration/...
