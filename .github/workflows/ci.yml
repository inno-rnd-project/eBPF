name: ci

# #421 CI 검증 게이트. 종전에는 integration (-tags=integration) 과 promtool (check-prometheus-rules)
# 만 CI 에 있어 유닛 테스트와 swagger drift 와 vet / gofmt / lint 가 로컬 실행 관행에만 의존했다.
# 본 워크플로가 그 수동 선언을 기계 검증으로 대체한다. BPF .o embed (netobs / cuda) 가 gitignore
# 대상이라 유닛 테스트와 lint 이전에 integration.yml 과 동일한 생성 단계가 선행된다.
#
# 실행 시간 예산: 캐시 hit 시 5분 이내, 미스 시 10분 이내 (generate 2분 + test 2분 + lint 3분).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # BPF 생성 도구 체인. integration.yml 과 동일 구성이며 근거도 그쪽 주석을 따른다.
      - name: Install clang / llvm / libbpf-dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev

      - name: Install bpftool (libbpf prebuilt static)
        env:
          BPFTOOL_VERSION: v7.4.0
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool

      - name: Verify host BTF availability
        run: |
          if [ ! -r /sys/kernel/btf/vmlinux ]; then
            echo "::error::/sys/kernel/btf/vmlinux not readable on this runner; BPF generation cannot proceed"
            exit 1
          fi

      # netobs 와 cuda 의 gitignore 대상 .o 를 생성한다. go test ./... 와 golangci-lint 의 typecheck
      # 가 //go:embed 로 이 파일들을 요구한다 (nccl 은 build tag 뒤라 생성 불요).
      - name: Generate BPF artifacts
        run: |
          make generate
          make generate-gpuobs

      - name: gofmt check
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "::error::gofmt 위반 파일:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1 -timeout=10m

      - name: golangci-lint
        run: make lint

      # swagger 산출물이 어노테이션과 어긋난 채 커밋되지 않았는지 검사한다. swag 는 Makefile 이
      # go run @v1.16.4 로 모듈 버전 고정 실행하므로 별도 설치가 필요 없고 로컬과 동일 빌드가
      # 보장된다 (GOPATH 바이너리는 같은 버전을 자칭해도 산출이 어긋날 수 있음을 실측).
      - name: Swagger drift check
        run: make check-swagger-drift

      - name: Version alignment check
        run: make check-version-alignment
