# gpuobs-memory-node-measured.test.yaml 은 #274 의 노드 실측 memory 재정의와 #286 의 위험 구간
# health 매핑 회귀 검증 promtool unit test 다. 핵심 회귀는 "tight-limit pod 가 노드·클러스터 지표를
# 지배하지 않는다" 와 "정상 상주 사용률은 health 1.0 으로 읽힌다" 다. n1 에 working_set/limit 0.95
# 인 pod (dcgm-exporter 패턴) 가 있어도 노드 실측 사용률이 0.3 이면 노드 pressure 는 0.3 이고,
# health 는 위험 구간 매핑 (0.8 이하 1.0, 0.8~0.95 선형 하강, 0.95 이상 0) 으로 1.0 이어야 한다.
# pod 단위 score 는 그 pod 의 OOM 근접도로 0.95 그대로 유지된다. 두 번째 케이스는 매핑의 경계값
# (0.8 / 0.875 / 0.95) 을 단정한다.
rule_files:
  - gpuobs.yaml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      # n1 노드 실측: Available 700 / Total 1000 → 사용률 0.3.
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.1:9100"}'
        values: '700x20'
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.1:9100"}'
        values: '1000x20'
      - series: 'node_uname_info{instance="10.0.0.1:9100",nodename="n1"}'
        values: '1x20'
      # 동일 instance 를 다른 job 이 이중 scrape 한 중복 uname 시리즈. 사전 집계 (max by) 가 없으면
      # group_left 조인이 many-to-many 로 평가 실패해 memory pressure 가 전멸하는 회귀를 가드한다.
      - series: 'node_uname_info{instance="10.0.0.1:9100",nodename="n1",job="dup-scrape"}'
        values: '1x20'
      # n2 노드 실측: 사용률 0.1 (cluster worst 판정 대조용).
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.2:9100"}'
        values: '900x20'
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.2:9100"}'
        values: '1000x20'
      - series: 'node_uname_info{instance="10.0.0.2:9100",nodename="n2"}'
        values: '1x20'
      # n1 의 tight-limit pod: working_set 950 / limit 1000 → pod score 0.95 (dcgm-exporter 패턴).
      - series: 'container_memory_working_set_bytes{node="n1",namespace="mon",pod="dcgm"}'
        values: '950x20'
      - series: 'kube_pod_container_resource_limits{namespace="mon",pod="dcgm",resource="memory"}'
        values: '1000x20'

    promql_expr_test:
      # 핵심 회귀: 노드 pressure 는 실측 0.3 (tight-limit pod 0.95 가 승격되지 않음).
      - expr: node:memory_pressure_score:5m
        eval_time: 5m
        exp_samples:
          - labels: 'node:memory_pressure_score:5m{node="n1"}'
            value: 0.30000000000000004
          - labels: 'node:memory_pressure_score:5m{node="n2"}'
            value: 0.09999999999999998
      # 노드 health: 사용률 0.3 은 위험 구간 (0.8) 미만이라 1.0 (#286).
      - expr: node:memory_health_score:5m{node="n1"}
        eval_time: 5m
        exp_samples:
          - labels: 'node:memory_health_score:5m{node="n1"}'
            value: 1
      # cluster health 도 worst 노드 (n1 0.3) 가 위험 구간 미만이라 1.0.
      - expr: cluster:memory_health_score:5m
        eval_time: 5m
        exp_samples:
          - labels: 'cluster:memory_health_score:5m'
            value: 1
      # pod 단위 score 는 OOM 근접도 의미로 0.95 그대로 유지된다 (pressure?scope=pod 랭킹 소스).
      - expr: pod:memory_pressure_score:5m
        eval_time: 5m
        exp_samples:
          - labels: 'pod:memory_pressure_score:5m{node="n1",namespace="mon",pod="dcgm",src_namespace="mon",src_pod="dcgm"}'
            value: 0.95

  # #286 위험 구간 매핑 경계값. b1 사용률 0.8 (구간 시작, health ~1), b2 사용률 0.875 (구간 중앙,
  # health 0.5), b3 사용률 0.95 (구간 끝, health 0). 기대값은 rule 산식 (0.95 - usage) / 0.15 의
  # IEEE double 정확 표현이다 (부동소수점 전례: gpuobs-cause-rise 의 0.44999...).
  - interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.11:9100"}'
        values: '200x20'
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.11:9100"}'
        values: '1000x20'
      - series: 'node_uname_info{instance="10.0.0.11:9100",nodename="b1"}'
        values: '1x20'
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.12:9100"}'
        values: '125x20'
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.12:9100"}'
        values: '1000x20'
      - series: 'node_uname_info{instance="10.0.0.12:9100",nodename="b2"}'
        values: '1x20'
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.13:9100"}'
        values: '50x20'
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.13:9100"}'
        values: '1000x20'
      - series: 'node_uname_info{instance="10.0.0.13:9100",nodename="b3"}'
        values: '1x20'

    promql_expr_test:
      - expr: node:memory_health_score:5m
        eval_time: 5m
        exp_samples:
          - labels: 'node:memory_health_score:5m{node="b1"}'
            value: 0.9999999999999994
          - labels: 'node:memory_health_score:5m{node="b2"}'
            value: 0.4999999999999997
          - labels: 'node:memory_health_score:5m{node="b3"}'
            value: 0
      # cluster 는 worst 노드 (b3, 사용률 0.95) 기준 0 (min(node) 등가의 max pressure 규약 유지).
      - expr: cluster:memory_health_score:5m
        eval_time: 5m
        exp_samples:
          - labels: 'cluster:memory_health_score:5m'
            value: 0
