# gpuobs-victim-cause-gating.test.yaml 은 #408 의 pod/victim 차원 idle cause 게이팅 검증 promtool
# unit test 다. 첫 블록은 오귀속 방지 회귀로, 유휴 노드 (n1) 와 바쁜 노드 (n2) 혼재 시 종전 전역
# 스칼라 게이트 (max(node:gpu_idle:5m) > 0.5) 는 n2 의 victim weight 까지 emit 했다. 노드별 게이팅
# (and on(node)) 후에는 유휴 노드 n1 의 victim 만 weight 가 emit 되어야 한다.
rule_files:
  - gpuobs.yaml

evaluation_interval: 30s

tests:
  # 오귀속 방지: n1 유휴 (util 5%), n2 바쁨 (util 90%). 두 노드의 victim 이 같은 cpu_throttle
  # 압박 (0.8) 을 받는다. 유휴 노드 n1 의 victim 만 weight 1 (단독 cause) 로 emit 되고, 바쁜
  # 노드 n2 의 victim 은 emit 되지 않아야 한다. 종전 전역 게이트면 n1 의 유휴가 게이트를 열어
  # n2 victim 도 weight 1 로 emit 됐다.
  - interval: 30s
    input_series:
      - series: 'gpuobs_device_utilization_percent{node="n1",gpu_uuid="g1"}'
        values: '5x40'
      - series: 'gpuobs_device_utilization_percent{node="n2",gpu_uuid="g2"}'
        values: '90x40'
      - series: 'pod:cpu_throttle_score:5m{node="n1",src_namespace="ns",src_pod="v-idle"}'
        values: '0.8x40'
      - series: 'pod:cpu_throttle_score:5m{node="n2",src_namespace="ns",src_pod="v-busy"}'
        values: '0.8x40'

    promql_expr_test:
      # 전제 확인: n1 은 유휴 (0.95), n2 는 바쁨 (0.1).
      - expr: node:gpu_idle:5m
        eval_time: 10m
        exp_samples:
          - labels: 'node:gpu_idle:5m{node="n1"}'
            value: 1
          - labels: 'node:gpu_idle:5m{node="n2"}'
            value: 0
      # 유휴 노드 n1 의 victim 만 weight emit (단독 cause 라 정규화 1).
      - expr: pod:gpu_idle_cause_weight:5m
        eval_time: 10m
        exp_samples:
          - labels: 'pod:gpu_idle_cause_weight:5m{cause="cpu_throttle",node="n1",victim_namespace="ns",victim_pod="v-idle"}'
            value: 1

  # pcie broadcast 한정 (#408): GPU 귀속 pod (gpuobs_pod_memory_used_bytes 보유) 만 pcie_saturation
  # cause score 를 받는다. 종전 kube_pod_info broadcast 면 비 GPU pod (v-plain) 도 동일 score 를
  # 복제받았다.
  - interval: 30s
    input_series:
      - series: 'gpuobs_device_utilization_percent{node="n1",gpu_uuid="g1"}'
        values: '5x40'
      - series: 'node:gpu_pcie_saturation_score:5m{node="n1"}'
        values: '0.8x40'
      - series: 'gpuobs_pod_memory_used_bytes{node="n1",src_namespace="ns",src_pod="v-gpu",src_pod_uid="u1",gpu_uuid="g1",gpu_index="0"}'
        values: '1000000x40'
      - series: 'kube_pod_info{node="n1",namespace="ns",pod="v-plain"}'
        values: '1x40'

    promql_expr_test:
      - expr: pod:gpu_idle_cause_score:5m{cause="pcie_saturation"}
        eval_time: 10m
        exp_samples:
          - labels: 'pod:gpu_idle_cause_score:5m{cause="pcie_saturation",node="n1",victim_namespace="ns",victim_pod="v-gpu"}'
            value: 0.8
  # tie-breaker offset 가드 (#408): 유휴 노드 n1 에 victim 6개, 각 victim 은 서로 다른 cause 1종만
  # 보유해 그 cause 가 자기 dominant 로 승리해야 한다 (weight 1 + cause 별 offset). offset 목록에서
  # cause 가 누락되면 + on(cause) group_left() 매칭 실패로 해당 victim 의 dominant 시리즈 자체가
  # 사라져 본 가드가 잡는다. pod:gpu_idle_cause_score:5m 에 cause 를 추가하면 offset 목록과 본
  # 블록을 함께 갱신한다.
  - interval: 30s
    input_series:
      - series: 'gpuobs_device_utilization_percent{node="n1",gpu_uuid="g1"}'
        values: '5x40'
      - series: 'pod:cpu_throttle_score:5m{node="n1",src_namespace="ns",src_pod="v-cpu"}'
        values: '0.8x40'
      - series: 'pod:memory_pressure_score:5m{node="n1",src_namespace="ns",src_pod="v-mem"}'
        values: '0.8x40'
      - series: 'pod:network_pressure_score:5m{node="n1",src_namespace="ns",src_pod="v-net"}'
        values: '0.8x40'
      - series: 'pod:host_compute_stall_score:5m{node="n1",src_namespace="ns",src_pod="v-stall"}'
        values: '0.8x40'
      - series: 'pod:cgroup_contention_score:5m{node="n1",src_namespace="ns",src_pod="v-cg"}'
        values: '0.8x40'
      - series: 'node:gpu_pcie_saturation_score:5m{node="n1"}'
        values: '0.8x40'
      - series: 'gpuobs_pod_memory_used_bytes{node="n1",src_namespace="ns",src_pod="v-pcie",src_pod_uid="u1",gpu_uuid="g1",gpu_index="0"}'
        values: '1000000x40'

    promql_expr_test:
      - expr: victim:gpu_idle_dominant_cause:5m
        eval_time: 10m
        exp_samples:
          - labels: 'victim:gpu_idle_dominant_cause:5m{cause="cgroup_contention",node="n1",victim_namespace="ns",victim_pod="v-cg"}'
            value: 1.000006
          - labels: 'victim:gpu_idle_dominant_cause:5m{cause="cpu_throttle",node="n1",victim_namespace="ns",victim_pod="v-cpu"}'
            value: 1.000005
          - labels: 'victim:gpu_idle_dominant_cause:5m{cause="host_compute_stall",node="n1",victim_namespace="ns",victim_pod="v-stall"}'
            value: 1.000004
          - labels: 'victim:gpu_idle_dominant_cause:5m{cause="memory_pressure",node="n1",victim_namespace="ns",victim_pod="v-mem"}'
            value: 1.000003
          - labels: 'victim:gpu_idle_dominant_cause:5m{cause="network_pressure",node="n1",victim_namespace="ns",victim_pod="v-net"}'
            value: 1.000002
          - labels: 'victim:gpu_idle_dominant_cause:5m{cause="pcie_saturation",node="n1",victim_namespace="ns",victim_pod="v-pcie"}'
            value: 1.000001
