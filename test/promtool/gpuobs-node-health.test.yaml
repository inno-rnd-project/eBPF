# gpuobs-node-health.test.yaml 은 #264 의 노드 차원 health rule 4종 검증 promtool unit test 다.
# cluster health 와 동일 산식을 노드 차원으로 이식했는지, 노드별로 독립 산출되는지 단정한다.
# n1 은 cpu throttle 이 높아 cpu health 가 낮고, n2 는 정상이라 높다. network 는 n1 의 drop rate
# 로 낮아진다. n3 은 cpu limit pod 가 없어 throttle 입력이 비지만 (#347), kube_node_info 앵커 (#430)
# fallback 으로 cpu health 1.0 을 받는다.
rule_files:
  - gpuobs.yaml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      # n1: cpu throttle 0.6 pod 1개 → p95 ≈ 0.6 → cpu health = 1 - 0.6 = 0.4
      - series: 'pod:cpu_throttle_score:5m{node="n1",src_namespace="ns1",src_pod="p1"}'
        values: '0.6x20'
      # n2: cpu throttle 0.1 → cpu health = 0.9
      - series: 'pod:cpu_throttle_score:5m{node="n2",src_namespace="ns2",src_pod="p2"}'
        values: '0.1x20'
      # n1: 노드 실측 메모리 (#274). Available 800 / Total 1000 → 사용률 0.2 → 위험 구간 (0.8) 미만이라
      # memory health = 1.0 (#286).
      # node_exporter 는 node 라벨이 없어 node_uname_info 의 nodename 조인으로 부여된다.
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.1:9100"}'
        values: '800x20'
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.1:9100"}'
        values: '1000x20'
      - series: 'node_uname_info{instance="10.0.0.1:9100",nodename="n1"}'
        values: '1x20'
      # n1: drop rate 50/s → network health = 1 - 50/100 = 0.5
      - series: 'netobs_drop_events_labeled_total{node="n1",src_namespace="ns1",src_workload="w1",drop_reason="r",drop_category="c"}'
        values: '0+1500x20'
      # n3 (#347): cpu limit pod 없음 → pod:cpu_throttle_score 입력 부재. node_exporter 실측만 존재해
      # memory_health 는 산출되고, 이를 앵커로 cpu health 가 fallback 1.0 을 받는다. Available 900 /
      # Total 1000 → 사용률 0.1 → memory health 1.0.
      - series: 'node_memory_MemAvailable_bytes{instance="10.0.0.3:9100"}'
        values: '900x20'
      - series: 'node_memory_MemTotal_bytes{instance="10.0.0.3:9100"}'
        values: '1000x20'
      - series: 'node_uname_info{instance="10.0.0.3:9100",nodename="n3"}'
        values: '1x20'
      # #430 cpu fallback 앵커. n3 처럼 throttle 입력이 없는 노드의 1.0 판정이 본 시리즈에서 온다.
      - series: 'kube_node_info{node="n3"}'
        values: '1+0x40'

    promql_expr_test:
      # cpu health: 노드별 독립. n1 0.4, n2 0.9. n3 (#347) 은 throttle 입력이 없어도 kube_node_info
      # 앵커 fallback 으로 1.0 을 받는다 (cpu limit pod 없음 = throttle 불가 = 공급 정체 없음).
      - expr: node:cpu_health_score:5m
        eval_time: 5m
        exp_samples:
          - labels: 'node:cpu_health_score:5m{node="n1"}'
            value: 0.4
          - labels: 'node:cpu_health_score:5m{node="n2"}'
            value: 0.9
          - labels: 'node:cpu_health_score:5m{node="n3"}'
            value: 1
      # memory health: n1 1.0, n3 1.0 (위험 구간 매핑 #286, n2 는 node_exporter 시리즈 없어 산출
      # 안 됨). cpu fallback 앵커는 #430 부터 memory 가 아니라 kube_node_info 다.
      - expr: node:memory_health_score:5m
        eval_time: 5m
        exp_samples:
          - labels: 'node:memory_health_score:5m{node="n1"}'
            value: 1
          - labels: 'node:memory_health_score:5m{node="n3"}'
            value: 1
      # network health: n1 drop 50/s → 0.5.
      - expr: node:network_health_score:5m{node="n1"}
        eval_time: 5m
        exp_samples:
          - labels: 'node:network_health_score:5m{node="n1"}'
            value: 0.5
