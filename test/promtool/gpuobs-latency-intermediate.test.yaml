# gpuobs-latency-intermediate.test.yaml 은 #412 의 stage latency bucket 공통 중간 rule 체인 검증이다.
# raw bucket 을 세 rule 이 중복 전수 스캔하던 것을 pod:netobs_stage_latency_rate_le:5m 하나로 접고
# 파생 재집계로 전환했는데, rate 합산의 선형성 위에서 산출이 종전과 동일해야 한다. 결정적 bucket
# 입력으로 중간 rule 의 rate 값과 두 파생 p99 (node 단위, pod 단위) 의 quantile 값을 고정한다.
rule_files:
  - gpuobs.yaml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      # 단일 pod 의 2-bucket histogram. 30초당 le=0.1 이 10, 전체가 30 증가 → rate 는 1/3 과 1.
      - series: 'netobs_pod_stage_latency_labeled_seconds_bucket{le="0.1",stage="sendmsg_ret",node="n1",src_namespace="ns",src_pod="p1",src_pod_uid="u1",traffic_scope="pod_to_pod",direction="egress",dst_namespace="",dst_workload="",dst_pod_uid=""}'
        values: '0+10x40'
      - series: 'netobs_pod_stage_latency_labeled_seconds_bucket{le="0.5",stage="sendmsg_ret",node="n1",src_namespace="ns",src_pod="p1",src_pod_uid="u1",traffic_scope="pod_to_pod",direction="egress",dst_namespace="",dst_workload="",dst_pod_uid=""}'
        values: '0+30x40'
      - series: 'netobs_pod_stage_latency_labeled_seconds_bucket{le="+Inf",stage="sendmsg_ret",node="n1",src_namespace="ns",src_pod="p1",src_pod_uid="u1",traffic_scope="pod_to_pod",direction="egress",dst_namespace="",dst_workload="",dst_pod_uid=""}'
        values: '0+30x40'

    promql_expr_test:
      # 중간 rule: stage 와 dst 라벨이 접히고 (node, src_*, le) 만 남는다. rate 는 30초당 10 → 1/3.
      - expr: pod:netobs_stage_latency_rate_le:5m{le="0.1"}
        eval_time: 10m
        exp_samples:
          - labels: 'pod:netobs_stage_latency_rate_le:5m{le="0.1",node="n1",src_namespace="ns",src_pod="p1",src_pod_uid="u1"}'
            value: 0.33333333333333337
      # node 단위 p99. 목표 누적 0.99 가 (0.1, 0.5] 버킷에 있어 선형 보간: 0.1 + 0.4*(0.99-1/3)/(2/3) = 0.494.
      - expr: node:netobs_pod_stage_latency_p99:5m
        eval_time: 10m
        exp_samples:
          - labels: 'node:netobs_pod_stage_latency_p99:5m{node="n1"}'
            value: 0.494
      # pod 단위 p99 는 단일 pod 라 node 단위와 동일 값이어야 한다 (동등성 고정).
      - expr: pod:network_p99_latency_seconds:5m
        eval_time: 10m
        exp_samples:
          - labels: 'pod:network_p99_latency_seconds:5m{node="n1",src_namespace="ns",src_pod="p1",src_pod_uid="u1"}'
            value: 0.494
