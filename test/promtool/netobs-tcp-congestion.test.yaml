# netobs-tcp-congestion.test.yaml 은 #371 의 NetObsTcpCongestion baseline 부재 fallback 검증이다.
# 종전 expr 은 cwnd backoff 판정이 offset 5m baseline 에만 의존해 갓 뜬 pod 이나 5분 미만 flow 는
# and 우변이 비어 심한 혼잡에도 발화하지 않았다. 네 케이스를 단정한다. 첫째, baseline 없는 신생
# flow 의 심한 혼잡 (cwnd 2, srtt 300 ms) 은 fallback 으로 발화한다 (종전이면 침묵). 둘째, 신생
# flow 라도 cwnd 가 절대 하한 (4) 초과면 발화하지 않는다. 셋째, baseline 이 있는 flow 는 cwnd 가
# 하한 이하라도 상대 비교 미충족이면 unless 게이트로 fallback 이 배제되어 발화하지 않는다 (기존
# 소비자 무영향). 넷째, baseline 상대 비교의 기존 발화 경로는 그대로다.
rule_files:
  - gpuobs.yaml

evaluation_interval: 30s

tests:
  # 케이스 1: 신생 flow 심한 혼잡. baseline 부재 + cwnd 2 + srtt 300 ms → fallback 발화.
  - interval: 30s
    input_series:
      - series: 'netobs_tcp_state_max_srtt_seconds{namespace="ns",pod="p1",node="n1"}'
        values: '0.3x10'
      - series: 'netobs_tcp_state_min_cwnd{namespace="ns",pod="p1",node="n1"}'
        values: '2x10'

    alert_rule_test:
      - alertname: NetObsTcpCongestion
        eval_time: 3m
        exp_alerts:
          - exp_labels:
              severity: warning
              component: netobs
              namespace: ns
              pod: p1
              node: n1
            exp_annotations:
              summary: "netobs tcp congestion on receiving pod ns/p1 (node=n1)"
              description: "Receiving pod ns/p1 on node n1 shows max srtt 300ms with min_cwnd dropped below 50% of the previous 5-minute baseline (or at/below the absolute floor 4 for young flows without a baseline, #371), sustained over 2 minutes. Inspect peer congestion or downstream link saturation via netobs_tcp_state_min_cwnd / max_srtt_seconds / min_ssthresh."

  # 케이스 2: 신생 flow 라도 cwnd 가 절대 하한 (4) 초과면 발화하지 않는다.
  - interval: 30s
    input_series:
      - series: 'netobs_tcp_state_max_srtt_seconds{namespace="ns",pod="p2",node="n1"}'
        values: '0.3x10'
      - series: 'netobs_tcp_state_min_cwnd{namespace="ns",pod="p2",node="n1"}'
        values: '8x10'

    alert_rule_test:
      - alertname: NetObsTcpCongestion
        eval_time: 3m
        exp_alerts: []

  # 케이스 3: baseline 있는 flow 는 cwnd 4 (하한 이하) 라도 상대 비교 (baseline 6 의 50% = 3 미만)
  # 미충족이면 unless 게이트로 fallback 이 배제되어 발화하지 않는다. 종전 동작과 동일하다.
  - interval: 30s
    input_series:
      - series: 'netobs_tcp_state_max_srtt_seconds{namespace="ns",pod="p3",node="n1"}'
        values: '0.3x26'
      - series: 'netobs_tcp_state_min_cwnd{namespace="ns",pod="p3",node="n1"}'
        values: '6x20 4x6'

    alert_rule_test:
      - alertname: NetObsTcpCongestion
        eval_time: 13m
        exp_alerts: []

  # 케이스 4: baseline 상대 비교의 기존 발화 경로 보존. baseline 10 의 50% = 5 미만인 cwnd 2 는
  # 종전과 동일하게 발화한다.
  - interval: 30s
    input_series:
      - series: 'netobs_tcp_state_max_srtt_seconds{namespace="ns",pod="p4",node="n1"}'
        values: '0.3x26'
      - series: 'netobs_tcp_state_min_cwnd{namespace="ns",pod="p4",node="n1"}'
        values: '10x20 2x6'

    alert_rule_test:
      - alertname: NetObsTcpCongestion
        eval_time: 13m
        exp_alerts:
          - exp_labels:
              severity: warning
              component: netobs
              namespace: ns
              pod: p4
              node: n1
            exp_annotations:
              summary: "netobs tcp congestion on receiving pod ns/p4 (node=n1)"
              description: "Receiving pod ns/p4 on node n1 shows max srtt 300ms with min_cwnd dropped below 50% of the previous 5-minute baseline (or at/below the absolute floor 4 for young flows without a baseline, #371), sustained over 2 minutes. Inspect peer congestion or downstream link saturation via netobs_tcp_state_min_cwnd / max_srtt_seconds / min_ssthresh."
