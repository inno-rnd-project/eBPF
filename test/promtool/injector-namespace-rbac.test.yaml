              runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/docs/injector/auto-scenarios.md#loadscenarionamespacerbacmissing"
          - exp_labels: {severity: warning, component: injector, allowed_namespace: restart}
            exp_annotations:
              summary: "loadscenario allowed namespace restart is missing pods RBAC"
              description: "허용 namespace restart에 workload-injector ServiceAccount의 pods 권한(create, delete, get, list 중 하나 이상)이 15분째 없다. 이 namespace에서 생성하거나 대상으로 삼는 run은 forbidden으로 실패한다. loadscenario_namespace_rbac_allowed의 verb 라벨로 빠진 권한을 확인하고 Role과 RoleBinding을 추가하거나 INJECTOR_ALLOWED_TARGET_NAMESPACES에서 namespace를 뺀다."
              runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/docs/injector/auto-scenarios.md#loadscenarionamespacerbacmissing"
      - alertname: LoadScenarioNamespaceRBACMissing
        eval_time: 34m
        exp_alerts:
          - exp_labels: {severity: warning, component: injector, allowed_namespace: missing}
            exp_annotations:
              summary: "loadscenario allowed namespace missing is missing pods RBAC"
              description: "허용 namespace missing에 workload-injector ServiceAccount의 pods 권한(create, delete, get, list 중 하나 이상)이 15분째 없다. 이 namespace에서 생성하거나 대상으로 삼는 run은 forbidden으로 실패한다. loadscenario_namespace_rbac_allowed의 verb 라벨로 빠진 권한을 확인하고 Role과 RoleBinding을 추가하거나 INJECTOR_ALLOWED_TARGET_NAMESPACES에서 namespace를 뺀다."
              runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/docs/injector/auto-scenarios.md#loadscenarionamespacerbacmissing"
          - exp_labels: {severity: warning, component: injector, allowed_namespace: restart}
            exp_annotations:
              summary: "loadscenario allowed namespace restart is missing pods RBAC"
              description: "허용 namespace restart에 workload-injector ServiceAccount의 pods 권한(create, delete, get, list 중 하나 이상)이 15분째 없다. 이 namespace에서 생성하거나 대상으로 삼는 run은 forbidden으로 실패한다. loadscenario_namespace_rbac_allowed의 verb 라벨로 빠진 권한을 확인하고 Role과 RoleBinding을 추가하거나 INJECTOR_ALLOWED_TARGET_NAMESPACES에서 namespace를 뺀다."
              runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/docs/injector/auto-scenarios.md#loadscenarionamespacerbacmissing"
      - alertname: LoadScenarioNamespaceRBACMissing
        eval_time: 35m
        exp_alerts:
          - exp_labels: {severity: warning, component: injector, allowed_namespace: late}
            exp_annotations:
              summary: "loadscenario allowed namespace late is missing pods RBAC"
              description: "허용 namespace late에 workload-injector ServiceAccount의 pods 권한(create, delete, get, list 중 하나 이상)이 15분째 없다. 이 namespace에서 생성하거나 대상으로 삼는 run은 forbidden으로 실패한다. loadscenario_namespace_rbac_allowed의 verb 라벨로 빠진 권한을 확인하고 Role과 RoleBinding을 추가하거나 INJECTOR_ALLOWED_TARGET_NAMESPACES에서 namespace를 뺀다."
              runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/docs/injector/auto-scenarios.md#loadscenarionamespacerbacmissing"
          - exp_labels: {severity: warning, component: injector, allowed_namespace: missing}
            exp_annotations:
              summary: "loadscenario allowed namespace missing is missing pods RBAC"
              description: "허용 namespace missing에 workload-injector ServiceAccount의 pods 권한(create, delete, get, list 중 하나 이상)이 15분째 없다. 이 namespace에서 생성하거나 대상으로 삼는 run은 forbidden으로 실패한다. loadscenario_namespace_rbac_allowed의 verb 라벨로 빠진 권한을 확인하고 Role과 RoleBinding을 추가하거나 INJECTOR_ALLOWED_TARGET_NAMESPACES에서 namespace를 뺀다."
