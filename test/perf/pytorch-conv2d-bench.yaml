# pytorch-conv2d-bench 는 Conv2d 만 반복 호출해 cuDNN 내부의 cuMemcpy2D / 3D 경로를 강하게
# 자극하기 위한 워크로드다. ResNet50 의 in-place op fusion 으로 줄어드는 직접적 cuMemcpy2D 호출이
# 본 워크로드에서는 큰 batch 의 Conv 만 사용해 더 빈번하게 발생한다. cuDNN heuristic 이 im2col +
# cuMemcpy2D 변환을 선택하는 입력 shape 를 노린다.
#
# 사용 목적:
#   - dispatch hot path 측정 외에 cuMemcpy2D / 3D 의 BPF 측 4-6회 bpf_probe_read_user 호출이
#     overhead 에 미치는 영향을 따로 관측한다
#   - gpuobs_cuda_unknown_dir_bytes_total 또는 dtod / h2d 가 의미 있게 누적되는지 검증
apiVersion: v1
kind: Pod
metadata:
  name: pytorch-conv2d-bench
  namespace: ebpf-project
  labels:
    app: pytorch-conv2d-bench
    perf-workload: cuda-uprobe
spec:
  restartPolicy: Never
  nodeSelector:
    accelerator: nvidia
  containers:
  - name: bench
    image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
    imagePullPolicy: IfNotPresent
    command: ["python", "-c"]
    args:
    - |
      import torch
      import torch.nn as nn

      torch.backends.cudnn.benchmark = True
      device = torch.device("cuda")
      conv = nn.Sequential(
          nn.Conv2d(64, 128, kernel_size=3, padding=1),
          nn.Conv2d(128, 128, kernel_size=5, padding=2),
          nn.Conv2d(128, 256, kernel_size=7, padding=3),
      ).to(device).eval()
      x = torch.randn(16, 64, 112, 112, device=device)
      print(f"warmup: device={torch.cuda.get_device_name(0)}", flush=True)
      with torch.inference_mode():
          for _ in range(20):
              _ = conv(x)
          torch.cuda.synchronize()
          print("warmup done; entering steady-state loop", flush=True)
          while True:
              _ = conv(x)
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: 4Gi
      requests:
        cpu: 200m
        memory: 1Gi
