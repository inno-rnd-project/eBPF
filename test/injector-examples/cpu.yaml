apiVersion: batch/v1
kind: Job
metadata:
  name: workload-injector-cpu-example
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: workload-injector
    app.kubernetes.io/part-of: ebpf-project
    app.kubernetes.io/component: load-injector
    injector.kind: cpu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-injector
        app.kubernetes.io/component: load-injector
        injector.kind: cpu
    spec:
      serviceAccountName: workload-injector
      restartPolicy: Never
      containers:
        - name: workload-injector
          # 운영자가 make image-build-workload-injector 후 dev cluster 노드에 로컬 image 로 두면
          # imagePullPolicy: Never 그대로 Pod 가 실행된다.
          image: workload-injector:0.4.8
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: workload-injector
          env:
            - name: KIND
              value: "cpu"
            - name: TARGET_NAMESPACE
              value: "correlation-stress"
            - name: TARGET_POD
              value: "victim"
            - name: INTENSITY
              value: "500m"
            - name: DURATION
              value: "5m"
          ports:
            - name: metrics
              containerPort: 9840
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
