apiVersion: batch/v1
kind: Job
metadata:
  name: workload-injector-network-example
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: workload-injector
    app.kubernetes.io/part-of: ebpf-project
    app.kubernetes.io/component: load-injector
    injector.kind: network
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-injector
        app.kubernetes.io/component: load-injector
        injector.kind: network
    spec:
      serviceAccountName: workload-injector
      restartPolicy: Never
      containers:
        - name: workload-injector
          image: workload-injector:0.4.8
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: workload-injector
          env:
            - name: KIND
              value: "network"
            - name: TARGET_NAMESPACE
              value: "correlation-stress"
            - name: TARGET_POD
              value: "victim"
            - name: INTENSITY
              value: "100M"
            - name: DURATION
              value: "5m"
          ports:
            - name: metrics
              containerPort: 9840
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
