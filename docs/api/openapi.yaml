  internal_correlation_api.NodeResponse:
    type: object
    properties:
      confidence:
        description: 'Confidence 는 dominant 차원 판정 신뢰도 (0-1, #264) 다. 압박 top1 과 top2
          차원의 격차로,

          gpu-rca 의 신뢰도와 동일 축이라 한 차원이 지배적일수록 1 에 가깝다.'
        type: number
      dominant_dimension:
        type: string
      generated_at:
        type: string
      health:
        description: 'Health 는 차원별 health score (0-1, #264) 다. node:*_health_score:5m
          룰 기반이며 cluster

          health 와 동일 산식의 노드 차원 판이라 GPU 와 비GPU 노드가 같은 해석을 공유한다.'
        type: object
        additionalProperties:
          type: number
      health_notes:
        description: "HealthNotes 는 health 차원의 산출 불가 / 비실측 사유다 (#430 additive, 기존\
          \ 필드와 enum 불변).\n값 도메인은 세 가지로 폐쇄된다.\n  - no_cpu_limit_pods: cpu 가 fallback\
          \ 상수 1.0 으로 채워짐 (CPU limit pod 없음, 실측 아님)\n  - no_gpu: gpu 차원 결측이 GPU 미보유\
          \ 노드의 정상 상태\n  - scrape_gap: 그 외 결측 (입력 시리즈 소실, scrape 실패 계열)\n프론트가 결측 차원을\
          \ 0.00 (최악) 대신 측정 불가로 렌더하는 근거이며, 항목이 없으면 생략된다."
        type: object
        additionalProperties:
          type: string
      node:
        type: string
      overall:
        type: number
      pressure:
        type: object
        additionalProperties:
          type: number
      status:
        type: string
      status_alerts:
        description: 'StatusAlerts 는 이 노드에서 지속성 게이트 (#379, alertStatusMinHold) 를 통과한
          firing alertname

          목록이다 (additive). status_basis=alert 이면 이들이 status 를 올린 근거라 pressure/usage
          가 정상인데

          warn 인 이유를 추적하게 한다. 통과한 alert 가 없으면 생략된다. status/status_basis 필드는 불변이며

          본 필드만 additive 로 더한다 (비목표: 출력 스키마 변경 없음, additive 는 미인지 소비자가 무시).'
