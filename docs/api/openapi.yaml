  internal_correlation_api.GpuDevice:
    type: object
    properties:
      bar1_memory_total_bytes:
        type: number
      bar1_memory_used_bytes:
        type: number
      clocks_mhz:
        description: 'ClocksMhz 는 clock 라벨 (sm / mem / graphics) 별 클럭이고, TemperatureThresholdsCelsius
          는

          threshold 라벨 (slowdown / shutdown / mem_max / gpu_max) 별 임계다. 서브라벨로 device
          당

          다중 시리즈라 단일 필드가 아닌 map 으로 담는다.'
        type: object
        additionalProperties:
          type: number
      compute_mode:
        type: number
      decoder_utilization_percent:
        type: number
      encoder_utilization_percent:
        type: number
      energy_consumption_joules:
        type: number
      fan_speed_percent:
        type: number
      gpu_index:
        type: string
      gpu_uuid:
        type: string
      idle:
        description: 'Idle 은 사용률이 node:gpu_idle:5m rule 과 동일한 임계 (20% 미만) 인지의 instant
          판정이다

          (#304). rule 은 5분 윈도우 비율이고 본 필드는 현재 값 판정이라 순간 부하에서는 어긋날 수 있다.'
        type: boolean
      memory_total_bytes:
        type: number
      memory_used_bytes:
        type: number
      memory_used_ratio:
        type: number
      model:
        type: string
      node:
        type: string
      pcie_link_generation:
        type: number
      pcie_link_width:
        type: number
      pcie_rx_bytes_per_second:
        type: number
      pcie_tx_bytes_per_second:
        type: number
      performance_state:
        type: number
      persistence_mode:
        type: number
      pod_attribution:
        description: 'PodAttribution 은 CUDA pod 귀속 능력 메타데이터 (#279) 다. pods 가 비었을 때
          "실행 중 GPU

          프로세스 없음" 과 "귀속 자체가 불가능" 을 프론트가 구분하는 근거다. 심볼 신호 부재 시 생략된다.'
        allOf:
        - $ref: '#/definitions/internal_correlation_api.PodAttribution'
      pods:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.GpuPod'
      power_limit_enforced_watts:
        type: number
      power_limit_watts:
        type: number
      power_usage_watts:
        type: number
      sm_active_percent:
        description: '아래는 #267 의 device 상세 확장 필드다. gpuobs 가 수집하나 기존 gpu-status 가 노출하지
          않던

          신호로, heatmap 온도 위험도 색칠 (temperature_thresholds_celsius) 과 GPU Detail 페이지

          (클럭, 팬, PCIe, performance state 등) 의 데이터를 채운다. 전부 수집 공백 시 생략되도록

          pointer 또는 omitempty map 이다.


          SMActivePercent 는 gpm_utilization_percent 의 sm_occupancy 다. consumer GPU
          (RTX 등) 는 GPM

          미지원이라 빈 값이고 데이터센터 GPU (A100+) 에서만 채워진다.'
        type: number
      status:
        description: 'Status 는 device 3단 판정 (#279) 이다. 성능성 throttle 활성이면 degraded,
          온도가 slowdown

          임계의 90% 이상이거나 노드의 유의미 NVML 오류율이 alert 임계 (1/s) 를 넘으면 warning, 그 외

          healthy 다. #273 의 GPU health 판정 신호를 device 뱃지 입도로 적용한 것이다.'
        type: string
      temperature_celsius:
        type: number
      temperature_thresholds_celsius:
        type: object
        additionalProperties:
          type: number
      throttle_reasons:
        description: 'ThrottleReasons 는 값이 1 (활성) 인 throttle reason 라벨 목록이다. gpu_idle
          같은 정보성 사유도

          NVML 이 주는 그대로 노출해 프론트가 필터 여부를 결정하게 한다.'
        type: array
        items:
          type: string
      throttle_violation_seconds:
        type: number
      utilization_percent:
        type: number
