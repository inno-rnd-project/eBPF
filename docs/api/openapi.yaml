swagger: '2.0'
info:
  title: netobs unified API
  version: 1.3.1
paths:
  /api/v1/cross-level:
    get:
      description: node 와 pod 와 direction 과 dimension 과 rank 필터 후 pagination 적용한 cross-level
        시리즈 반환
      produces:
      - application/json
      tags:
      - correlation
      summary: List cross-level interference top-N
      parameters:
      - type: string
        description: 공유 node 이름 필터
        name: node
        in: query
      - type: string
        description: pod 의 namespace 필터
        name: pod_namespace
        in: query
      - type: string
        description: pod 이름 필터
        name: pod
        in: query
      - type: string
        description: 방향 필터 (node_to_pod/pod_to_node)
        name: direction
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.CrossLevelListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
  /api/v1/cross-node-interference:
    get:
      description: victim_node 와 suspect_node 와 dimension 과 rank 필터 후 pagination 적용한
        cross-node interference 시리즈 반환
      produces:
      - application/json
      tags:
      - correlation
      summary: List cross-node interference top-N
      parameters:
      - type: string
        description: victim node 이름 필터
        name: victim_node
        in: query
      - type: string
        description: suspect node 이름 필터
        name: suspect_node
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.CrossNodeListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
  /api/v1/events:
    get:
      description: z-score 이상과 noisy-neighbor 간섭을 공통 severity 로 묶어 정렬된 사건 목록과 자연어
        설명, drill-down 링크로 돌려준다. min_severity 미만 사건은 제외한다.
      produces:
      - application/json
      tags:
      - synthesis
      summary: 이벤트 분석 (anomaly + noisy-neighbor 종합)
      parameters:
      - type: string
        description: 최소 severity (low/elevated/high, 기본 elevated)
        name: min_severity
        in: query
      - type: integer
        description: 상위 N 사건 (1-50, 기본 20)
        name: limit
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.EventsResponse'
  /api/v1/health:
    get:
      description: 4 자원 차원(cpu/gpu/memory/network)의 health 점수와 status, 압박이 집중된 node/pod(hotspot),
        전체 dominant 압박 지점, z-score 이상, 한 줄 요약을 한 응답으로 돌려준다. 데이터 부재는 null + status=unknown
        으로 graceful 처리한다.
      produces:
      - application/json
      tags:
      - synthesis
      summary: 클러스터 헬스 + 압박 위치 합성
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.HealthResponse'
  /api/v1/impact-graph:
    get:
      description: suspect → victim 1-hop 엣지로 구성된 영향 전파 그래프의 정점 (out/in degree 포함)
        과 엣지 반환. namespace / min_score 로 유도 부분그래프를 추릴 수 있다
      produces:
      - application/json
      tags:
      - correlation
      summary: Get impact propagation graph
      parameters:
      - type: string
        description: suspect 또는 victim 이 이 namespace 인 엣지만 (유도 부분그래프)
        name: namespace
        in: query
      - type: number
        description: score 가 이 값 이상인 엣지만
        name: min_score
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ImpactGraphResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
  /api/v1/impact-paths:
    get:
      description: 근원 suspect(root)에서 종착 victim(terminal)으로 이어지는 다단계 경로와 근원 요약 반환.
        root_pod / terminal_pod / namespace / min_score 필터 지원
      produces:
      - application/json
      tags:
      - correlation
      summary: List multi-hop impact propagation paths
      parameters:
      - type: string
        description: 근원 suspect pod 이름 필터
        name: root_pod
        in: query
      - type: string
        description: 종착 victim pod 이름 필터
        name: terminal_pod
        in: query
      - type: string
        description: root 또는 terminal 의 namespace 필터
        name: namespace
        in: query
      - type: number
        description: 경로 weakest-link score 하한 필터
        name: min_score
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ImpactPathsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
  /api/v1/node/{node}:
    get:
      description: 노드의 4 차원 pressure 와 종합(overall), dominant 차원, 그 노드 위 top 압박 pod
        를 모아 한 노드의 상태를 한 응답으로 돌려준다.
      produces:
      - application/json
      tags:
      - synthesis
      summary: 노드 1대 전체 압박 상황
      parameters:
      - type: string
        description: 노드 이름
        name: node
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodeResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/noisy-neighbor:
    get:
      description: victim/suspect 와 dimension 과 rank 필터 후 pagination 적용한 noisy neighbor
        시리즈 반환
      produces:
      - application/json
      tags:
      - correlation
      summary: List noisy neighbor top-N
      parameters:
      - type: string
        description: victim Pod 의 namespace 필터
        name: victim_namespace
        in: query
      - type: string
        description: victim Pod 의 이름 필터
        name: victim_pod
        in: query
      - type: string
        description: suspect Pod 의 namespace 필터
        name: suspect_namespace
        in: query
      - type: string
        description: suspect Pod 의 이름 필터
        name: suspect_pod
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: string
        description: victim 영향 종착 차원 필터 (latency/throughput/error/gpu)
        name: victim_signal
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NoisyNeighborListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
  /api/v1/pressure:
    get:
      description: 한 자원 차원의 node 또는 pod 를 pressure score 내림차순으로 랭킹해, /health 의 hotspot
        에서 한 단계 더 파고든다.
      produces:
      - application/json
      tags:
      - synthesis
      summary: 차원별 압박 drill-down 랭킹
      parameters:
      - type: string
        description: 압박 차원 (cpu/gpu/memory/network)
        name: dimension
        in: query
        required: true
      - type: string
        description: 랭킹 입도 (node/pod, 기본 node)
        name: scope
        in: query
      - type: integer
        description: 상위 N (1-100, 기본 10)
        name: limit
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.PressureResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/service-impact:
    get:
      description: victim_namespace 와 victim_workload 와 suspect_node 와 dimension 과
        rank 필터 후 pagination 적용한 service-impact 시리즈 반환
      produces:
      - application/json
      tags:
      - correlation
      summary: List service-impact top-N
      parameters:
      - type: string
        description: victim workload 의 namespace 필터
        name: victim_namespace
        in: query
      - type: string
        description: victim workload (Service 근사) 이름 필터
        name: victim_workload
        in: query
      - type: string
        description: suspect node 이름 필터
        name: suspect_node
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ServiceImpactListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
definitions:
  internal_correlation_api.Anomaly:
    type: object
    properties:
      dimension:
        type: string
      severity:
        type: string
      window:
        type: string
      zscore:
        type: number
  internal_correlation_api.CrossLevelListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.CrossLevel'
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
  internal_correlation_api.CrossNodeListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.NodeInterference'
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
  internal_correlation_api.DimensionHealth:
    type: object
    properties:
      health:
        type: number
      hotspot:
        $ref: '#/definitions/internal_correlation_api.Hotspot'
      status:
        type: string
  internal_correlation_api.DominantPressure:
    type: object
    properties:
      dimension:
        type: string
      node:
        type: string
      pod:
        type: string
      pressure:
        type: number
  internal_correlation_api.ErrorDetail:
    type: object
    properties:
      code:
        type: string
      message:
        type: string
  internal_correlation_api.ErrorResponse:
    type: object
    properties:
      error:
        $ref: '#/definitions/internal_correlation_api.ErrorDetail'
  internal_correlation_api.Event:
    type: object
    properties:
      causal_strength:
        type: number
      dimension:
        type: string
      explanation:
        type: string
      id:
        type: string
      kind:
        type: string
      links:
        type: object
        additionalProperties:
          type: string
      severity:
        type: string
      zscore:
        type: number
  internal_correlation_api.EventsResponse:
    type: object
    properties:
      events:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.Event'
      generated_at:
        type: string
      summary:
        type: string
      window:
        type: string
  internal_correlation_api.HealthResponse:
    type: object
    properties:
      anomalies:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.Anomaly'
      dimensions:
        type: object
        additionalProperties:
          $ref: '#/definitions/internal_correlation_api.DimensionHealth'
      dominant_pressure:
        $ref: '#/definitions/internal_correlation_api.DominantPressure'
      generated_at:
        type: string
      summary:
        type: string
      window:
        type: string
  internal_correlation_api.Hotspot:
    type: object
    properties:
      node:
        type: string
      pressure:
        type: number
      severity:
        type: string
      top_pod:
        type: string
  internal_correlation_api.ImpactGraphResponse:
    type: object
    properties:
      edges:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactGraphEdge'
      nodes:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactGraphNode'
      summary:
        $ref: '#/definitions/internal_correlation_api.ImpactGraphSummary'
  internal_correlation_api.ImpactGraphSummary:
    type: object
    properties:
      edge_count:
        type: integer
      node_count:
        type: integer
  internal_correlation_api.ImpactPathsResponse:
    type: object
    properties:
      paths:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactPath'
      roots:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.RootSuspect'
      summary:
        $ref: '#/definitions/internal_correlation_api.ImpactPathsSummary'
  internal_correlation_api.ImpactPathsSummary:
    type: object
    properties:
      path_count:
        type: integer
      root_count:
        type: integer
  internal_correlation_api.NodePodPressure:
    type: object
    properties:
      dimension:
        type: string
      pod:
        type: string
      pressure:
        type: number
  internal_correlation_api.NodeResponse:
    type: object
    properties:
      dominant_dimension:
        type: string
      generated_at:
        type: string
      node:
        type: string
      overall:
        type: number
      pressure:
        type: object
        additionalProperties:
          type: number
          format: float64
      status:
        type: string
      summary:
        type: string
      top_pods:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.NodePodPressure'
      window:
        type: string
  internal_correlation_api.NoisyNeighborListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.NoisyNeighbor'
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
  internal_correlation_api.PressureEntry:
    type: object
    properties:
      node:
        type: string
      pod:
        type: string
      pressure:
        type: number
      rank:
        type: integer
      severity:
        type: string
  internal_correlation_api.PressureResponse:
    type: object
    properties:
      dimension:
        type: string
      generated_at:
        type: string
      ranking:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.PressureEntry'
      scope:
        type: string
      summary:
        type: string
      window:
        type: string
  internal_correlation_api.ServiceImpactListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.ServiceImpact'
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
  netobs_internal_apicommon.ErrorBody:
    type: object
    properties:
      error:
        $ref: '#/definitions/netobs_internal_apicommon.ErrorDetail'
  netobs_internal_apicommon.ErrorDetail:
    type: object
    properties:
      code:
        type: string
      message:
        type: string
  netobs_internal_apicommon.Page:
    type: object
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
  netobs_internal_correlation.CrossLevel:
    type: object
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      direction:
        $ref: '#/definitions/netobs_internal_correlation.CrossLevelDirection'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      node:
        type: string
      p_value:
        type: number
      pod:
        type: string
      pod_namespace:
        type: string
      pod_uid:
        type: string
      rank:
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect_metric:
        type: string
      victim_metric:
        type: string
  netobs_internal_correlation.CrossLevelDirection:
    type: string
    enum:
    - node_to_pod
    - pod_to_node
    x-enum-varnames:
    - DirectionNodeToPod
    - DirectionPodToNode
  netobs_internal_correlation.ImpactGraphEdge:
    type: object
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      p_value:
        type: number
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_signal:
        $ref: '#/definitions/netobs_internal_correlation.VictimSignal'
  netobs_internal_correlation.ImpactGraphNode:
    type: object
    properties:
      in_degree:
        type: integer
      namespace:
        type: string
      out_degree:
        type: integer
      pod:
        type: string
      pod_uid:
        type: string
  netobs_internal_correlation.ImpactPath:
    type: object
    properties:
      depth:
        type: integer
      hops:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.ImpactPathHop'
      root:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      root_kind:
        $ref: '#/definitions/netobs_internal_correlation.RootKind'
      score:
        type: number
      terminal:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
  netobs_internal_correlation.ImpactPathHop:
    type: object
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      lag_steps:
        type: integer
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_signal:
        $ref: '#/definitions/netobs_internal_correlation.VictimSignal'
  netobs_internal_correlation.NodeInterference:
    type: object
    properties:
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      lag_steps:
        type: integer
      p_value:
        type: number
      rank:
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect_metric:
        type: string
      suspect_node:
        type: string
      victim_metric:
        type: string
      victim_node:
        type: string
  netobs_internal_correlation.NoisyNeighbor:
    type: object
    properties:
      causal_strength:
        description: '#176 CausalStrength 는 Pearson 강도와 Granger 유의성과 effect size 유의성을
          가중합한 [0,1] 통합

          인과강도다. 운영자가 개별 필드 (Score / PValue / ImpactPValue) 를 종합하지 않고 한 값으로 간섭

          여부를 판단하게 한다. 산정식과 가중치는 ComputeCausalStrength 가 단일 진실원으로 보유한다.'
        type: number
      dimension:
        $ref: '#/definitions/netobs_internal_correlation.ResourceDimension'
      granger_ok:
        type: boolean
      impact_magnitude:
        description: '#175 ImpactMagnitude 는 victim 신호별 native 단위 degradation 크기 (latency=seconds,
          throughput=

          bytes/s 감소, error=drops/s 증가, gpu=util 감소) 로 latency 외 신호까지 확장된 effect size
          다.

          ImpactPValue 는 high / low 구간 평균 차이의 Welch t-test two-sided p-value 로 effect
          size 의 통계적

          유의성이다. *OK 가 false 면 표본 부족이나 구간 분산 0 등으로 산정이 graceful skip 된 상태다.'
        type: number
      impact_magnitude_ok:
        type: boolean
      impact_ok:
        type: boolean
      impact_pvalue:
        type: number
      impact_pvalue_ok:
        type: boolean
      impact_seconds:
        description: '#146 effect size 결과. Impact 는 suspect 압박 시 victim latency 증가량
          (seconds) 으로 간섭의

          절대 영향 크기다. Score (상관 강도) 와 독립된 지표라 운영자가 우선순위 판단에 함께 활용한다.

          ImpactOK=false 면 표본 부족 등으로 산정이 skip 되어 Impact 는 0 이다. #175 부터 본 두 필드는

          latency victim 전용 legacy 로 유지된다.'
        type: number
      lag_steps:
        type: integer
      p_value:
        description: '#69 Granger causality 결과. PValue 는 src 가 dst 를 Granger-cause
          하는지의 통계적 유의성.

          GrangerOK=false 면 표본 부족 또는 행렬 singular 로 산정이 자연 skip 되었다.'
        type: number
      rank:
        description: Rank 는 (victim, victim_signal, dimension) 그룹 내 max_abs_value
          내림차순 1-based 순위다. 1 이 가장 강한 상관.
        type: integer
      sample_count:
        type: integer
      score:
        type: number
      suspect:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      suspect_metric:
        type: string
      victim:
        $ref: '#/definitions/netobs_internal_correlation.PodIdentity'
      victim_metric:
        type: string
      victim_signal:
        description: 'VictimSignal 은 victim 영향 종착 차원 (#150 의 latency / throughput
          / error 와 #174 의 gpu) 이다.

          dimension 이 suspect 의 자원 종류라면 VictimSignal 은 victim 측 품질 저하의 종류다. Top-N
          은

          (victim, victim_signal, dimension) 그룹별로 산정되어 한 victim 이 신호별로 독립 순위를 갖는다.'
        allOf:
        - $ref: '#/definitions/netobs_internal_correlation.VictimSignal'
