        items:
          type: string
      status_basis:
        description: 'StatusBasis 는 status 등급을 결정한 신호다 (#324, #325, pressure / usage
          / health / alert).

          등급 동률이면 pressure, usage, health, alert 순으로 귀속하며 status 가 unknown (신호 전부

          부재) 이면 생략된다.'
        type: string
      status_unified:
        description: 'StatusUnified 는 status 와 같은 판정을 노드 상태 단일 규약 어휘 (#381, healthy/warning/critical/

          unknown) 로 노출하는 additive 필드다. 산정은 규약 어휘로 하고 기존 status (ok/warn/degraded/

          unknown) 는 correlation.NodeDetailStatus 환원으로 불변 유지한다. down 은 ready 신호를 조회하지

          않아 방출하지 않는다 (node-map 소관). 신규 소비는 본 필드를 쓴다.'
        type: string
      summary:
        type: string
      top_pods:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.NodePodPressure'
      window:
        type: string
