swagger: '2.0'
info:
  title: netobs unified API
  version: 3.3.0
paths:
  /api/v1/agents:
    get:
      description: netobs 와 gpuobs 에이전트의 스크레이프 up 여부, BPF program attach 상태와 최근 attach
        실패, NVML 오류율, informer lag, cuda 심볼 부착 상태(driver 필수·runtime 선택)를 노드 단위로 집계하고
        기존 알림 규칙과 동일한 임계로 healthy / degraded 를 판정한다. issues 의 alertname 은 playbooks
        조회 입력과 호환된다. node 파라미터로 단일 노드를 조회한다.
      produces:
      - application/json
      tags:
      - meta
      summary: 노드별 관측 에이전트 self-health
      parameters:
      - type: string
        description: 단일 노드 필터 (DNS-1123 형식, 생략 시 전체)
        name: node
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.AgentsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/bandwidth:
    get:
      description: pod 단위 RX/TX 대역폭 (bytes/sec) 을 rate(netobs_pod_bytes_total[5m])
        로 반환한다. RX 는 l4 관점만 수집되고 NIC 관점은 TX 만 제공된다. nodes 는 namespace 필터와 무관한 클러스터
        전체 합계와 NIC capacity 대비 사용률로 NIC 포화 판단 근거를 제공한다.
      produces:
      - application/json
      tags:
      - network
      summary: pod 대역폭 조회
      parameters:
      - type: string
        description: src_namespace 필터
        name: namespace
        in: query
      - type: string
        description: 단일 노드 필터 (DNS-1123 형식, 생략 시 전체)
        name: node
        in: query
      - type: integer
        description: 상위 N pod (합산 대역폭 내림차순, 기본 50)
        name: limit
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.BandwidthResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/cross-level:
    get:
      description: node 와 pod 와 direction 과 dimension 과 rank 필터 후 pagination 적용한 cross-level
        시리즈 반환
      produces:
      - application/json
      tags:
      - impact
      summary: List cross-level interference top-N
      parameters:
      - type: string
        description: 공유 node 이름 필터
        name: node
        in: query
      - type: string
        description: pod 의 namespace 필터
        name: pod_namespace
        in: query
      - type: string
        description: pod 이름 필터
        name: pod
        in: query
      - type: string
        description: 방향 필터 (node_to_pod/pod_to_node)
        name: direction
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.CrossLevelListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/cross-node-interference:
    get:
      description: victim_node 와 suspect_node 와 dimension 과 rank 필터 후 pagination 적용한
        cross-node interference 시리즈 반환
      produces:
      - application/json
      tags:
      - impact
      summary: List cross-node interference top-N
      parameters:
      - type: string
        description: victim node 이름 필터
        name: victim_node
        in: query
      - type: string
        description: suspect node 이름 필터
        name: suspect_node
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.CrossNodeListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/drops:
    get:
      description: netobs_drop_events_labeled_total(항상 수집) 기반으로 node·workload·reason·category·direction
        별 drop rate 랭킹을 돌려준다. NETOBS_DROP_FLOW_ALLOW_NAMESPACES allow-list 가 켜진 경우
        5-tuple flow(pod·src/dst ip:port·마지막 발생 시점)와 커널 stack 함수 상세가 flows/stacks
        에 채워지며, flow_detail_enabled 로 활성 여부를 알린다. cilium_drops 는 CNI(BPF) 계층 drop(NetworkPolicy
        거부 등, 커널 kfree_skb 경로의 사각)을 cilium_drop_count_total 로 합성한 node 수준 신호이며 pod
        귀속이 없다. retrans 는 workload 단위 TCP 재전송 랭킹으로 drop 과 함께 패킷 손실 계열 신호를 한 응답으로 묶는다.
      produces:
      - application/json
      tags:
      - network
      summary: 패킷 drop 분석
      parameters:
      - type: string
        description: src_namespace 필터 (생략 시 전체)
        name: namespace
        in: query
      - type: string
        description: 단일 노드 필터 (DNS-1123 형식, 생략 시 전체)
        name: node
        in: query
      - type: integer
        description: 상위 N (1-100, 기본 20)
        name: limit
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.DropsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/events:
    get:
      description: z-score 이상과 noisy-neighbor 간섭을 공통 severity 로 묶어 정렬된 사건 목록과 자연어
        설명, drill-down 링크로 돌려준다. links 는 이벤트 종류별 detail 에 dimension 별 원인 축 API (gpu
        는 gpu-idle 과 gpu-status, network 는 drops 와 latency-breakdown, memory 는 memory)
        를 더하고, 모든 링크에 관찰 시점의 at 파라미터가 포함되어 사건 시점 조회로 바로 이어진다. min_severity 미만 사건은
        제외한다.
      produces:
      - application/json
      tags:
      - interference
      summary: 이벤트 분석 (anomaly + noisy-neighbor 종합)
      parameters:
      - type: string
        description: 최소 severity (low/elevated/high, 기본 elevated)
        name: min_severity
        in: query
      - type: integer
        description: 상위 N 사건 (1-50, 기본 20)
        name: limit
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.EventsResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/flows:
    get:
      description: netobs_flow_bytes_total(5-tuple pod 간 RX/TX)을 rate 로 환산해 pod 간
        대역폭 엣지(node·방향·protocol별 bytes/sec 와 Mbps)로 노출한다. flow 메트릭은 NETOBS_FLOW_ALLOW_NAMESPACES
        allow-list 가 설정된 src namespace 에서만 emit 되며, flow_collection_enabled 로 활성 여부를
        알린다. dst 는 namespace·pod_uid·ip 로 식별되므로 /pods 인벤토리의 uid 와 매핑한다.
      produces:
      - application/json
      tags:
      - network
      summary: pod 간 flow 토폴로지
      parameters:
      - type: string
        description: src_namespace 필터 (생략 시 전체)
        name: namespace
        in: query
      - type: string
        description: egress 또는 ingress (생략 시 전체)
        name: direction
        in: query
      - type: integer
        description: 상위 N 엣지 (1-200, 기본 50)
        name: limit
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.FlowsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/gpu-idle:
    get:
      description: 노드별 GPU 유휴 비율과 유휴 원인 가중치 순위, dominant cause 를 합성한다. scope=cluster
        는 cluster 단위 원인, scope=node 는 노드 단위 원인 (node 파라미터로 단일 노드 조회), scope=pod 는
        victim Pod 단위 원인을 돌려준다. cause weight 는 GPU idle > 0.5 일 때만 산출되며, 미만이면 cluster
        가 null 로 graceful 처리된다.
      produces:
      - application/json
      tags:
      - gpu
      summary: GPU 유휴 원인 분석
      parameters:
      - type: string
        description: cluster 또는 node 또는 pod (기본 cluster)
        name: scope
        in: query
      - type: string
        description: scope=node 단일 노드 필터 (DNS-1123 형식, 생략 시 전체 노드)
        name: node
        in: query
      - type: integer
        description: scope=pod 상위 N victim (1-100, 기본 10)
        name: limit
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.GpuIdleResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/gpu-processes:
    get:
      description: 노드의 gpuobs agent 로컬 /processes 스냅샷 (PID, GPU device, compute/graphics
        타입, GPU 메모리, cgroup 기반 소유 pod, best-effort SM util) 을 단일 진입점으로 중계한다. agent
        주소는 Prometheus up 시리즈의 instance 라벨로 해석하며, agent 미존재 / down / 미응답은 빈 목록과 사유
        (available=false, reason) 로 graceful 처리한다. 실시간 스냅샷 경로라 at 시점 재구성은 지원하지 않는다.
      produces:
      - application/json
      tags:
      - gpu
      summary: 노드 GPU 실행 프로세스 목록 (agent 프록시)
      parameters:
      - type: string
        description: 대상 노드 (DNS-1123 형식)
        name: node
        in: query
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.GpuProcessesResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/gpu-rca:
    get:
      description: 노드 하나의 GPU 유휴 dominant cause 와 cause 별 가중치 (한국어 설명 포함), 신뢰도, 원인
        후보 pod 랭킹, 근거 수치 (evidence), 한 줄 narrative 를 한 응답으로 합성한다. dominant cause 와
        가중치는 scope=node gpu-idle 결과를 재사용하고, 원인 후보는 이 노드를 victim 으로 하는 noisy-neighbor
        suspect pod (namespace-aware) 와 cross-node-interference suspect node 를 통합
        인과강도 (causal_strength, Pearson·Granger·effect 합성 0-1) 내림차순으로 집계한다 (#373, suspects
        의 score 필드가 이 값이며 순수 상관만 높은 후보가 인과 확실 후보보다 상위로 오지 않는다). 신뢰도는 top1 과 top2 cause
        격차이며 0.1 미만 백중세는 narrative 에 판정 유보로 적는다. evidence 는 device 사용률과 SM active,
        노드 재전송 rate 와 최대 RTT 에 더해 dominant cause 의 차원 맞춤 수치 (memory 는 suspect pod
        의 working_set/limit 과 노드 실측 사용률, thermal 은 온도와 slowdown 여유, cpu 는 throttle
        비율, 점수형 cause 는 노드 score) 를 cause 레지스트리 기반 2차 조회로 실어 narrative 에 융합하고, dominant
        cause 별 인과 체인 문구를 덧붙인다. gpu 파라미터 (GPU UUID 또는 device index) 로 evidence 의 GPU
        수치를 device 로 좁힐 수 있고, 미등록 device 는 해당 수치가 생략된다.
      produces:
      - application/json
      tags:
      - gpu
      summary: 노드 GPU RCA 합성
      parameters:
      - type: string
        description: 대상 노드 (DNS-1123 형식)
        name: node
        in: query
        required: true
      - type: string
        description: 대상 device (GPU UUID 또는 device index, 생략 시 노드 전체)
        name: gpu
        in: query
      - type: integer
        description: 원인 후보 상위 N (1-50, 기본 10)
        name: limit
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodeGpuRcaResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/gpu-status:
    get:
      description: 'node 와 GPU device 단위 사용률, 메모리, 전력, 온도, 활성 throttle reason, 점유
        pod 에 더해 device 상세(SM active, encoder/decoder 사용률, bar1 메모리, 클럭, 팬, performance
        state, PCIe 링크, 온도 임계, throttle violation, compute/persistence mode, energy)와
        device 상태 판정(status: 성능성 throttle 은 degraded, slowdown 임계 근접 또는 노드 NVML 오류율
        초과는 warning), CUDA pod 귀속 능력(pod_attribution: driver 심볼 필수·runtime 선택, 불가
        사유 포함), device idle 판정(idle: node:gpu_idle:5m rule 과 동일한 사용률 20% 미만 임계의 instant
        적용)과 노드별 dominant cause 요약(dominant_causes: node → cause 와 한국어 설명, gpu-rca
        와 동일 카탈로그)을 한 응답으로 합성한다. 수집 공백 신호는 필드가 생략되고 SM active(gpm sm_occupancy)는 데이터센터
        GPU 에서만 채워진다.'
      produces:
      - application/json
      tags:
      - gpu
      summary: GPU 자원 현황 조회
      parameters:
      - type: string
        description: 단일 노드 필터 (DNS-1123 형식, 생략 시 전체)
        name: node
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.GpuStatusResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/health:
    get:
      description: 4 자원 차원(cpu/gpu/memory/network)의 health 점수와 status, 압박이 집중된 node/pod(hotspot),
        전체 dominant 압박 지점, z-score 이상, 한 줄 요약을 한 응답으로 돌려준다. cluster_health 는 차원 health
        의 최솟값(가장 약한 고리)이고 weakest 가 그 차원을 가리켜 랜딩 카드의 단일 % 표기에 쓰인다. hotspot 의 top_pod
        와 dominant_pressure 의 pod 는 ns/pod 결합 id 표현으로 불변이며, 슬래시 파싱 없이 신원을 읽는 분리 필드(top_pod_namespace/top_pod_name,
        namespace/pod_name)가 additive 로 병기된다(#383, namespace 미상이면 생략). 데이터 부재는 null
        + status=unknown 으로 graceful 처리한다.
      produces:
      - application/json
      tags:
      - meta
      summary: 클러스터 헬스 + 압박 위치 합성
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.HealthResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/impact-graph:
    get:
      description: suspect → victim 1-hop 엣지로 구성된 영향 전파 그래프의 정점 (out/in degree 포함)
        과 엣지 반환. namespace / min_score 로 유도 부분그래프를 추릴 수 있다
      produces:
      - application/json
      tags:
      - impact
      summary: Get impact propagation graph
      parameters:
      - type: string
        description: suspect 또는 victim 이 이 namespace 인 엣지만 (유도 부분그래프)
        name: namespace
        in: query
      - type: number
        description: score 가 이 값 이상인 엣지만
        name: min_score
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ImpactGraphResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/impact-paths:
    get:
      description: 근원 suspect(root)에서 종착 victim(terminal)으로 이어지는 다단계 경로와 근원 요약 반환.
        root_pod / terminal_pod / namespace / min_score 필터 지원
      produces:
      - application/json
      tags:
      - impact
      summary: List multi-hop impact propagation paths
      parameters:
      - type: string
        description: 근원 suspect pod 이름 필터
        name: root_pod
        in: query
      - type: string
        description: 종착 victim pod 이름 필터
        name: terminal_pod
        in: query
      - type: string
        description: root 또는 terminal 의 namespace 필터
        name: namespace
        in: query
      - type: number
        description: 경로 weakest-link score 하한 필터
        name: min_score
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ImpactPathsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/incidents:
    get:
      description: Prometheus 의 ALERTS 시계열을 range 합성해 기간 내 alert 발화 이력을 돌려준다. 동일 alert
        의 재발화는 샘플 간극으로 별개 에피소드로 분리되고, range 끝까지 발화 중이면 status=firing, 중간에 끊겼으면 status=resolved
        와 종료 시각이 채워진다. starts_at 은 synthesis API 의 at 파라미터에 그대로 넣어 발화 시점 상태를 재구성하는
        진입점이다. 상시 발화 heartbeat (Watchdog) 는 overview issues 와 공용 필터로 제외되어 발화 중 목록의
        alertname dedup 수가 카드 total 과 일치한다 (#332). 각 항목의 scope (pod/node/cluster,
        overview 와 동일 분류) 와 귀속 entity (node 와 namespace 와 pod) 는 프론트가 이슈에서 해당 화면으로
        라우팅하는 입력이며, cluster scope 는 라우팅 대상이 없어 전역 알림 목록에서 표시한다. title 과 summary 는
        사람이 읽을 설명으로 (#349), title 은 alertname 의 한국어 제목이고 summary 는 항목 labels 로 치환된
        설명이다. 카탈로그 미등록 alertname (kube-prometheus-stack 내장 alert 등) 은 title 에 alertname
        을 그대로 쓰고 summary 를 생략한다.
      produces:
      - application/json
      tags:
      - interference
      summary: alert 발화 이력
      parameters:
      - type: string
        description: '조회 기간 (예: 1h, 6h, 최대 24h, 기본 1h)'
        name: range
        in: query
      - type: string
        description: '샘플 간격 (예: 1m, 최소 30s, 기본 1m)'
        name: step
        in: query
      - type: integer
        description: 상위 N 에피소드 (1-200, 기본 50)
        name: limit
        in: query
      - type: string
        description: node 라벨이 이 노드를 가리키는 에피소드만 조회
        name: node
        in: query
      - type: string
        description: pod/src_pod/victim_pod 라벨이 이 pod 를 가리키는 에피소드만 조회
        name: pod
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.IncidentsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/latency-breakdown:
    get:
      description: 송신/수신 커널 단계별 p99 latency 와 비중, 지배 단계를 scope(workload/node/pod)별로
        분해한다. histogram_quantile 로 stage 라벨을 보존해 산출하며, pod scope 는 send-path 단계만 수집된다.
        direction(egress/ingress)으로 송신/수신을 좁힐 수 있다.
      produces:
      - application/json
      tags:
      - network
      summary: 지연 단계 분해
      parameters:
      - type: string
        description: workload / node / pod (기본 workload)
        name: scope
        in: query
      - type: string
        description: egress 또는 ingress (생략 시 전체)
        name: direction
        in: query
      - type: string
        description: 단일 노드 필터 (DNS-1123 형식, 생략 시 전체)
        name: node
        in: query
      - type: integer
        description: 상위 N 대상 (1-100, 기본 10)
        name: limit
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.LatencyBreakdownResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/memory:
    get:
      description: pod별 cAdvisor 종류별 메모리(working_set / rss / cache / swap bytes)와
        limit, OOM 위험(working_set/limit), 지배 종류를 돌려준다. rss(anonymous)는 OOM을 유발하고 cache는
        reclaimable이라, working_set이 rss로 채워졌는지 cache로 채워졌는지 구분해 실제 압박 여부를 판정한다. swap은
        노드 swap이 켜진 경우만 채워진다. ?namespace로 필터한다.
      produces:
      - application/json
      tags:
      - interference
      summary: 메모리 병목 분해
      parameters:
      - type: string
        description: namespace 필터 (생략 시 전체)
        name: namespace
        in: query
      - type: integer
        description: 상위 N pod (1-200, 기본 30)
        name: limit
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.MemoryResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/node-map:
    get:
      description: '노드별 pod 목록에 4단 상태 (live/warning/down/completed) 와 관측 no-data,
        해당 pod 를 가리키는 firing alertname 을 내장해 돌려준다. 노드 status 는 단일 규약 어휘(#381, healthy/warning/critical/down/unknown)의
        3단 rollup(healthy/warning/down, critical 은 warning 으로 압축)이고, pod status 는
        규약의 lifecycle 축이며 pressure 등급인 severity 축(low/elevated/high)은 node/pods 와
        pod-detail 이 담당한다. pod down 은 phase Failed/Unknown, warning 은 Pending 또는 firing
        alert 매칭, completed 는 phase Succeeded (정상 종료라 telemetry 부재가 정상, #314) 이며,
        issues 의 alertname 은 rca 와 playbooks 조회 입력과 호환된다. no-data 뱃지에는 미관측 사유 (no_data_reason:
        agent_absent 는 노드에 netobs 미배치, host_network 는 IP 귀속 불가 (cgroup 힌트 학습 시 live
        전환 가능), no_traffic 은 netns 무소켓으로 증명된 네트워크 미사용 (#342), no_data 는 시리즈 부재, #320)
        가 붙는다. node 파라미터로 단일 노드를 조회하고 미등록 노드는 404 다. at 파라미터로 사건 시점의 그리드를 재구성할 수 있다.'
      produces:
      - application/json
      tags:
      - inventory
      summary: 노드 그리드 (노드별 pod 상태 맵)
      parameters:
      - type: string
        description: 단일 노드 조회 (미등록 노드는 404)
        name: node
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodeMapResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/node-vitals:
    get:
      description: '노드의 CPU 와 memory 사용률 퍼센트 (노드 내 pod 합산 사용량을 노드 allocatable 로 나눈
        점유율, #313) 와 같은 분자의 절대 사용량 (cpu_usage_cores 는 5분 rate cores, memory_working_set_bytes
        는 working set bytes, #382 사용량 표현 규약의 절대량 항상 제공), GPU 사용률과 GPU 메모리를 instant
        query 로 읽어 노드 단위로 돌려준다. percent 는 allocatable 분모라 pod 축 (node/pods) 의 limit
        분모 동명 필드와 분모가 다르고, 절대량은 두 축이 같은 개념과 이름을 공유한다 (docs/api/usage-units.md). cadvisor
        와 gpuobs 원시 게이지 기반이며 압박 score 로 변환하지 않는다. limit 근접도 의미는 pressure 계열이 담당한다.
        프론트가 주기 폴링으로 실시간 값을 받는 경로이며, 시계열 range 는 trends 가 담당한다.'
      produces:
      - application/json
      tags:
      - interference
      summary: 노드 raw 사용률 (Vitals)
      parameters:
      - type: string
        description: 대상 노드 (DNS-1123 형식)
        name: node
        in: query
        required: true
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodeVitalsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/node/{node}:
    get:
      description: '노드의 4 차원 pressure 와 health, 종합(overall), dominant 차원과 신뢰도, 그 노드
        위 top 압박 pod 를 모아 한 노드의 상태를 한 응답으로 돌려준다. health 는 node:*_health_score:5m 룰(cluster
        health 의 노드 차원 판)이고, 신뢰도는 압박 top1 과 top2 차원 격차라 gpu-rca 와 동일 축이다. status 는
        차원별 pressure 등급(전 차원 worst, memory 는 node_exporter 실측 사용률이라 일반 임계 대신 usage
        임계 0.85/0.95 로 환산해 health 불감대·usage 축 설계와 정합)과 노드 사용량(CPU/memory 점유율, allocatable
        분모, 0.85 warn/0.95 degraded) 등급과 차원별 health 최솟값 등급과 이 노드를 가리키는 firing alert(severity
        critical 은 degraded, 그 외 warn) 등급의 worst-of 합성(#324, #325)이며, status_basis
        가 결정 신호(pressure/usage/health/alert)를 담는다. GPU 사용률은 포화가 정상 활용일 수 있어 등급 입력에서
        제외한다. status 는 종전 어휘(ok/warn/degraded/unknown)를 유지하고, 같은 판정을 노드 상태 단일 규약 어휘(#381,
        healthy/warning/critical/unknown)로 노출하는 status_unified 필드가 additive 로 함께 실린다(ok
        는 healthy, warn 은 warning, degraded 는 critical 대응). down(ready 기반) 판정은 ready
        신호를 조회하지 않아 방출하지 않으며 node-map 소관이다. top_pods 는 dominant 압박의 원인 후보이며 is_filtered=true
        면 pod pressure 가 elevated 임계(0.4) 이상인 pod 만 남기고 dominant severity 가 low(정상)면
        목록을 비워 낮은 수치 pod 가 원인으로 오인되지 않게 한다(#380). 미전달 기본은 전 pod 를 노출한다. top_pods 의
        pod 는 ns/pod 결합 id 표현으로 불변이며, 슬래시 파싱 없이 신원을 읽는 분리 필드 namespace 와 pod_name
        이 additive 로 병기된다(#383, namespace 미상이면 생략). health_notes 는 health 차원의 산출 불가·비실측
        사유(additive, #430)로 no_cpu_limit_pods(cpu 가 fallback 상수 1.0, CPU limit pod
        없음), no_gpu(GPU 미보유 노드의 정상 결측), scrape_gap(입력 시리즈 소실)을 구분해 담으며, 프론트가 결측 차원을
        0.00 대신 측정 불가로 렌더하는 근거다. 항목이 없으면 생략된다.'
      produces:
      - application/json
      tags:
      - interference
      summary: 노드 1대 전체 압박 상황
      parameters:
      - type: string
        description: 노드 이름
        name: node
        in: path
        required: true
      - type: boolean
        description: top_pods 를 원인 후보 임계(pressure>=0.4, dominant severity low 면 비움)로
          필터링 (기본 false)
        name: is_filtered
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodeResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/node/{node}/pods:
    get:
      description: '노드에 스케줄된 pod 별로 신원 (namespace 와 pod 와 uid) 과 CPU (limit 대비 percent
        와 절대량 cores), memory (limit 대비 percent 와 working set bytes), network bytes
        rate (netobs pod bytes 의 5분 rate 합산) 와 상태를 한 응답으로 돌려준다. percent 는 limit 분모라
        limit 없는 pod 는 생략되고 절대량 필드로 표현된다 (#328 과 동일 규약). severity 는 pod pressure score
        3종 최대의 환산 (low/elevated/high) 이고 cpu·memory limit 이 없어 두 score 를 산출할 수 없는
        차원은 unmeasured_dimensions 로 노출해 severity=low 가 정상 단정인지 network 만 측정된 부분 판정인지
        구분하며 (#378 pod-detail 규약과 정합), 종료 pod 와 미관측 사유 (unobserved_reason, no_traffic
        포함 #342) 는 pods API 의 규약 (#314, #320) 을 그대로 쓴다. 관측 판정 소스는 rate 결과 존재라 (pods
        API 는 시리즈 존재) 카운터 샘플이 부족한 신규 pod 의 짧은 창에서는 여기서만 일시적으로 사유가 붙을 수 있고 1분 내 자연
        수렴한다. 정렬은 namespace 와 pod 사전순으로 결정적이며 이상 우선 정렬은 severity 를 근거로 표시 계층이 수행한다.
        at 파라미터로 사건 시점을 재구성할 수 있다.'
      produces:
      - application/json
      tags:
      - interference
      summary: 노드 하위 pod별 자원 사용량 목록
      parameters:
      - type: string
        description: 노드 이름 (DNS-1123 형식)
        name: node
        in: path
        required: true
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodePodsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/node/{node}/resources:
    get:
      description: 노드의 리소스 종류별 (cpu 와 memory 와 pods 와 gpu) capacity 와 allocatable,
        노드 내 pod 의 requests/limits 합산, 현재 usage (cpu 는 5분 rate cores, memory 는 working
        set bytes, pods 는 현재 pod 수) 와 활용률 (usage/allocatable, gpu 는 device 사용률 평균
        0-1) 을 한 응답으로 합성한다. 단위는 kube-state 원단위 (cpu core, memory byte, pods 와 gpu
        개수) 를 따르고 결측 리소스는 엔트리가 생략된다.
      produces:
      - application/json
      tags:
      - interference
      summary: 노드 리소스 현황
      parameters:
      - type: string
        description: 노드 이름 (DNS-1123 형식)
        name: node
        in: path
        required: true
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodeResourcesResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/nodes:
    get:
      description: 노드별 이름, uid, 내부/외부 IP, Ready 상태, 역할(control-plane 등), 버전, capacity(cpu/memory/gpu)를
        kube-state-metrics 기반으로 돌려준다. 다른 API의 node 라벨과 동일 키로 매핑한다.
      produces:
      - application/json
      tags:
      - inventory
      summary: 노드 인벤토리
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NodesResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/noisy-neighbor:
    get:
      description: victim/suspect 와 dimension 과 rank 필터 후 pagination 적용한 noisy neighbor
        시리즈 반환
      produces:
      - application/json
      tags:
      - impact
      summary: List noisy neighbor top-N
      parameters:
      - type: string
        description: victim Pod 의 namespace 필터
        name: victim_namespace
        in: query
      - type: string
        description: victim Pod 의 이름 필터
        name: victim_pod
        in: query
      - type: string
        description: suspect Pod 의 namespace 필터
        name: suspect_namespace
        in: query
      - type: string
        description: suspect Pod 의 이름 필터
        name: suspect_pod
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: string
        description: victim 영향 종착 차원 필터 (latency/throughput/error/gpu)
        name: victim_signal
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.NoisyNeighborListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/overview:
    get:
      description: 랜딩 요약 카드 5장 (노드 3단 상태, pod 관측 커버리지, firing alert severity 집계, GPU
        fleet, weakest signal) 을 한 응답으로 돌려준다. 노드 warning 은 firing alert 또는 통합 압박 elevated
        초과, pod live 는 netobs eBPF 시리즈 존재다. issues 는 alertname 단위 dedup 집계라 total
        은 활성 alertname 종류 수이며, incidents 의 발화 중 (firing) 목록을 alertname 으로 dedup 한
        수와 같고 (#332, 동일 heartbeat 필터 공유), pod 뱃지 합계 (pod별 부착 수) 와는 기준이 달라 두 숫자는 다를
        수 있다. 상시 발화 heartbeat 인 Watchdog 은 활성 이슈가 아니라 집계에서 제외된다 (#326). scope 3종 (pod_scope/node_scope/cluster_scope)
        은 alert 라벨 기준 단일 분류로 total 에 대해 additive 하며, cluster scope 는 node 와 pod 라벨이
        없어 특정 노드·pod 화면에 나타나지 않는 전역 이슈다. at 파라미터로 사건 시점의 랜딩 화면을 재구성할 수 있다.
      produces:
      - application/json
      tags:
      - meta
      summary: 랜딩 대시보드 요약
      parameters:
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.OverviewResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/playbooks:
    get:
      description: gpu-idle cause 와 drop stage, 이벤트 dimension, 주요 alertname 별 대응 안내
        (원인 설명, 확인 절차 API 경로, 권고 조치) 를 정적 카탈로그로 돌려준다. cause 파라미터로 단일 항목을 조회하며 GPUIdleWith*
        같은 alertname 별칭으로도 매칭된다. at 파라미터를 주면 확인 절차의 API 링크 중 시점 지정 조회를 지원하는 경로에 at
        이 이어 붙어 사건 시점 재구성과 결합된다.
      produces:
      - application/json
      tags:
      - playbook
      summary: 원인별 대응 안내 카탈로그
      parameters:
      - type: string
        description: '원인 식별자 (예: network_pressure, egress_qdisc, gpu, NetObsDropBurst).
          미등록 식별자는 404'
        name: cause
        in: query
      - type: string
        description: 확인 절차 링크에 결합할 평가 시점 (RFC3339 또는 unix seconds)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.PlaybooksResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/pod/{namespace}/{pod}:
    get:
      description: 단일 pod 의 기본 정보 (uid 와 node 와 pod_ip 와 owner) 와 차원별 health 3종 (pod
        단위 pressure score 의 1 - score 환산), vitals (limit 대비 CPU 와 memory 사용률과 working
        set, CPU 절대 사용량), cgroup CPU throttle 상세 (throttled 비율과 5분 throttled/total
        periods 와 limit cores, cadvisor 가 노출하는 클러스터에서는 quota 와 period), 네트워크 종합 (pod
        입도 재전송과 drop rate, 최대 smoothed RTT) 을 한 응답으로 합성한다. cpu_percent 는 limit 대비
        비율이고 cpu_usage_cores 는 5분 rate 의 절대량 (cores) 이라 limit 없는 pod 는 cores 만 존재한다
        (#328, memory 의 working set 절대값과 대칭). RTT 는 분위수가 아닌 최대값이라 필드명이 max_srtt_seconds
        다. 미관측 pod 는 필드 생략과 summary 사유로 graceful 처리한다.
      produces:
      - application/json
      tags:
      - interference
      summary: pod 단위 종합 상세
      parameters:
      - type: string
        description: pod 네임스페이스 (DNS-1123 형식)
        name: namespace
        in: path
        required: true
      - type: string
        description: pod 이름 (DNS-1123 형식)
        name: pod
        in: path
        required: true
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.PodDetailResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/pods:
    get:
      description: '파드별 namespace, 이름, uid, pod IP, host IP, node, workload(created_by),
        priority, phase, qos, 관측 커버리지(observed)를 kube-state-metrics 기반으로 돌려준다. observed
        는 netobs 의 eBPF 시리즈가 존재하는지로, false 면 unobserved_reason 이 미관측 사유를 분류한다 (#320,
        #342): agent_absent 는 노드에 netobs 미배치, host_network 는 pod IP 가 host IP 와 같아
        IP 귀속이 성립하지 않는 상태로 cgroup 힌트가 학습되면 live 로 전환될 수 있는 시점 의존 분류다. no_traffic 은
        agent 의 소켓 스캔이 pod netns 의 무소켓을 증명한 상태 (unix socket 전용 pod 등) 로 시리즈 부재가 정상이고,
        no_data 는 관측 가능한데 시리즈 부재다. 종료 pod (phase Succeeded/Failed) 는 telemetry 부재가
        정상이라 observed=false 에 사유가 생략된다 (#314). ?namespace 로 필터한다. 다른 API의 src_namespace/src_pod/pod_uid와
        동일 키로 매핑한다.'
      produces:
      - application/json
      tags:
      - inventory
      summary: 파드 인벤토리
      parameters:
      - type: string
        description: namespace 필터 (생략 시 전체)
        name: namespace
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.PodsResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/pressure:
    get:
      description: 한 자원 차원의 node 또는 pod 를 pressure score 내림차순으로 랭킹해, /health 의 hotspot
        에서 한 단계 더 파고든다. scope=pod 의 pod 는 ns/pod 결합 id 표현으로 불변이며, 슬래시 파싱 없이 신원을 읽는
        분리 필드 namespace 와 pod_name 이 additive 로 병기된다(#383, namespace 미상이면 생략).
      produces:
      - application/json
      tags:
      - interference
      summary: 차원별 압박 drill-down 랭킹
      parameters:
      - type: string
        description: 압박 차원 (cpu/gpu/memory/network)
        name: dimension
        in: query
        required: true
      - type: string
        description: 랭킹 입도 (node/pod, 기본 node)
        name: scope
        in: query
      - type: string
        description: 단일 노드 필터 (DNS-1123 형식, 생략 시 전체)
        name: node
        in: query
      - type: integer
        description: 상위 N (1-100, 기본 10)
        name: limit
        in: query
      - type: string
        description: 평가 시점 (RFC3339 또는 unix seconds, 생략 시 현재)
        name: at
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.PressureResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/rca:
    get:
      description: rca-summarizer 가 Alertmanager webhook 으로 생성한 alert 별 root cause
        analysis 요약을 프록시한다. alert 파라미터 생략 시 보관 중인 전체 요약 목록, 지정 시 해당 alert 의 최신 요약을
        돌려준다 (미보관 alert 는 404). 요약에는 지배 자원 차원과 최우선 의심 pod, 핵심 drop flow, 근거 메트릭 힌트,
        신뢰도 점수가 담긴다.
      produces:
      - application/json
      tags:
      - rca
      summary: RCA 요약 조회
      parameters:
      - type: string
        description: alertname (생략 시 전체 목록)
        name: alert
        in: query
      responses:
        '200':
          description: OK
          schema:
            type: object
            additionalProperties: true
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '502':
          description: Bad Gateway
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/service-impact:
    get:
      description: victim_namespace 와 victim_workload 와 suspect_node 와 dimension 과
        rank 필터 후 pagination 적용한 service-impact 시리즈 반환
      produces:
      - application/json
      tags:
      - impact
      summary: List service-impact top-N
      parameters:
      - type: string
        description: victim workload 의 namespace 필터
        name: victim_namespace
        in: query
      - type: string
        description: victim workload (Service 근사) 이름 필터
        name: victim_workload
        in: query
      - type: string
        description: suspect node 이름 필터
        name: suspect_node
        in: query
      - type: string
        description: 리소스 차원 필터 (cpu/memory/network/gpu)
        name: dimension
        in: query
      - type: integer
        description: max rank (기본 무제한)
        name: rank_max
        in: query
      - type: integer
        description: 응답 item 최대 개수 (기본 100, 최대 1000)
        name: limit
        in: query
      - type: integer
        description: 응답 시작 offset (기본 0)
        name: offset
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.ServiceImpactListResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_correlation_api.ErrorResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/topology:
    get:
      description: 노드별 status(healthy/warning/critical/unknown, 4개 자원 차원 pressure
        의 dominant severity 기준)와 노드간 간섭 엣지(cross-node interference 의 suspect_node→victim_node)를
        한 응답으로 합성한다. status 는 노드 상태 단일 규약 어휘(#381, healthy/warning/critical/down/unknown)의
        부분집합이며 ready 신호를 조회하지 않아 down 은 방출하지 않는다(node-map 소관). querier 나 cross-node
        snapshot 이 없으면 해당 부분을 빈 값으로 graceful 처리한다.
      produces:
      - application/json
      tags:
      - interference
      summary: 클러스터 노드 토폴로지
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.TopologyResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
  /api/v1/trends:
    get:
      description: '진단 신호와 자원 사용량, 지연의 클러스터 추이를 range query 로 돌려준다. signal 은 화이트리스트(간섭
        4종: noisy_neighbor_intensity / noisy_neighbor_count / cross_node_intensity
        / service_impact_intensity, 자원·지연 7종: latency_p99 / drop_rate / bandwidth_rx
        / bandwidth_tx / pressure_max / retrans_rate / srtt_max)만 허용해 임의 PromQL injection
        과 cardinality 를 통제하며 신호당 1 시리즈로 bound 된다.'
      produces:
      - application/json
      tags:
      - trends
      summary: 진단 신호 추이
      parameters:
      - type: string
        description: 추이 신호 (noisy_neighbor_intensity / noisy_neighbor_count / cross_node_intensity
          / service_impact_intensity / latency_p99 / drop_rate / bandwidth_rx / bandwidth_tx
          / pressure_max / retrans_rate / srtt_max)
        name: signal
        in: query
        required: true
      - type: string
        description: '조회 기간 (예: 1h, 6h, 최대 24h, 기본 1h)'
        name: range
        in: query
      - type: string
        description: '샘플 간격 (예: 5m, 최소 30s, 기본 5m)'
        name: step
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/internal_correlation_api.TrendsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/netobs_internal_apicommon.ErrorBody'
definitions:
  internal_correlation_api.AgentHealth:
    type: object
    properties:
      agent:
        type: string
      bpf_attach_failures_5m:
        description: BpfAttachFailures5m 는 최근 5분 attach 실패 누적 (netobs 전용) 이다.
        type: number
      bpf_programs_loaded:
        description: BpfProgramsLoaded / Total 은 netobs 전용. loaded < total 이면 일부 kprobe
          가 detach 상태다.
        type: number
      bpf_programs_total:
        type: number
      cuda_driver_symbols:
        description: 'CudaDriverSymbols / CudaRuntimeSymbols 는 cuda uprobe 심볼 부착 상태
          (gpuobs 전용, #279) 다.

          driver (cu*) 는 CUDA pod 귀속의 필수 조건이고 runtime (cuda*) 은 선택이라는 규약은

          GPUObsCudaSymbolUnavailable alert 와 같다. gpu-status 의 pod_attribution 과 동일
          소스다.'
        type: boolean
      cuda_runtime_symbols:
        type: boolean
      informer_lag_seconds:
        description: InformerLagSeconds 는 kube informer 마지막 watch event 이후 경과 초다.
        type: number
      issues:
        type: array
        items:
          type: string
      node:
        type: string
      nvml_errors_per_sec:
        description: NvmlErrorsPerSec 는 NVML 호출 실패율 (gpuobs 전용) 이다.
        type: number
      status:
        description: 'Status 는 healthy 또는 degraded 다. 판정 임계는 기존 알림 규칙과 동일하고, 걸린 규칙의

          alertname 이 Issues 에 담긴다.'
        type: string
      up:
        type: boolean
  internal_correlation_api.AgentsResponse:
    type: object
    properties:
      agents:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.AgentHealth'
      generated_at:
        type: string
      summary:
        type: string
  internal_correlation_api.Anomaly:
    type: object
    properties:
      dimension:
        type: string
      severity:
        type: string
      window:
        type: string
      zscore:
        type: number
  internal_correlation_api.BandwidthNode:
    type: object
    properties:
      nic_capacity_bytes_per_sec:
        type: number
      nic_tx_bytes_per_sec:
        type: number
      nic_utilization:
        type: number
      node:
        type: string
      rx_bytes_per_sec:
        type: number
      tx_bytes_per_sec:
        type: number
  internal_correlation_api.BandwidthPod:
    type: object
    properties:
      namespace:
        type: string
      nic_tx_bytes_per_sec:
        type: number
      node:
        type: string
      pod:
        type: string
      rx_bytes_per_sec:
        type: number
      tx_bytes_per_sec:
        type: number
  internal_correlation_api.BandwidthResponse:
    type: object
    properties:
      generated_at:
        type: string
      nodes:
        description: 'Nodes 는 NIC 포화 판단 근거다. namespace 필터와 무관하게 항상 클러스터 전체 pod 합계로

          산출해 필터로 합계가 왜곡되지 않게 한다.'
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.BandwidthNode'
      pods:
        type: array
        items:
          $ref: '#/definitions/internal_correlation_api.BandwidthPod'
      summary:
        type: string
      window:
        type: string
  internal_correlation_api.CiliumDropGroup:
    type: object
    properties:
      direction:
        type: string
      drops_per_sec:
        type: number
      node:
        type: string
      reason:
        type: string
  internal_correlation_api.CrossLevelListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.CrossLevel'
      page:
        $ref: '#/definitions/netobs_internal_apicommon.Page'
      snapshot_generated_at:
        description: 'SnapshotGeneratedAt 와 SnapshotStale 은 #405 의 신선도 additive 필드다.
          이 응답의 원천인

          snapshot 이 산출된 시각 (RFC3339) 과 stale 판정 (reconcile interval 3배 초과) 으로, 실패

          cycle 이 이어질 때 소비자가 오래된 결과임을 판별한다. 첫 reconcile 전에는 생략된다.'
        type: string
      snapshot_stale:
        type: boolean
  internal_correlation_api.CrossNodeListResponse:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/netobs_internal_correlation.NodeInterference'
      page:
