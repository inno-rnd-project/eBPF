apiVersion: v1
kind: ConfigMap
metadata:
  name: correlation-exporter
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: correlation-exporter
    app.kubernetes.io/part-of: ebpf-project
    app.kubernetes.io/component: correlation-exporter
# correlation-exporter 가 envFrom 으로 본 ConfigMap 의 모든 키를 환경 변수로 주입한다. cmd/correlation-exporter
# 가 env 보다 flag 가 우선하는 fallback 정책으로 파싱하므로 overlay 가 args 로 덮어쓸 수 있다.
# PROMETHEUS_URL 의 기본값은 kube-prometheus-stack 의 in-cluster service 명을 가리킨다. helm release
# 이름이 다른 환경에서는 overlay 의 ConfigMap patch 또는 별도 env 로 override 한다.
data:
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  RECONCILE_INTERVAL: "5m"
  WINDOW: "1h"
  STEP: "30s"
  MIN_SAMPLES: "60"
  TOP_N: "10"
  FETCH_TIMEOUT: "30s"
  LISTEN_ADDR: ":9830"
  # #409 CORS origin allow-list. 명시 목록으로 운영하며 base (prod 포함 전 환경) 에는 서비스 접근
  # 경로만 둔다. swagger-ui pod 가 브라우저 경유로 spec 을 fetch 하는 클러스터 내부 page origin
  # (service 숏네임과 FQDN 변형) 과 공인 IP로 배포된 프론트 dashboard origin (101.79.72.57, 80 포트)
  # 이다. 개발 접속 경로 (개발 프론트 서버 사설 IP, port-forward 관행의 localhost 와 127.0.0.1) 는
  # 운영자 로컬의 임의 페이지가 브라우저 경유로 API 를 읽을 수 있어 base 에 두지 않고 dev overlay
  # 의 patch-configmap.yaml 에만 둔다 (#461). dev patch 는 이 목록 전체를 다시 적으므로 여기에
  # origin 을 추가하면 dev patch 에도 함께 추가한다. 미등재 origin 의 거부는 exporter 로그의
  # cors: denied origin 으로 드러나므로 새 접속 경로는 그 로그의 값을 그대로 등재한다. 전 origin
  # 허용 ("*", 요청 origin echo) 도 지원하나 임시 진단 목적에 한정한다.
  API_CORS_ALLOW_ORIGINS: "http://swagger-ui:8080,http://swagger-ui.ebpf-project:8080,http://swagger-ui.ebpf-project.svc.cluster.local:8080,http://101.79.72.57"
