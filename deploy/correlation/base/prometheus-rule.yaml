apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: correlation-exporter
  namespace: ebpf-project
  labels:
    # release 라벨은 servicemonitor.yaml과 동일하게 kube-prometheus-stack Prometheus 인스턴스의
    # ruleSelector 에 매치되도록 둔다. 운영 클러스터의 helm release 이름이 다른 환경은 overlay 의
    # PrometheusRule patch 로 본 라벨을 덮는다.
    release: kube-prometheus-stack
    app.kubernetes.io/name: correlation-exporter
    app.kubernetes.io/component: prometheus-rules
    app.kubernetes.io/part-of: ebpf-project
spec:
  groups:
    # correlation-exporter.recording 은 #69 의 dominant dimension 게이팅과 active 메트릭 산정을 위한
    # PromQL recording rule 을 모은다. victim 의 latency pressure indicator 와 active dominant dimension
    # 두 종으로 dashboard 와 alert 가 latency 압박 실측 시간대 한정의 의미 있는 신호만 보게 한다.
    - name: correlation-exporter.recording
      interval: 30s
      # #412 rule 산출 시리즈 폭주 backstop. 초과 시 그룹 평가가 실패로 기록되어 폭주가
      # 조용히 스토리지를 채우는 대신 가시화된다. 현행 최대 그룹이 수백 시리즈라 2000 은
      # 정상 운영에 닿지 않는다.
      limit: 2000
      rules:
        # correlation_victim_latency_pressure:5m
        # victim Pod 의 latency p99 가 임계 (0.1s) 를 초과하면 1, 그 외에는 시리즈 미존재로 둬 active
        # dominant dimension 산정의 AND 게이팅 입력으로 사용된다. 임계 0.1s 는 본 시리즈 (#65) 의
        # NetObsHighStageLatencyP99 와 동일 수준으로 잡아 운영 임계 정합을 유지한다. 운영자가
        # 환경별 tunable 로 조정하려면 본 recording rule 표현식의 0.1 상수를 변경한다. netobs 의
        # latency 메트릭은 src_namespace / src_pod / src_pod_uid 라벨을 쓰는데 correlation 메트릭은
        # victim_namespace / victim_pod / victim_pod_uid 를 써서 label_replace 로 키 이름을 정합
        # 시킨 뒤 sum by 로 src_* 라벨을 drop 한다.
        - record: correlation_victim_latency_pressure:5m
          expr: |
            sum by(victim_namespace, victim_pod, victim_pod_uid) (
              label_replace(
                label_replace(
                  label_replace(
                    (
                      histogram_quantile(0.99,
                        sum by(le, src_namespace, src_pod, src_pod_uid) (
                          pod:netobs_stage_latency_rate_le:5m
                        )
                      ) > 0.1
                    ) * 0 + 1,
                    "victim_namespace", "$1", "src_namespace", "(.*)"
                  ),
                  "victim_pod", "$1", "src_pod", "(.*)"
                ),
                "victim_pod_uid", "$1", "src_pod_uid", "(.*)"
              )
            )

        # correlation_dominant_dimension_active:5m
        # raw correlation_dominant_dimension 을 correlation_victim_latency_pressure:5m AND 게이팅으로
        # 거른 active view 다. latency 압박이 실측되는 victim 한정으로 dominant dimension 이 의미가
        # 있고 그 외 시간대는 dashboard / alert 의 false positive 잡음이 누적된다. raw 메트릭은
        # 디버깅용으로 항상 emit 되며 운영자가 본 active 메트릭으로 진단을 시작한다.
        - record: correlation_dominant_dimension_active:5m
          expr: |
            correlation_dominant_dimension
            and on(victim_namespace, victim_pod, victim_pod_uid)
            correlation_victim_latency_pressure:5m

    # correlation-exporter.alerts 는 noisy neighbor 발견과 exporter 자체의 헬스 두 축으로 alert 를
    # 묶는다. severity 와 component 라벨은 netobs-gpuobs.alerts 와 동일 컨벤션을 따른다.
    - name: correlation-exporter.alerts
      # #412 전역 기본값 의존이던 평가 주기를 명시한다 (kube-prometheus-stack 기본 30s 동일).
      interval: 30s
      # #412 rule 산출 시리즈 폭주 backstop. 초과 시 그룹 평가가 실패로 기록되어 폭주가
      # 조용히 스토리지를 채우는 대신 가시화된다. 현행 최대 그룹이 수백 시리즈라 2000 은
      # 정상 운영에 닿지 않는다.
      limit: 2000
      rules:
        # CorrelationStrongNoisyNeighbor
        # 한 (victim_namespace, victim_pod, suspect_namespace, suspect_pod, resource_dimension) 페어가
        # max_abs_value 0.85 를 10분 지속하면 발화한다. rank 와 pod_uid 는 group 키에서 제외해 동일
        # 페어가 rank 별로 또는 pod 재시작 전후로 중복 발화하지 않게 한다. 0.85 임계는 합성 부하
        # 시나리오에서 1.0 동기화 페어와 0.5 미만 무관 페어를 명확히 분리하는 값이다.
        # #366 부터 상관 강도 단독이 아니라 인과 증거 조인을 함께 요구한다. 짧은 관측 구간의 우연한
        # 고상관이 10분만 유지되면 인과 증거 없이 오발화하던 것을, causal_strength > 0.6 또는 Granger
        # pvalue < 0.05 게이트로 차단한다. causal_strength (0.5·|corr| + 0.3·granger + 0.2·effect,
        # ComputeCausalStrength 단일 진실원) 는 상관 단독 상한이 0.5 라 0.6 은 인과 항 (Granger 또는
        # effect size 유의성) 의 실질 기여를 강제하고, Granger 검정이 불가한 동시 간섭 (lag=0) 도
        # effect 유의성 경로 (상한 0.7) 로 통과할 수 있다 (임계 0.7 이면 이 경로가 사실상 막힌다).
        # pvalue 분기는 GrangerOK 페어의 직접 증거다 (pvalue 는 GrangerOK 페어만 emit). 증거 게이트는
        # and on() 조인이라 $value (max |corr|) 와 라벨은 종전과 동일하다. 양측 모두 5라벨 grain 으로
        # 집계하므로 victim_signal 축은 의도적으로 병합된다. score 와 증거가 같은 페어의 서로 다른
        # victim_signal 변형에서 와도 통과하며, 같은 (victim, suspect, dimension) 페어의 인과 증거라는
        # 의미론으로 수용한다 (victim_signal 까지 조인 키에 넣으면 게이트가 과도하게 좁아진다).
        - alert: CorrelationStrongNoisyNeighbor
          expr: |
            (
              max by (victim_namespace, victim_pod, suspect_namespace, suspect_pod, resource_dimension) (
                correlation_noisy_neighbor_score
              ) > 0.85
            )
            and on (victim_namespace, victim_pod, suspect_namespace, suspect_pod, resource_dimension)
            (
              (
                max by (victim_namespace, victim_pod, suspect_namespace, suspect_pod, resource_dimension) (
                  correlation_noisy_neighbor_causal_strength
                ) > 0.6
              )
              or
              (
                min by (victim_namespace, victim_pod, suspect_namespace, suspect_pod, resource_dimension) (
                  correlation_noisy_neighbor_pvalue
                ) < 0.05
              )
            )
          for: 10m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "noisy neighbor detected (victim={{ $labels.victim_namespace }}/{{ $labels.victim_pod }} suspect={{ $labels.suspect_namespace }}/{{ $labels.suspect_pod }} dimension={{ $labels.resource_dimension }})"
            description: "victim {{ $labels.victim_namespace }}/{{ $labels.victim_pod }} 의 latency 가 suspect {{ $labels.suspect_namespace }}/{{ $labels.suspect_pod }} 의 {{ $labels.resource_dimension }} 자원 변동과 max |corr| {{ $value }} 로 10분 이상 동조하고 있다. causal_strength 0.6 초과 또는 Granger pvalue 0.05 미만의 인과 증거 게이트를 함께 통과했다 (#366). internal/correlation/README.md 의 runbook 절차를 따른다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/correlation/README.md#correlationstrongnoisyneighbor"

        # CorrelationExporterMetricsAbsent
        # #405 exporter 자기관측의 마지막 공백 커버. 첫 reconcile 실패 시 /readyz 가 영구 503 이라
        # Service Endpoints 에서 빠져 self-health 메트릭 자체가 수집되지 않는데, Stalled 계열은
        # 시리즈가 존재해야 발화하므로 이 NotReady 침묵 구간을 아무도 감지하지 못했다. absent() 는
        # 시리즈 부재 자체를 잡아 미수집 (scrape 대상 이탈, exporter 미기동 포함) 을 커버한다.
        - alert: CorrelationExporterMetricsAbsent
          expr: absent(correlation_reconcile_last_success_timestamp_seconds)
          for: 5m
          labels:
            severity: critical
            component: correlation
          annotations:
            summary: "correlation-exporter self-health metrics absent"
            description: "correlation_reconcile_last_success_timestamp_seconds 시리즈가 5 분 이상 부재하다. exporter 미기동, 첫 reconcile 실패로 인한 NotReady (Endpoints 이탈), scrape 설정 문제 중 하나로 self-health 관측 자체가 끊긴 상태다. correlation-exporter pod 상태와 readyz, ServiceMonitor 대상 등록을 점검한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/correlation/README.md#correlationexportermetricsabsent"

        # CorrelationExporterStalled
        # exporter 가 reconcile 을 10분 이상 성공시키지 못하면 발화한다. last_success_timestamp 가
        # 0 인 첫 reconcile 전 상태는 NewGauge default 0 으로 emit 되어 time() 과의 차이가 매우 커
        # 즉시 발화 위험이 있으므로 timestamp > 0 가드를 AND 로 둔다.
        - alert: CorrelationExporterStalled
          expr: |
            correlation_reconcile_last_success_timestamp_seconds > 0
            and
            (time() - correlation_reconcile_last_success_timestamp_seconds) > 600
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "correlation-exporter has not reconciled for over 10 minutes"
            description: "correlation-exporter 의 마지막 reconcile 성공이 10 분 이상 지났다. Prometheus 와의 네트워크 / 권한 문제, query timeout, 또는 exporter Pod 의 정지 가능성을 확인한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/correlation/README.md#correlationexporterstalled"

        # CorrelationExporterReconcileErrors
        # 10분 윈도우에서 reconcile error 가 3 회 이상 누적되면 발화한다. increase 가 rate 보다
        # 의미가 명확해 채택했다. 일시적 단발 에러는 본 임계를 자연스럽게 넘기지 않는다.
        - alert: CorrelationExporterReconcileErrors
          expr: |
            increase(correlation_reconcile_errors_total[10m]) >= 3
          for: 10m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "correlation-exporter reconcile errors accumulating"
            description: "correlation-exporter 의 reconcile cycle 이 10 분 윈도우에서 3 회 이상 에러로 종료됐다. Prometheus 응답, query 문법, network 경로를 점검한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/correlation/README.md#correlationexporterreconcileerrors"

        # CorrelationExporterPartialFetch
        # #405 부분 fetch 실패의 warning 단계. 지속 부분 실패는 last_success 동결로 결국 Stalled 를
        # 발화시키지만 (10분+), 그 전에 query 단위 원인 특정이 가능한 조기 신호를 둔다. 운영 기본
        # reconcile interval 이 5m 이라 30m 창에 cycle 이 최대 6개이고, 임계 3은 지속 실패만 넘는다
        # (단발 blip 1~2회는 걸러진다).
        - alert: CorrelationExporterPartialFetch
          expr: |
            increase(correlation_reconcile_partial_total[30m]) >= 3
          for: 10m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "correlation-exporter partial fetch failures accumulating"
            description: "correlation-exporter 의 reconcile cycle 이 30 분 윈도우에서 3 회 이상 부분 fetch 실패로 진행됐다. 산출은 부분 입력으로 계속되지만 실패가 이어지면 last_success 동결로 CorrelationExporterStalled 가 뒤따른다. correlation_fetch_errors_total 의 query 라벨로 실패 지점을 특정한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/correlation/README.md#correlationexporterpartialfetch"
