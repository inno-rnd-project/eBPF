# 클러스터별 Prometheus 주소와 reconcile cadence 자리 (#289). ConfigMap patch 는 명시한 키만
# 덮어쓰므로 나머지 키는 base 기본값을 따른다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: correlation-exporter
  namespace: ebpf-project
data:
  # CHANGEME: 타깃 클러스터의 Prometheus in-cluster 주소. helm release 이름과 네임스페이스에
  # 따라 service 명이 달라진다 (kubectl get svc -n <monitoring-ns> | grep prometheus).
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  # CHANGEME: reconcile cadence. series 수가 많은 대형 클러스터는 간격을 늘려 fetch 부하를 줄인다.
  RECONCILE_INTERVAL: "5m"
