apiVersion: v1
kind: ConfigMap
metadata:
  name: correlation-exporter
  namespace: ebpf-project
data:
  # dev cluster 는 검증 cadence 가 빨라야 한다. reconcile 1 분 + window 30 분 으로 빠르게 결과를
  # 관측하며 prod 의 5 분 / 1 시간 default 보다 짧다.
  RECONCILE_INTERVAL: "1m"
  WINDOW: "30m"
  # #84 cross-node interference layer 를 dev 검증 환경 default 로 활성 한다. correlation_cross_node_
  # score series 가 emit 되어 #119 의 /api/v1/cross-node-interference endpoint 와 cross-node row
  # dashboard panel 과 verify.sh 3 차 가드 가 모두 정상 동작 한다. prod overlay 는 운영자가 명시
  # 활성 결정 할 때 까지 default off 유지.
  CROSS_NODE: "true"
