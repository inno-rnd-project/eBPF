apiVersion: v1
kind: ConfigMap
metadata:
  name: correlation-exporter
  namespace: ebpf-project
data:
  # dev cluster 는 검증 cadence 가 빨라야 한다. reconcile 1 분 + window 30 분 으로 빠르게 결과를
  # 관측하며 prod 의 5 분 / 1 시간 default 보다 짧다.
  RECONCILE_INTERVAL: "1m"
  WINDOW: "30m"
  # #147 부터 cross-node interference layer 가 default 활성 (config.DefaultConfig) 이라 dev 에서도
  # 별도 CROSS_NODE env 없이 correlation_cross_node_score series 가 emit 된다. /api/v1/cross-node-
  # interference endpoint 와 dashboard panel 과 verify.sh 가드 가 기본 활성 경로 로 동작 한다.
  # cardinality 부담 시 CROSS_NODE: "false" 로 opt-out 한다.
