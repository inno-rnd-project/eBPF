# #412 단일 2300줄 prometheus-rule.yaml 을 도메인별 5 파일로 분리한 것 중 하나다. 분리는 리소스
# 단위 diff / 리뷰 가시성 확보 목적이며 그룹 내용과 평가 semantics 는 분리 전과 동일하다. 구
# PrometheusRule (netobs-gpuobs-correlation) 은 본 5 리소스로 대체되어 배포 시 1회 수동 삭제가
# 필요하다.
# 본 파일: capacity z-score (30d baseline) 와 spike z-score (7d baseline) recording rule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: netobs-gpuobs-capacity-anomaly
  namespace: ebpf-project
  labels:
    # release 라벨은 servicemonitor.yaml과 동일하게 kube-prometheus-stack Prometheus 인스턴스의
    # ruleSelector에 매치되도록 둔다. 운영 클러스터의 helm release 이름과 일치시켜야 픽업된다.
    release: kube-prometheus-stack
    app.kubernetes.io/name: gpuobs-agent
    app.kubernetes.io/component: prometheus-rules
    app.kubernetes.io/part-of: ebpf-project
spec:
  groups:

    # netobs-gpuobs.capacity-trends.recording 그룹은 #88 의 capacity-trends 패널이 직접 참조하는
    # 1시간 윈도우 사전 집계와 z-score 시계열을 둔다. 패널은 4 도메인 (GPU utilization, network
    # throughput, CPU throttle, memory pressure) 의 4주 heatmap (요일 x 시간대) 과 multi-series
    # overlay 그리고 30일 baseline 대비 z-score 를 같은 row 에 정렬한다. PromQL 단에서 day_of_week
    # 와 hour_of_day 를 라벨로 부착하는 trick 은 label_replace 의 src_label 제약 으로 불가하므로
    # raw 1시간 aggregate 만 emit 하고 Grafana heatmap panel 의 calculate=true 옵션과 timezone
    # Asia/Seoul 설정으로 X축 (hour-of-day) 과 Y축 (day-of-week) 변환을 dashboard 단에서 처리한다.
    # 본 group 의 4 avg record 는 30s 평가 cycle 이지만 expr 자체가 1시간 윈도우 평균이라 evaluation
    # 직후 즉시 채워지고 30일 / 60일 retention 정합은 Commit 1 의 60일 retention 상향에 의존한다.
    # z-score 4종 은 (stddev > 0) 가드 와 clamp(-5, 5) 로 NaN 과 +Inf 시각화 잡음을 차단한다.
    # #412 평가 주기 상향 (1m → 5m). 본 그룹의 z-score 4종은 [30d] baseline 을 매 평가마다 전체
    # 스캔하는데, 신호가 1h 평균 기반의 capacity 선행 지표 (소비 alert 의 for 가 30m) 라 5m 간격
    # 평가로도 의미가 보존된다. 30d range 스캔 빈도가 1/5 로 줄어 rule 평가 비용의 최대 항목이
    # 절감된다.
    - name: netobs-gpuobs.capacity-trends.recording
      interval: 5m
      # #412 rule 산출 시리즈 폭주 backstop. 초과 시 그룹 평가가 실패로 기록되어 폭주가
      # 조용히 스토리지를 채우는 대신 가시화된다. 현행 최대 그룹이 수백 시리즈라 2000 은
      # 정상 운영에 닿지 않는다.
      limit: 2000
      rules:
        # cluster:gpu_util_1h_avg
        # cluster 단위 GPU utilization 의 1시간 평균. 4주 heatmap 과 multi-series overlay 의 base
        # 시계열로 사용된다. cluster scope 라 노드 차이를 drop 하는 max by() 로 cluster 전체 worst-case 의 부하
        # 추세 를 단일 시리즈로 노출 한다.
        - record: cluster:gpu_util_1h_avg
          expr: max by() (avg_over_time(gpuobs_device_utilization_percent[1h]))

        # cluster:network_1h_avg
        # cluster 단위 network throughput score 의 1시간 평균 (0-1 percentunit). 기존
        # pod:network_throughput_score:5m 의 1시간 윈도우 확장 형태. heatmap 표시를 위해 cluster
        # max 채택.
        - record: cluster:network_1h_avg
          expr: max by() (avg_over_time(pod:network_throughput_score:5m[1h]))

        # cluster:cpu_throttle_1h_avg
        # cluster 단위 CPU CFS throttle 비율의 1시간 평균. capacity planning 의 4 도메인 통합 시각
        # 화 를 위해 GPU / network 와 동일 패턴 적용. 본 record 가 0.3 이상 sustained 면 cluster 전체
        # CPU limit 재조정 신호.
        - record: cluster:cpu_throttle_1h_avg
          expr: max by() (avg_over_time(pod:cpu_throttle_score:5m[1h]))

        # cluster:memory_pressure_1h_avg
        # cluster 단위 memory working_set / limit 비율의 1시간 평균. 0.9 이상 sustained 면 OOM 임박
        # 신호. capacity planning 의 4 도메인 중 마지막 도메인 으로 동일 패턴 적용.
        - record: cluster:memory_pressure_1h_avg
          expr: max by() (avg_over_time(pod:memory_pressure_score:5m[1h]))

        # cluster:gpu_util_zscore:1h
        # trailing 30일 baseline (avg + stddev, offset 1h) 대비 current 1시간 평균 의 z-score.
        # #370: 종전 [30d] offset 30d 는 30~60일 전 구간을 참조해 stddev 산출에 최소 60일 retention
        # 이 필요했고 (미만이면 시리즈 미emit 로 capacity alert 4종이 영구 침묵), 주석의 "30일
        # baseline" 과 실제 참조 구간도 어긋났다. 5m 판 (offset 5m) 과 정합하게 offset 1h 로 직전
        # 30일을 참조하며, current 1h 평균 자체는 offset 으로 baseline 에서 제외해 자기 포함 편향을
        # 피한다. baseline window 가 평탄한 케이스 (stddev=0) 는 (stddev > 0) 가드 로 시리즈 미-emit
        # 처리 해 NaN 방지하고, +Inf 시각화 잡음 차단 을 위해 clamp(-5, 5) 로 산출 범위 제한 한다.
        # |z| > 3 임계 는 99.7% 신뢰구간 outside (3-sigma rule) 라 capacity-trends alert 의 발화
        # 조건 이다.
        - record: cluster:gpu_util_zscore:1h
          expr: |
            clamp(
              (
                cluster:gpu_util_1h_avg
                - avg_over_time(cluster:gpu_util_1h_avg[30d] offset 1h)
              )
              / (stddev_over_time(cluster:gpu_util_1h_avg[30d] offset 1h) > 0),
              -5, 5
            )

        # cluster:network_zscore:1h
        # network throughput score 의 z-score. 동일 패턴.
        - record: cluster:network_zscore:1h
          expr: |
            clamp(
              (
                cluster:network_1h_avg
                - avg_over_time(cluster:network_1h_avg[30d] offset 1h)
              )
              / (stddev_over_time(cluster:network_1h_avg[30d] offset 1h) > 0),
              -5, 5
            )

        # cluster:cpu_throttle_zscore:1h
        # CPU throttle 의 z-score. 동일 패턴.
        - record: cluster:cpu_throttle_zscore:1h
          expr: |
            clamp(
              (
                cluster:cpu_throttle_1h_avg
                - avg_over_time(cluster:cpu_throttle_1h_avg[30d] offset 1h)
              )
              / (stddev_over_time(cluster:cpu_throttle_1h_avg[30d] offset 1h) > 0),
              -5, 5
            )

        # cluster:memory_pressure_zscore:1h
        # memory pressure 의 z-score. 동일 패턴.
        - record: cluster:memory_pressure_zscore:1h
          expr: |
            clamp(
              (
                cluster:memory_pressure_1h_avg
                - avg_over_time(cluster:memory_pressure_1h_avg[30d] offset 1h)
              )
              / (stddev_over_time(cluster:memory_pressure_1h_avg[30d] offset 1h) > 0),
              -5, 5
            )

    # netobs-gpuobs.resource-anomaly-spike.recording 그룹은 #89 의 즉시 spike 감지용 5분 윈도우
    # z-score 시계열을 둔다. #88 capacity-trends 의 1시간 윈도우 z-score (장기 capacity planning)
    # 와 시간 척도를 분리해 record 명에 :5m suffix 를 명시하고 baseline window 도 [7d] offset 5m
    # (직전 5분부터 7일치) 로 축소해 단기 spike 감지 의도를 강화한다. 4 도메인 (GPU util, network drop, CPU throttle,
    # memory pressure) 의 base avg / rate 4종 과 z-score 4종 을 동시 emit 한다. base 도메인 은 capacity
    # 의 health 신호 와 다른 raw spike 신호 라 network 는 throughput score 가 아닌 drop rate 를
    # 직접 채택한다. z-score 4종 모두 (stddev > 0) 가드와 clamp(-5, 5) 적용 으로 NaN 과 +Inf 시각화
    # 잡음을 차단한다. baseline window 7일 누적 부족 케이스 (신규 배포 직후) 는 stddev 가드로 record
    # 자체 미 emit 되어 graceful degradation 처리.
    # #412 평가 주기 상향 (30s → 2m). z-score 4종이 [7d] baseline 을 매 평가마다 스캔한다. 즉시
    # RCA 의도의 spike 신호라 capacity 군 (5m) 만큼 늦출 수는 없어 2m 로 두며, 소비 alert 의
    # for: 5m 대비 최악 감지 지연 증가가 2m 에 그치면서 7d 스캔 빈도는 1/4 로 준다.
    - name: netobs-gpuobs.resource-anomaly-spike.recording
      interval: 2m
      # #412 rule 산출 시리즈 폭주 backstop. 초과 시 그룹 평가가 실패로 기록되어 폭주가
      # 조용히 스토리지를 채우는 대신 가시화된다. 현행 최대 그룹이 수백 시리즈라 2000 은
      # 정상 운영에 닿지 않는다.
      limit: 2000
      rules:
        # cluster:gpu_util_5m_avg
        # cluster 단위 GPU utilization 의 5분 평균. spike 감지 용 baseline 시리즈. 1시간 평균
        # (cluster:gpu_util_1h_avg) 과 시간 윈도우 만 다르고 동일 base 메트릭 채택.
        - record: cluster:gpu_util_5m_avg
          expr: max by() (avg_over_time(gpuobs_device_utilization_percent[5m]))

        # cluster:network_drop_5m_rate
        # cluster 단위 network drop event 의 5분 rate. capacity-trends 의 network throughput
        # score 와 다른 신호 도메인 으로 drop rate 자체를 직접 채택해 link quality 이상 의 raw
        # spike 감지가 가능하다. drop_category 와 src_namespace 차원은 sum by() 로 cluster scope
        # 단일 시리즈로 축약 한다.
        - record: cluster:network_drop_5m_rate
          expr: sum by() (rate(netobs_drop_events_labeled_total[5m]))

        # cluster:cpu_throttle_5m_avg
        # cluster 단위 CPU CFS throttle 비율의 5분 평균. cluster:cpu_throttle_1h_avg 와 윈도우
        # 만 다른 동일 base 메트릭 (pod:cpu_throttle_score:5m) 채택.
        - record: cluster:cpu_throttle_5m_avg
          expr: max by() (avg_over_time(pod:cpu_throttle_score:5m[5m]))

        # cluster:memory_pressure_5m_avg
        # cluster 단위 memory working_set / limit 비율의 5분 평균. capacity-trends 패턴 정합 으로
        # 본 이슈 명시 3 도메인 외 추가 4번째 도메인 으로 #88 의 4 도메인 (GPU/network/CPU/memory)
        # 일관성 확보. OOM 임박 spike 의 즉시 감지 용도.
        - record: cluster:memory_pressure_5m_avg
          expr: max by() (avg_over_time(pod:memory_pressure_score:5m[5m]))

        # cluster:gpu_util_zscore:5m
        # 직전 7일 baseline (avg + stddev offset 5m) 대비 현재 5분 평균의 z-score. baseline window
        # offset 5m 은 직전 5분 부터 7일치 데이터 를 baseline 으로 채택해 docs 의 "직전 7일 baseline"
        # 표현과 정합하고 5분 윈도우 즉시 spike 감지 의도 와 일관성 확보. 평탄 baseline (stddev=0)
        # 케이스 의 spike 감지 불가 risk 차단 위해 clamp_min 으로 stddev 최소값 (도메인별 floor) 보장.
        # GPU util 의 floor=1 은 1% 의 최소 변동 stddev 보장 으로 정상 GPU 사용 변동 의 lower bound.
        # clamp(-5, 5) 는 +Inf 시각화 잡음 차단 의 안전 가드.
        - record: cluster:gpu_util_zscore:5m
          expr: |
            clamp(
              (
                cluster:gpu_util_5m_avg
                - avg_over_time(cluster:gpu_util_5m_avg[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:gpu_util_5m_avg[7d] offset 5m), 1),
              -5, 5
            )

        # cluster:network_drop_zscore:5m
        # network drop rate 의 z-score. drop 이 정상 상황 에 0 으로 유지 되는 케이스 가 많아
        # baseline stddev=0 위험 가장 높다. floor=0.1 (event/s) 로 평탄 baseline 시에도 spike
        # 감지 가능 보장.
        - record: cluster:network_drop_zscore:5m
          expr: |
            clamp(
              (
                cluster:network_drop_5m_rate
                - avg_over_time(cluster:network_drop_5m_rate[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:network_drop_5m_rate[7d] offset 5m), 0.1),
              -5, 5
            )

        # cluster:cpu_throttle_zscore:5m
        # CPU throttle 의 z-score. throttle 비율 (0-1) 이 정상 상황에 0 인 케이스 baseline 평탄
        # 위험 차단 위해 floor=0.01 (1% throttle ratio) 적용.
        - record: cluster:cpu_throttle_zscore:5m
          expr: |
            clamp(
              (
                cluster:cpu_throttle_5m_avg
                - avg_over_time(cluster:cpu_throttle_5m_avg[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:cpu_throttle_5m_avg[7d] offset 5m), 0.01),
              -5, 5
            )

        # cluster:memory_pressure_zscore:5m
        # memory pressure 의 z-score. memory 사용량 이 일정 하게 유지 되는 케이스 baseline 평탄
        # 위험 차단 위해 floor=0.01 (1% memory ratio) 적용.
        - record: cluster:memory_pressure_zscore:5m
          expr: |
            clamp(
              (
                cluster:memory_pressure_5m_avg
                - avg_over_time(cluster:memory_pressure_5m_avg[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:memory_pressure_5m_avg[7d] offset 5m), 0.01),
              -5, 5
            )
