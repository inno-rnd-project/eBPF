apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpuobs-agent
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: gpuobs-agent
    app.kubernetes.io/part-of: ebpf-project
    app.kubernetes.io/component: gpu-observer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpuobs-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpuobs-agent
        app.kubernetes.io/part-of: ebpf-project
        app.kubernetes.io/component: gpu-observer
    spec:
      serviceAccountName: gpuobs-agent
      # NVML이 호스트 PID 네임스페이스 기준 PID를 반환하므로, /proc/<pid>/cgroup 파싱으로
      # PID → Pod UID 귀속을 수행하려면 컨테이너가 호스트 PID 네임스페이스를 공유해야 한다.
      # privileged는 여전히 false로 두며, hostPID만 노출해 cgroup 정보 read-only 접근만 허용한다.
      hostPID: true
      containers:
        - name: gpuobs-agent
          image: gpuobs-agent
          imagePullPolicy: IfNotPresent
          args:
            - "-listen"
            - ":9820"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # NVIDIA GPU Operator가 배포하는 container-toolkit은 NVIDIA_VISIBLE_DEVICES env를
            # 트리거로 `/dev/nvidia*` 디바이스와 `libnvidia-ml.so.1` 라이브러리를 컨테이너에
            # 자동 주입한다. NVIDIA_DRIVER_CAPABILITIES=utility는 NVML 질의에 필요한 최소 권한이다.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "utility"
          ports:
            - name: metrics
              containerPort: 9820
              protocol: TCP
          # NVML 폴링과 PID→Pod 귀속(/proc/<pid>/cgroup) 외에 cuda uprobe 모듈이 libcuda.so
          # 심볼에 user-space probe 를 attach 한다. perf_uprobe PMU 호출은 CAP_BPF + CAP_PERFMON 만으로는
          # kernel.perf_event_paranoid 등의 호스트 정책에 의해 거부될 수 있어, netobs 와 동일하게
          # privileged: true 로 운영해 attach 안정성과 운영 일관성을 모두 확보한다.
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          volumeMounts:
            # cuda uprobe 는 host 의 libcuda.so.1 ELF 를 OpenExecutable 로 직접 파싱해야 하며, 이때
            # 컨테이너에 주입된 libcuda 가 아닌 host 의 inode 를 봐야 같은 inode 의 mmap 을 가진 모든
            # 프로세스에서 uprobe 가 fire 한다. read-only hostPath 로 host inode 를 명시 노출한다.
            - name: host-libcuda
              mountPath: /host/usr/lib/x86_64-linux-gnu
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          # Phase 1 placeholder collector 기준 보수적 값으로 잡아두고 Phase 4에서 실측에 따라 튜닝한다.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: host-libcuda
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
            type: Directory
