apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpuobs-agent
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: gpuobs-agent
    app.kubernetes.io/part-of: ebpf-project
    app.kubernetes.io/component: gpu-observer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpuobs-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpuobs-agent
        app.kubernetes.io/part-of: ebpf-project
        app.kubernetes.io/component: gpu-observer
    spec:
      serviceAccountName: gpuobs-agent
      # NVML이 호스트 PID 네임스페이스 기준 PID를 반환하므로, /proc/<pid>/cgroup 파싱으로
      # PID → Pod UID 귀속을 수행하려면 컨테이너가 호스트 PID 네임스페이스를 공유해야 한다.
      # privileged는 여전히 false로 두며, hostPID만 노출해 cgroup 정보 read-only 접근만 허용한다.
      hostPID: true
      containers:
        - name: gpuobs-agent
          image: gpuobs-agent
          imagePullPolicy: IfNotPresent
          args:
            - "-listen"
            - ":9820"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # NVIDIA GPU Operator가 배포하는 container-toolkit은 NVIDIA_VISIBLE_DEVICES env를
            # 트리거로 `/dev/nvidia*` 디바이스와 `libnvidia-ml.so.1` 라이브러리를 컨테이너에
            # 자동 주입한다. NVIDIA_DRIVER_CAPABILITIES=utility는 NVML 질의에 필요한 최소 권한이다.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "utility"
          ports:
            - name: metrics
              containerPort: 9820
              protocol: TCP
          # cuda uprobe 는 uprobe_multi link (BPF_LINK_CREATE) 경로를 사용해 perf_event_open 우회한다.
          # 따라서 kernel.perf_event_paranoid 정책 (Ubuntu default 4) 의 차단을 받지 않으며
          # privileged: false 로도 attach 가 성립한다. drop ALL 후 본 워크로드가 실제 필요로 하는 세
          # capability 만 명시한다. CAP_BPF 는 bpf() syscall, CAP_PERFMON 은 tracing-class BPF program
          # 로드, CAP_SYS_PTRACE 는 non-root GPU 워크로드의 /proc/<pid>/environ (mode 0400) 에서
          # NVIDIA_VISIBLE_DEVICES 를 추출해 multi-GPU ordinal-to-UUID 매핑 정확도를 유지하는 데
          # 사용된다. /proc/<pid>/cgroup (Pod UID 추출, mode 0444) 은 cap 없이 읽히지만 hostPID: true
          # 가 있어야 NVML 이 보고한 host PID 와 /proc 항목이 매칭된다.
          # readOnlyRootFilesystem 은 cuda uprobe 모듈이 디스크 쓰기를 하지 않는다는 사실 위에서 함께
          # 강화한다 (기본 false 였던 부분을 명시적으로 true 로 끌어올림). kernel 6.6+ 가 uprobe_multi
          # link 전제이므로 호스트 요구 사양은 README 의 gpuobs-agent 섹션에서 명시한다.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - PERFMON
                - SYS_PTRACE
          volumeMounts:
            # cuda uprobe 는 host 의 libcuda.so.1 ELF 를 OpenExecutable 로 직접 파싱해야 하며, 이때
            # 컨테이너에 주입된 libcuda 가 아닌 host 의 inode 를 봐야 같은 inode 의 mmap 을 가진 모든
            # 프로세스에서 uprobe 가 fire 한다. read-only hostPath 로 host inode 를 명시 노출한다.
            - name: host-libcuda
              mountPath: /host/usr/lib/x86_64-linux-gnu
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          # Phase 1 placeholder collector 기준 보수적 값으로 잡아두고 Phase 4에서 실측에 따라 튜닝한다.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: host-libcuda
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
            type: Directory
