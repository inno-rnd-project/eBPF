apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: netobs-gpuobs-correlation
  namespace: ebpf-project
  labels:
    # release 라벨은 servicemonitor.yaml과 동일하게 kube-prometheus-stack Prometheus 인스턴스의
    # ruleSelector에 매치되도록 둔다. 운영 클러스터의 helm release 이름과 일치시켜야 픽업된다.
    release: kube-prometheus-stack
    app.kubernetes.io/name: gpuobs-agent
    app.kubernetes.io/component: prometheus-rules
    app.kubernetes.io/part-of: ebpf-project
spec:
  groups:
    # netobs-gpuobs.recording 그룹은 두 agent의 메트릭을 한 단위로 산출하는 recording rule을 모은다.
    # interval 30s는 kube-prometheus-stack 기본값과 동일해 평가 cadence를 일관되게 유지한다.
    # netobs를 참조하는 rule(pod:network_egress_rate:5m)도 본 그룹에 함께 둔다 — 단독 운영이 아니라
    # gpuobs와의 상관 분석 산출물이며 cross-cutting rule들의 위치를 단일화하기 위해서다.
    - name: netobs-gpuobs.recording
      interval: 30s
      rules:
        # node:gpu_util_p95:5m
        # 노드별 GPU 사용률 5분 윈도우 95-percentile. 멀티 GPU 노드는 GPU 단위 p95를 먼저 산출한 뒤
        # node 차원에서 max로 롤업해 "노드의 가장 바쁜 GPU" 부하를 단일 시리즈로 노출한다.
        # 이슈 원안 pod:gpu_util_p95:5m는 NVML이 pod-level GPU compute util을 노출하지 않아 정의 불가하므로
        # device-level로 대체했다 (README의 Per-metric NVML support detection 노트 참고).
        - record: node:gpu_util_p95:5m
          expr: max by(node) (quantile_over_time(0.95, gpuobs_device_utilization_percent[5m]))

        # pod:gpu_memory_used_avg:5m
        # pod x GPU 단위 5분 평균 메모리 사용량. 라벨은 (node, src_namespace, src_pod, src_pod_uid, gpu_uuid, gpu_index) 그대로 보존.
        - record: pod:gpu_memory_used_avg:5m
          expr: avg_over_time(gpuobs_pod_memory_used_bytes[5m])

        # pod:network_egress_rate:5m
        # #47 머지로 도입된 netobs_pod_bytes_total을 분자로 써서 pod 단위 egress 트래픽을 bytes/sec로
        # 산출한다. direction / layer 차원은 본 record에서 합산해 pod 단위 단일 시리즈로 만든다.
        # cAdvisor의 container_network_*_bytes 와 비교 가능한 단위이며 correlation 진단에서 network
        # throughput score의 양적 기준으로 활용된다.
        - record: pod:network_egress_rate:5m
          expr: sum by(node, src_namespace, src_pod, src_pod_uid) (rate(netobs_pod_bytes_total{direction="egress"}[5m]))

        # node:gpu_throttle_seconds:rate5m
        # reason별 누적 throttle 시간(seconds counter)의 5분 rate. 단위는 seconds/sec — 1.0이면 해당 reason이
        # 윈도우 내내 활성이었음을 뜻한다. node x reason 차원으로 합산해 멀티 GPU 노드도 단일 추세로 본다.
        - record: node:gpu_throttle_seconds:rate5m
          expr: sum by(node, reason) (rate(gpuobs_device_throttle_violation_seconds_total[5m]))

        # node:gpu_power_headroom_watts
        # 노드 단위 GPU power headroom — limit과 사용량의 차를 GPU별로 산출한 뒤 노드 내 최솟값(min)을 채택해
        # "노드의 가장 위험한 GPU" 기준으로 노드당 1 시리즈로 요약한다. 음수면 limit 근접/초과 상태.
        # node: 접두사 규약에 맞춰 노드 차원으로 rollup하며, GPU별 상세는 raw 메트릭(gpuobs_device_power_*)에서 확인한다.
        - record: node:gpu_power_headroom_watts
          expr: min by(node) (gpuobs_device_power_limit_watts - gpuobs_device_power_usage_watts)

        # pod:gpu_memory_utilization_ratio:5m
        # pod의 5분 평균 메모리 사용량을 device 총 메모리로 나눈 비율(0-1). group_left로 device 라벨은 취하지 않고
        # pod 라벨을 보존한다. 한 pod이 device 메모리를 어느 정도 점유하는지 확인하는 직접적인 추세 지표.
        - record: pod:gpu_memory_utilization_ratio:5m
          expr: avg_over_time(gpuobs_pod_memory_used_bytes[5m]) / on(node, gpu_uuid, gpu_index) group_left() gpuobs_device_memory_total_bytes

        # node:gpu_ecc_errors:rate5m
        # error_type별 ECC 에러 발생률(errors/sec). RTX 3090 같은 컨슈머 GPU는 ECC 미지원이라 base 시리즈가 없어
        # 본 record도 빈 결과를 산출하는 것이 정상 동작이다. 데이터센터 GPU 합류 시 비로소 의미 있는 시리즈가 생긴다.
        - record: node:gpu_ecc_errors:rate5m
          expr: sum by(node, error_type) (rate(gpuobs_device_ecc_errors_total[5m]))

        # node:gpu_energy_watts_avg:5m
        # 누적 에너지 카운터의 5분 rate는 곧 J/sec = Watts 이므로 "5분 평균 전력" 시계열을 산출한다.
        # instantaneous gpuobs_device_power_usage_watts와 별개로 spike 평균낸 추세를 dashboard에 노출한다. 노드 차원 합산.
        - record: node:gpu_energy_watts_avg:5m
          expr: sum by(node) (rate(gpuobs_device_energy_consumption_joules_total[5m]))

        # node:gpu_pcie_replay:rate5m
        # PCIe 링크 재전송 발생률(errors/sec). 정상 환경에서는 0에 가깝고, 지속적 증가는 라이저/케이블/슬롯 문제 시그널이다.
        # alert rule을 직접 두지 않더라도 dashboard의 health 패널 시각화에 적합.
        - record: node:gpu_pcie_replay:rate5m
          expr: sum by(node) (rate(gpuobs_device_pcie_replay_errors_total[5m]))

        # node:gpu_temperature_headroom_celsius
        # 노드 x threshold 단위 thermal headroom — GPU별 (threshold − 현재 온도) 를 산출한 뒤 노드 내 최솟값(min)을 채택해
        # "노드의 가장 위험한 GPU" 기준으로 (node, threshold) 당 1 시리즈로 요약한다. 양수면 안전 마진, 0 이하면 throttle/shutdown 임박.
        # 두 원본 메트릭의 라벨 차이는 LHS의 threshold 라벨 하나뿐이라 ignoring(threshold) group_left() 로 many-to-one 매칭한 뒤 노드로 rollup한다.
        - record: node:gpu_temperature_headroom_celsius
          expr: min by(node, threshold) (gpuobs_device_temperature_threshold_celsius - ignoring(threshold) group_left() gpuobs_device_temperature_celsius)

    # netobs-gpuobs.gpu-idle.recording 그룹은 GPU 유휴 정의와 원인 후보 score 6건을 산출한다.
    # 운영자가 GPU 유휴 알림을 받았을 때 단일 진단 가이드 (docs/correlation/diagnosis-gpu-idle.md) 로
    # 원인을 짚을 수 있게 cause score를 모두 0-1 정규화 해 모은다. score 정규화 분모는 두 tunable
    # 메트릭 (netobs_node_nic_capacity_bytes_per_sec, gpuobs_node_cuda_launch_baseline_per_sec) 으로
    # 클러스터별 override 가능하다. PCIe 이론치는 device 의 link generation/width 메트릭에서
    # 동적 산출되므로 GPU 모델 혼합 클러스터에서도 정확하다.
    - name: netobs-gpuobs.gpu-idle.recording
      interval: 30s
      rules:
        # node:gpu_idle:5m
        # 5분 윈도우에서 GPU 사용률이 20% 미만이었던 시간 비율 (0-1). 노드 내 GPU별 비율의 평균을
        # 노드 단위로 rollup한다. avg_over_time + bool 비교 + subquery 패턴이라 evaluation 비용이
        # 다른 rule보다 높으니 group interval 변경 시 주의.
        - record: node:gpu_idle:5m
          expr: |
            avg by(node) (
              avg_over_time((gpuobs_device_utilization_percent < bool 20)[5m:30s])
            )

        # node:gpu_pcie_theoretical_bytes_per_sec
        # GPU device 별 PCIe 이론 throughput (bytes/sec). gpuobs_device_pcie_link_generation_current 와
        # gpuobs_device_pcie_link_width_current 에 따라 Gen1-5 × x8/x16 10개 조합을 분기로 매핑한다.
        # Gen1/2는 NVIDIA GPU가 idle 시 다운클록되는 link state라 saturation 계산에 반드시 포함되어야
        # false positive (Gen1로 다운클록된 상태에서 작은 PCIe traffic이 분모 0과 만나 +Inf로 saturate)
        # 를 막을 수 있다. x4 이하 또는 매핑 표 외 조합은 saturation rule의 ">0" 필터로 무시된다.
        - record: node:gpu_pcie_theoretical_bytes_per_sec
          expr: |
            (gpuobs_device_pcie_link_generation_current == bool 1) * (gpuobs_device_pcie_link_width_current == bool 8) * 2e9
            + (gpuobs_device_pcie_link_generation_current == bool 1) * (gpuobs_device_pcie_link_width_current == bool 16) * 4e9
            + (gpuobs_device_pcie_link_generation_current == bool 2) * (gpuobs_device_pcie_link_width_current == bool 8) * 4e9
            + (gpuobs_device_pcie_link_generation_current == bool 2) * (gpuobs_device_pcie_link_width_current == bool 16) * 8e9
            + (gpuobs_device_pcie_link_generation_current == bool 3) * (gpuobs_device_pcie_link_width_current == bool 8) * 7.88e9
            + (gpuobs_device_pcie_link_generation_current == bool 3) * (gpuobs_device_pcie_link_width_current == bool 16) * 15.75e9
            + (gpuobs_device_pcie_link_generation_current == bool 4) * (gpuobs_device_pcie_link_width_current == bool 8) * 15.75e9
            + (gpuobs_device_pcie_link_generation_current == bool 4) * (gpuobs_device_pcie_link_width_current == bool 16) * 31.5e9
            + (gpuobs_device_pcie_link_generation_current == bool 5) * (gpuobs_device_pcie_link_width_current == bool 8) * 31.5e9
            + (gpuobs_device_pcie_link_generation_current == bool 5) * (gpuobs_device_pcie_link_width_current == bool 16) * 63e9

        # node:gpu_pcie_saturation_score:5m
        # 노드 GPU 의 PCIe 실 throughput (RX + TX) 대비 이론치 비율 (0-1). 0.7 이상이면 PCIe가 GPU 유휴의
        # 원인일 가능성이 높다. 분모를 ">0"으로 필터해 매핑 표 외 조합 (Gen0 등 비정상 link state) 에서
        # 0 division으로 NaN/+Inf가 생기는 false positive를 차단한다. 그 결과 매핑 불가 노드는 series
        # 자체가 emit되지 않아 alert에서도 자연 제외된다.
        - record: node:gpu_pcie_saturation_score:5m
          expr: |
            clamp_max(
              sum by(node) (gpuobs_device_pcie_rx_bytes_per_second + gpuobs_device_pcie_tx_bytes_per_second)
              / on(node) group_left()
              (sum by(node) (node:gpu_pcie_theoretical_bytes_per_sec) > 0),
              1
            )

        # pod:network_throughput_score:5m
        # Pod 단위 네트워크 throughput 대비 노드 NIC 이론 capacity 비율 (0-1). egress는 NIC layer,
        # ingress는 L4 layer (NIC ingress는 #47 follow-up) 을 합산해 양방향 traffic을 근사한다.
        # 분모는 netobs-agent가 startup 시 노출하는 NIC capacity tunable이다.
        - record: pod:network_throughput_score:5m
          expr: |
            clamp_max(
              (
                sum by(node, src_namespace, src_pod, src_pod_uid) (
                  rate(netobs_pod_bytes_total{direction="egress",layer="nic"}[5m])
                )
                +
                sum by(node, src_namespace, src_pod, src_pod_uid) (
                  rate(netobs_pod_bytes_total{direction="ingress",layer="l4"}[5m])
                )
              )
              / on(node) group_left()
              netobs_node_nic_capacity_bytes_per_sec,
              1
            )

        # pod:network_retrans_score:5m
        # Pod 단위 TCP 재전송 비율 (retrans events/sec / total packets/sec) 을 saturate. 0.05 이상이면
        # 네트워크 품질 저하 신호다. 분자는 netobs_pod_stage_events_labeled_total{stage="retrans"}로
        # pod 단위 재전송을, 분모는 netobs_pod_packets_total로 pod 단위 총 패킷을 산출한다.
        - record: pod:network_retrans_score:5m
          expr: |
            clamp_max(
              sum by(node, src_namespace, src_pod, src_pod_uid) (
                rate(netobs_pod_stage_events_labeled_total{stage="retrans"}[5m])
              )
              /
              sum by(node, src_namespace, src_pod, src_pod_uid) (
                rate(netobs_pod_packets_total[5m])
              ),
              1
            )

        # pod:cpu_throttle_score:5m
        # cAdvisor의 CPU CFS throttled / total periods 비율 (0-1). 0.3 이상이면 컨테이너 CPU limit
        # 으로 인한 throttle이 빈번하다. label_replace로 cAdvisor의 namespace/pod 라벨을 netobs/gpuobs
        # 메트릭과 join 가능하도록 src_namespace/src_pod로 alias한다 (원본 라벨도 함께 유지).
        - record: pod:cpu_throttle_score:5m
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  sum by(node, namespace, pod) (rate(container_cpu_cfs_throttled_periods_total[5m]))
                  / on(node, namespace, pod)
                  sum by(node, namespace, pod) (rate(container_cpu_cfs_periods_total[5m])),
                  "src_namespace", "$1", "namespace", "(.+)"
                ),
                "src_pod", "$1", "pod", "(.+)"
              ),
              1
            )

        # pod:memory_pressure_score:5m
        # 컨테이너 메모리 working_set 대비 resource limit 비율 (0-1). 0.9 이상이면 OOM 임박 신호.
        # kube-state-metrics의 kube_pod_container_resource_limits는 node 라벨이 없어 (namespace, pod)
        # 로 join하고, cAdvisor 의 node 라벨은 working_set 측에서 보존된다.
        - record: pod:memory_pressure_score:5m
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  sum by(node, namespace, pod) (container_memory_working_set_bytes)
                  / on(namespace, pod) group_left()
                  sum by(namespace, pod) (kube_pod_container_resource_limits{resource="memory"}),
                  "src_namespace", "$1", "namespace", "(.+)"
                ),
                "src_pod", "$1", "pod", "(.+)"
              ),
              1
            )

        # pod:host_compute_stall_score:5m
        # host측 CUDA kernel launch rate 부족과 GPU device memory pressure 둘 중 큰 쪽을 채택한다.
        # 둘 다 GPU가 호스트 측 또는 device 측 자원 한계로 추가 kernel을 실행하지 못하는 상태를
        # 가리키므로 cross-validation 가치가 있다. 단순 max 라 두 신호가 동시에 높을 때 의미가 약화
        # 되는 한계는 docs에 명시한다.
        - record: pod:host_compute_stall_score:5m
          expr: |
            max by(node, src_namespace, src_pod, src_pod_uid) (
              clamp_min(
                clamp_max(
                  1 - (
                    sum by(node, src_namespace, src_pod, src_pod_uid) (rate(gpuobs_cuda_kernel_launches_total[5m]))
                    / on(node) group_left()
                    gpuobs_node_cuda_launch_baseline_per_sec
                  ),
                  1
                ),
                0
              )
              or
              pod:gpu_memory_utilization_ratio:5m
            )

    # netobs-gpuobs.alerts 그룹은 운영 임계 초과를 Alertmanager로 전달하는 alert rule을 모은다.
    # severity 라벨로 critical(즉시 대응)과 warning(추세 관찰)을 구분한다. for 절은 false-positive
    # 차단 목적으로 2분 이상을 기본으로 둔다. ECC와 PCIe replay 알람은 본 그룹에서 제외했다.
    # 두 메트릭(gpuobs_device_ecc_errors_total, gpuobs_device_pcie_replay_errors_total)의
    # emit 경로가 아직 구현되지 않아 알람이 dead alert가 되기 때문이며, 메트릭 emit이 추가되는
    # 시점에 본 그룹에 함께 들여온다.
    - name: netobs-gpuobs.alerts
      interval: 30s
      rules:
        # NetObsHighStageLatencyP99
        # 5분 윈도우 p99 stage latency가 1초를 초과하고 동시에 해당 stage의 이벤트 발생률이
        # 1event/s 이상일 때만 발화한다. 발생률 필터는 sparse 시리즈에서 +Inf 버킷 fallback이
        # 만드는 노이즈를 차단한다. 임계 1초는 현재 histogram bucket의 최상위 finite 경계
        # (0.524288s)보다 위로 두어 bucket fallback 값(0.524288)이 baseline에서 발화하지 않도록
        # 한다. 더 세밀한 임계가 필요하면 netobs의 histogram bucket 범위를 확장한 뒤 임계를
        # 낮추는 follow-up이 필요하다.
        - alert: NetObsHighStageLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum by (le, stage, src_workload, src_namespace, node) (
                rate(netobs_stage_latency_labeled_seconds_bucket[5m])
              )
            ) > 1.0
            and
            sum by (stage, src_workload, src_namespace, node) (
              rate(netobs_stage_latency_labeled_seconds_count[5m])
            ) > 1
          for: 5m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs stage latency p99 over 1s (node={{ $labels.node }} workload={{ $labels.src_namespace }}/{{ $labels.src_workload }} stage={{ $labels.stage }})"
            description: "stage {{ $labels.stage }} latency p99 of workload {{ $labels.src_namespace }}/{{ $labels.src_workload }} on node {{ $labels.node }} is {{ $value | humanizeDuration }} over the last 5 minutes."

        # NetObsHighDropRate
        # drop_category별 drop rate가 10event/s를 초과하면 발화한다. 카테고리별로 분리해
        # 정책(policy)/큐 포화(queue)/checksum 등 원인 그룹을 즉시 식별할 수 있게 한다.
        - alert: NetObsHighDropRate
          expr: |
            sum by (node, drop_category, src_namespace, src_workload) (
              rate(netobs_drop_events_labeled_total[5m])
            ) > 10
          for: 2m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs drop rate over 10/s (node={{ $labels.node }} category={{ $labels.drop_category }})"
            description: "drop category {{ $labels.drop_category }} for workload {{ $labels.src_namespace }}/{{ $labels.src_workload }} on node {{ $labels.node }} is {{ $value }} events/sec sustained over 2 minutes. Reference docs/netobs/drop-reason.md for category semantics."

        # NetObsHighRetransmissionRate
        # TCP 재전송 rate가 5event/s를 넘으면 발화. 네트워크 혼잡, peer 처리 지연, 경로 패킷
        # 손실 셋 중 하나의 시그널이다.
        - alert: NetObsHighRetransmissionRate
          expr: |
            sum by (node, src_namespace, src_workload) (
              rate(netobs_retrans_events_labeled_total[5m])
            ) > 5
          for: 2m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs retransmission rate over 5/s (node={{ $labels.node }} workload={{ $labels.src_namespace }}/{{ $labels.src_workload }})"
            description: "TCP retransmission rate for workload {{ $labels.src_namespace }}/{{ $labels.src_workload }} on node {{ $labels.node }} is {{ $value }} events/sec sustained over 2 minutes."

        # GPUObsThrottleActive
        # hw_* / sw_thermal_slowdown / sw_power_cap reason은 운영상 문제 시그널이라 활성이면 critical.
        # gpu_idle / applications_clocks_setting / display_clock_setting / sync_boost는 정상 동작 신호라
        # reason 필터로 제외한다. for: 1m은 다른 critical보다 짧게 두어 throttle 발생을 즉시 포착한다.
        - alert: GPUObsThrottleActive
          expr: |
            gpuobs_device_throttle_active{reason=~"hw_slowdown|hw_thermal_slowdown|hw_power_brake_slowdown|sw_thermal_slowdown|sw_power_cap"} == 1
          for: 1m
          labels:
            severity: critical
            component: gpuobs
          annotations:
            summary: "GPU throttle active ({{ $labels.reason }}) on {{ $labels.node }} gpu_index={{ $labels.gpu_index }}"
            description: "GPU {{ $labels.gpu_index }} ({{ $labels.gpu_model }} uuid={{ $labels.gpu_uuid }}) on node {{ $labels.node }} is throttling due to {{ $labels.reason }}. Throughput is reduced. Check thermal headroom, power budget, or downstream hardware limits."

        # GPUObsThermalHeadroomLow
        # threshold(slowdown/hwslowdown/shutdown) 대비 5℃ 이내로 좁혀지면 발화. 기존 recording
        # rule node:gpu_temperature_headroom_celsius를 재사용해 노드 단위 최악 GPU 기준으로 평가한다.
        - alert: GPUObsThermalHeadroomLow
          expr: node:gpu_temperature_headroom_celsius < 5
          for: 2m
          labels:
            severity: critical
            component: gpuobs
          annotations:
            summary: "GPU thermal headroom below 5C on {{ $labels.node }} (threshold={{ $labels.threshold }})"
            description: "Thermal headroom for the worst GPU on node {{ $labels.node }} against threshold {{ $labels.threshold }} is {{ $value }}C. Thermal slowdown or shutdown is imminent. Check cooling, fan speed, or reduce GPU load."

        # GPUObsPowerHeadroomLow
        # power limit과 현재 사용량 차이가 10W 이내면 발화. 기존 recording rule
        # node:gpu_power_headroom_watts를 재사용한다. sw_power_cap throttle이 곧 발생할 수 있는 사전 시그널.
        - alert: GPUObsPowerHeadroomLow
          expr: node:gpu_power_headroom_watts < 10
          for: 2m
          labels:
            severity: warning
            component: gpuobs
          annotations:
            summary: "GPU power headroom below 10W on {{ $labels.node }}"
            description: "Power headroom (limit minus current usage) for the worst GPU on node {{ $labels.node }} is {{ $value }}W. The GPU is approaching its power limit and may start power-cap throttling. Consider reducing concurrent CUDA workloads."

    # netobs-gpuobs.gpu-idle.alerts 그룹은 GPU 유휴 상태와 5종 cause score 조합 alert을 모은다.
    # 단일 cause는 warning, host_compute_stall 은 host와 device 양쪽 자원 한계가 동시에 의심되므로
    # critical로 둔다. cutoff는 docs/correlation/diagnosis-gpu-idle.md 의 기본값 (warning 0.5, critical
    # 0.7-0.9) 을 따른다. for 5m으로 spike에 의한 false-positive를 차단한다.
    - name: netobs-gpuobs.gpu-idle.alerts
      interval: 30s
      rules:
        # GPUIdleWithPCIeSaturation
        # 노드 GPU 가 5분 평균 50% 이상 유휴이면서 PCIe saturation score 가 0.7 이상이면 발화.
        # GPU 작업 데이터가 PCIe 대역폭에 막혀 GPU가 일을 기다리는 시나리오. saturation score를 LHS에
        # 두어 alert의 $value가 PCIe score를 가리키도록 한다 ($value는 LHS 값으로 평가됨).
        - alert: GPUIdleWithPCIeSaturation
          expr: node:gpu_pcie_saturation_score:5m > 0.7 and on(node) node:gpu_idle:5m > 0.5
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with PCIe saturation on {{ $labels.node }} (score={{ $value }})"
            description: "Node {{ $labels.node }} GPUs are idle while PCIe saturation score is {{ $value }} (threshold 0.7). See docs/correlation/diagnosis-gpu-idle.md for diagnosis steps."

        # GPUIdleWithNetworkPressure
        # GPU 유휴 + (네트워크 throughput 포화 또는 재전송 비율 상승). Pod 단위 score라 어떤 pod이
        # 원인인지 src_namespace / src_pod 라벨로 식별 가능. retrans cutoff 0.05는 5% 이상 재전송 비율.
        # cause score를 LHS에 두어 $value 와 pod 라벨 (src_namespace, src_pod) 이 보존된다.
        - alert: GPUIdleWithNetworkPressure
          expr: |
            (
              pod:network_throughput_score:5m > 0.7
              or
              pod:network_retrans_score:5m > 0.05
            )
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with network pressure on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} score={{ $value }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} shows network throughput or retransmission score {{ $value }} while GPU is idle. Check whether the GPU workload depends on this pod's network I/O."

        # GPUIdleWithCPUThrottle
        # GPU 유휴 + 컨테이너 CPU CFS throttle. CPU limit 으로 인해 host측이 GPU에 작업을 보내지
        # 못하는 시나리오. cutoff 0.3은 30% 이상 period가 throttle된 상태. cause score를 LHS에 두어
        # $value 와 pod 라벨 이 보존된다.
        - alert: GPUIdleWithCPUThrottle
          expr: |
            (pod:cpu_throttle_score:5m > 0.3)
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with CPU throttle on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} score={{ $value }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} is CPU-throttled (score={{ $value }}) while GPU is idle. Consider raising CPU limit or reducing concurrent CPU work."

        # GPUIdleWithMemoryPressure
        # GPU 유휴 + 컨테이너 메모리 working_set 이 limit에 임박. OOMKilled 전조이며 GPU 작업이 host
        # 메모리 부족으로 stall될 수 있다. cutoff 0.9은 working_set이 limit의 90%를 넘는 상태. cause
        # score를 LHS에 두어 $value (메모리 working_set / limit 비율) 와 pod 라벨 이 보존된다.
        - alert: GPUIdleWithMemoryPressure
          expr: |
            (pod:memory_pressure_score:5m > 0.9)
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with memory pressure on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} memory working_set / limit ratio is {{ $value | humanizePercentage }} while GPU is idle. Consider raising memory limit before OOMKill."

        # GPUIdleWithHostComputeStall
        # GPU 유휴 + host측 CUDA launch 부족 또는 GPU device memory 포화. host 또는 device 측에서
        # GPU 작업을 진행할 수 없는 상태이며 다른 cause score와 무관하게 GPU 자체 활용이 막힌 critical
        # 시그널이다. cutoff 0.7은 baseline의 30% 미만 launch rate 또는 GPU memory 70% 이상. cause
        # score를 LHS에 두어 $value 와 pod 라벨 이 보존된다.
        - alert: GPUIdleWithHostComputeStall
          expr: |
            (pod:host_compute_stall_score:5m > 0.7)
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: critical
            component: correlation
          annotations:
            summary: "GPU idle with host compute stall on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} score={{ $value }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} shows host compute stall (low CUDA launch rate or GPU memory saturation, score={{ $value }}) while GPU is idle. Inspect kernel launches via gpuobs_cuda_kernel_launches_total and GPU memory via pod:gpu_memory_utilization_ratio:5m."
