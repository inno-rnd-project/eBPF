apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: netobs-gpuobs-correlation
  namespace: ebpf-project
  labels:
    # release 라벨은 servicemonitor.yaml과 동일하게 kube-prometheus-stack Prometheus 인스턴스의
    # ruleSelector에 매치되도록 둔다. 운영 클러스터의 helm release 이름과 일치시켜야 픽업된다.
    release: kube-prometheus-stack
    app.kubernetes.io/name: gpuobs-agent
    app.kubernetes.io/component: prometheus-rules
    app.kubernetes.io/part-of: ebpf-project
spec:
  groups:
    # netobs-gpuobs.recording 그룹은 두 agent의 메트릭을 한 단위로 산출하는 recording rule을 모은다.
    # interval 30s는 kube-prometheus-stack 기본값과 동일해 평가 cadence를 일관되게 유지한다.
    # netobs를 참조하는 rule(pod:network_egress_rate:5m)도 본 그룹에 함께 둔다 — 단독 운영이 아니라
    # gpuobs와의 상관 분석 산출물이며 cross-cutting rule들의 위치를 단일화하기 위해서다.
    - name: netobs-gpuobs.recording
      interval: 30s
      rules:
        # node:gpu_util_p95:5m
        # 노드별 GPU 사용률 5분 윈도우 95-percentile. 멀티 GPU 노드는 GPU 단위 p95를 먼저 산출한 뒤
        # node 차원에서 max로 롤업해 "노드의 가장 바쁜 GPU" 부하를 단일 시리즈로 노출한다.
        # #104 도입의 gpuobs_pod_utilization_percent 기반 pod:gpu_util_p95:5m 가 정식 시리즈로 추가되어
        # 본 node:* 시리즈와 pod 단위가 함께 운용된다.
        - record: node:gpu_util_p95:5m
          expr: max by(node) (quantile_over_time(0.95, gpuobs_device_utilization_percent[5m]))

        # pod:gpu_util_p95:5m
        # pod x GPU 단위 5분 윈도우 95-percentile GPU 사용률. #104 의 gpuobs_pod_utilization_percent 도입으로
        # 정식 시리즈로 승격된 record다. capacity-trends (#86 과 #88) 의 GPU 도메인 device-scope fallback 강등
        # 이 본 시리즈 활성으로 회복된다. MIG 활성 환경의 instance 단위는 별도 gpuobs_pod_mig_utilization_percent
        # 기반 시리즈로 향후 분리 발행 가능 하다. 라벨 셋은 (node, src_namespace, src_pod, src_pod_uid, gpu_uuid)
        # 5종 으로 두어 #120 의 pod:gpu_network_correlation_score:5m 가 4 Pod 라벨 join key 로 정합 가능 하게
        # 한다.
        - record: pod:gpu_util_p95:5m
          expr: max by(node, src_namespace, src_pod, src_pod_uid, gpu_uuid) (quantile_over_time(0.95, gpuobs_pod_utilization_percent[5m]))

        # pod:gpu_memory_used_avg:5m
        # pod x GPU 단위 5분 평균 메모리 사용량. 라벨은 (node, src_namespace, src_pod, src_pod_uid, gpu_uuid, gpu_index) 그대로 보존.
        - record: pod:gpu_memory_used_avg:5m
          expr: avg_over_time(gpuobs_pod_memory_used_bytes[5m])

        # pod:network_egress_rate:5m
        # #47 머지로 도입된 netobs_pod_bytes_total을 분자로 써서 pod 단위 egress 트래픽을 bytes/sec로
        # 산출한다. direction / layer 차원은 본 record에서 합산해 pod 단위 단일 시리즈로 만든다.
        # cAdvisor의 container_network_*_bytes 와 비교 가능한 단위이며 correlation 진단에서 network
        # throughput score의 양적 기준으로 활용된다.
        - record: pod:network_egress_rate:5m
          expr: sum by(node, src_namespace, src_pod, src_pod_uid) (rate(netobs_pod_bytes_total{direction="egress"}[5m]))

        # node:gpu_throttle_seconds:rate5m
        # reason별 누적 throttle 시간(seconds counter)의 5분 rate. 단위는 seconds/sec — 1.0이면 해당 reason이
        # 윈도우 내내 활성이었음을 뜻한다. node x reason 차원으로 합산해 멀티 GPU 노드도 단일 추세로 본다.
        - record: node:gpu_throttle_seconds:rate5m
          expr: sum by(node, reason) (rate(gpuobs_device_throttle_violation_seconds_total[5m]))

        # node:gpu_power_headroom_watts
        # 노드 단위 GPU power headroom — limit과 사용량의 차를 GPU별로 산출한 뒤 노드 내 최솟값(min)을 채택해
        # "노드의 가장 위험한 GPU" 기준으로 노드당 1 시리즈로 요약한다. 음수면 limit 근접/초과 상태.
        # node: 접두사 규약에 맞춰 노드 차원으로 rollup하며, GPU별 상세는 raw 메트릭(gpuobs_device_power_*)에서 확인한다.
        - record: node:gpu_power_headroom_watts
          expr: min by(node) (gpuobs_device_power_limit_watts - gpuobs_device_power_usage_watts)

        # pod:gpu_memory_utilization_ratio:5m
        # pod의 5분 평균 메모리 사용량을 device 총 메모리로 나눈 비율(0-1). group_left로 device 라벨은 취하지 않고
        # pod 라벨을 보존한다. 한 pod이 device 메모리를 어느 정도 점유하는지 확인하는 직접적인 추세 지표.
        - record: pod:gpu_memory_utilization_ratio:5m
          expr: avg_over_time(gpuobs_pod_memory_used_bytes[5m]) / on(node, gpu_uuid, gpu_index) group_left() gpuobs_device_memory_total_bytes

        # node:gpu_ecc_errors:rate5m
        # error_type별 ECC 에러 발생률(errors/sec). RTX 3090 같은 컨슈머 GPU는 ECC 미지원이라 base 시리즈가 없어
        # 본 record도 빈 결과를 산출하는 것이 정상 동작이다. 데이터센터 GPU 합류 시 비로소 의미 있는 시리즈가 생긴다.
        - record: node:gpu_ecc_errors:rate5m
          expr: sum by(node, error_type) (rate(gpuobs_device_ecc_errors_total[5m]))

        # node:gpu_energy_watts_avg:5m
        # 누적 에너지 카운터의 5분 rate는 곧 J/sec = Watts 이므로 "5분 평균 전력" 시계열을 산출한다.
        # instantaneous gpuobs_device_power_usage_watts와 별개로 spike 평균낸 추세를 dashboard에 노출한다. 노드 차원 합산.
        - record: node:gpu_energy_watts_avg:5m
          expr: sum by(node) (rate(gpuobs_device_energy_consumption_joules_total[5m]))

        # node:gpu_pcie_replay:rate5m
        # PCIe 링크 재전송 발생률(errors/sec). 정상 환경에서는 0에 가깝고, 지속적 증가는 라이저/케이블/슬롯 문제 시그널이다.
        # alert rule을 직접 두지 않더라도 dashboard의 health 패널 시각화에 적합.
        - record: node:gpu_pcie_replay:rate5m
          expr: sum by(node) (rate(gpuobs_device_pcie_replay_errors_total[5m]))

        # node:gpu_temperature_headroom_celsius
        # 노드 x threshold 단위 thermal headroom — GPU별 (threshold − 현재 온도) 를 산출한 뒤 노드 내 최솟값(min)을 채택해
        # "노드의 가장 위험한 GPU" 기준으로 (node, threshold) 당 1 시리즈로 요약한다. 양수면 안전 마진, 0 이하면 throttle/shutdown 임박.
        # 두 원본 메트릭의 라벨 차이는 LHS의 threshold 라벨 하나뿐이라 ignoring(threshold) group_left() 로 many-to-one 매칭한 뒤 노드로 rollup한다.
        - record: node:gpu_temperature_headroom_celsius
          expr: min by(node, threshold) (gpuobs_device_temperature_threshold_celsius - ignoring(threshold) group_left() gpuobs_device_temperature_celsius)

    # netobs-gpuobs.gpu-idle.recording 그룹은 GPU 유휴 정의와 원인 후보 score 6건을 산출한다.
    # 운영자가 GPU 유휴 알림을 받았을 때 단일 진단 가이드 (docs/correlation/diagnosis-gpu-idle.md) 로
    # 원인을 짚을 수 있게 cause score를 모두 0-1 정규화 해 모은다. score 정규화 분모는 두 tunable
    # 메트릭 (netobs_node_nic_capacity_bytes_per_sec, gpuobs_node_cuda_launch_baseline_per_sec) 으로
    # 클러스터별 override 가능하다. PCIe 이론치는 device 의 link generation/width 메트릭에서
    # 동적 산출되므로 GPU 모델 혼합 클러스터에서도 정확하다.
    - name: netobs-gpuobs.gpu-idle.recording
      interval: 30s
      rules:
        # node:gpu_idle:5m
        # 5분 윈도우에서 GPU 사용률이 20% 미만이었던 시간 비율 (0-1). 노드 내 GPU별 비율의 평균을
        # 노드 단위로 rollup한다. avg_over_time + bool 비교 + subquery 패턴이라 evaluation 비용이
        # 다른 rule보다 높으니 group interval 변경 시 주의.
        - record: node:gpu_idle:5m
          expr: |
            avg by(node) (
              avg_over_time((gpuobs_device_utilization_percent < bool 20)[5m:30s])
            )

        # node:gpu_pcie_theoretical_bytes_per_sec
        # GPU device 별 PCIe 이론 throughput (bytes/sec). gpuobs_device_pcie_link_generation_current 와
        # gpuobs_device_pcie_link_width_current 에 따라 Gen1-5 × x8/x16 10개 조합을 분기로 매핑한다.
        # Gen1/2는 NVIDIA GPU가 idle 시 다운클록되는 link state라 saturation 계산에 반드시 포함되어야
        # false positive (Gen1로 다운클록된 상태에서 작은 PCIe traffic이 분모 0과 만나 +Inf로 saturate)
        # 를 막을 수 있다. x4 이하 또는 매핑 표 외 조합은 saturation rule의 ">0" 필터로 무시된다.
        - record: node:gpu_pcie_theoretical_bytes_per_sec
          expr: |
            (gpuobs_device_pcie_link_generation_current == bool 1) * (gpuobs_device_pcie_link_width_current == bool 8) * 2e9
            + (gpuobs_device_pcie_link_generation_current == bool 1) * (gpuobs_device_pcie_link_width_current == bool 16) * 4e9
            + (gpuobs_device_pcie_link_generation_current == bool 2) * (gpuobs_device_pcie_link_width_current == bool 8) * 4e9
            + (gpuobs_device_pcie_link_generation_current == bool 2) * (gpuobs_device_pcie_link_width_current == bool 16) * 8e9
            + (gpuobs_device_pcie_link_generation_current == bool 3) * (gpuobs_device_pcie_link_width_current == bool 8) * 7.88e9
            + (gpuobs_device_pcie_link_generation_current == bool 3) * (gpuobs_device_pcie_link_width_current == bool 16) * 15.75e9
            + (gpuobs_device_pcie_link_generation_current == bool 4) * (gpuobs_device_pcie_link_width_current == bool 8) * 15.75e9
            + (gpuobs_device_pcie_link_generation_current == bool 4) * (gpuobs_device_pcie_link_width_current == bool 16) * 31.5e9
            + (gpuobs_device_pcie_link_generation_current == bool 5) * (gpuobs_device_pcie_link_width_current == bool 8) * 31.5e9
            + (gpuobs_device_pcie_link_generation_current == bool 5) * (gpuobs_device_pcie_link_width_current == bool 16) * 63e9

        # node:gpu_pcie_saturation_score:5m
        # 노드 GPU 의 PCIe 실 throughput (RX + TX) 대비 이론치 비율 (0-1). 0.7 이상이면 PCIe가 GPU 유휴의
        # 원인일 가능성이 높다. 분모를 ">0"으로 필터해 매핑 표 외 조합 (Gen0 등 비정상 link state) 에서
        # 0 division으로 NaN/+Inf가 생기는 false positive를 차단한다. 그 결과 매핑 불가 노드는 series
        # 자체가 emit되지 않아 alert에서도 자연 제외된다.
        - record: node:gpu_pcie_saturation_score:5m
          expr: |
            clamp_max(
              sum by(node) (gpuobs_device_pcie_rx_bytes_per_second + gpuobs_device_pcie_tx_bytes_per_second)
              / on(node) group_left()
              (sum by(node) (node:gpu_pcie_theoretical_bytes_per_sec) > 0),
              1
            )

        # pod:network_throughput_score:5m
        # Pod 단위 네트워크 throughput 대비 노드 NIC 이론 capacity 비율 (0-1). egress는 NIC layer,
        # ingress는 L4 layer (NIC ingress는 #47 follow-up) 을 합산해 양방향 traffic을 근사한다.
        # 분모는 netobs-agent가 startup 시 노출하는 NIC capacity tunable이다.
        - record: pod:network_throughput_score:5m
          expr: |
            clamp_max(
              (
                sum by(node, src_namespace, src_pod, src_pod_uid) (
                  rate(netobs_pod_bytes_total{direction="egress",layer="nic"}[5m])
                )
                +
                sum by(node, src_namespace, src_pod, src_pod_uid) (
                  rate(netobs_pod_bytes_total{direction="ingress",layer="l4"}[5m])
                )
              )
              / on(node) group_left()
              netobs_node_nic_capacity_bytes_per_sec,
              1
            )

        # pod:network_retrans_score:5m
        # Pod 단위 TCP 재전송 비율 (retrans events/sec / total packets/sec) 을 saturate. 0.05 이상이면
        # 네트워크 품질 저하 신호다. 분자는 netobs_pod_stage_events_labeled_total{stage="retrans"}로
        # pod 단위 재전송을, 분모는 netobs_pod_packets_total로 pod 단위 총 패킷을 산출한다.
        - record: pod:network_retrans_score:5m
          expr: |
            clamp_max(
              sum by(node, src_namespace, src_pod, src_pod_uid) (
                rate(netobs_pod_stage_events_labeled_total{stage="retrans"}[5m])
              )
              /
              sum by(node, src_namespace, src_pod, src_pod_uid) (
                rate(netobs_pod_packets_total[5m])
              ),
              1
            )

        # pod:network_pressure_score:5m
        # Pod 단위 네트워크 압박 의 단일 진실원. throughput saturation 과 TCP 재전송 두 신호의 element-
        # wise max 다. 두 신호가 서로 다른 스케일 (throughput 은 NIC capacity 비율, retrans 는 재전송
        # 비율) 이라 합산은 의미가 흐려져 worst-of 를 채택한다. node / cluster / victim 차원의 network_
        # pressure 가 모두 본 score 를 rollup 해 "network pressure" 의 의미를 단일화한다 (#154).
        #
        # PromQL 의 OR 는 동일 라벨 셋 충돌 시 LHS 만 남겨 element-wise max 가 되지 않으므로, 두 신호가
        # 모두 있는 Pod 는 (a >= bool b) 곱셈으로 max 를 취하고, 한쪽만 있는 Pod 는 뒤의 or 두 항으로
        # 보존한다. 둘 다 [0, 1] clamp 된 score 라 곱셈 결과도 [0, 1] 을 유지한다.
        - record: pod:network_pressure_score:5m
          expr: |
            (
              (pod:network_throughput_score:5m >= bool pod:network_retrans_score:5m)
                * pod:network_throughput_score:5m
              + (pod:network_retrans_score:5m > bool pod:network_throughput_score:5m)
                * pod:network_retrans_score:5m
            )
            or pod:network_throughput_score:5m
            or pod:network_retrans_score:5m

        # pod:cpu_throttle_score:5m
        # cAdvisor의 CPU CFS throttled / total periods 비율 (0-1). 0.3 이상이면 컨테이너 CPU limit
        # 으로 인한 throttle이 빈번하다. label_replace로 cAdvisor의 namespace/pod 라벨을 netobs/gpuobs
        # 메트릭과 join 가능하도록 src_namespace/src_pod로 alias한다 (원본 라벨도 함께 유지).
        - record: pod:cpu_throttle_score:5m
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  sum by(node, namespace, pod) (rate(container_cpu_cfs_throttled_periods_total[5m]))
                  / on(node, namespace, pod)
                  sum by(node, namespace, pod) (rate(container_cpu_cfs_periods_total[5m])),
                  "src_namespace", "$1", "namespace", "(.+)"
                ),
                "src_pod", "$1", "pod", "(.+)"
              ),
              1
            )

        # pod:memory_pressure_score:5m
        # 컨테이너 메모리 working_set 대비 resource limit 비율 (0-1). 0.9 이상이면 OOM 임박 신호.
        # kube-state-metrics의 kube_pod_container_resource_limits는 node 라벨이 없어 (namespace, pod)
        # 로 join하고, cAdvisor 의 node 라벨은 working_set 측에서 보존된다.
        - record: pod:memory_pressure_score:5m
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  sum by(node, namespace, pod) (container_memory_working_set_bytes)
                  / on(namespace, pod) group_left()
                  sum by(namespace, pod) (kube_pod_container_resource_limits{resource="memory"}),
                  "src_namespace", "$1", "namespace", "(.+)"
                ),
                "src_pod", "$1", "pod", "(.+)"
              ),
              1
            )

        # pod:memory_rss_pressure_score:5m (#194)
        # 컨테이너 anonymous(RSS) 메모리 대비 limit 비율 (0-1). RSS 는 page cache 와 달리 reclaim 이
        # 안 되는 non-reclaimable 메모리라 OOM 을 직접 유발한다. working_set 대비 RSS 가 지배적이면
        # 진짜 메모리 압박이다. cadvisor container_memory_rss 는 pod-level (container 라벨 없음) 이라
        # sum by(node, namespace, pod) 로 집계 후 (namespace, pod) 로 limit 과 join 한다.
        - record: pod:memory_rss_pressure_score:5m
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  sum by(node, namespace, pod) (container_memory_rss)
                  / on(namespace, pod) group_left()
                  sum by(namespace, pod) (kube_pod_container_resource_limits{resource="memory"}),
                  "src_namespace", "$1", "namespace", "(.+)"
                ),
                "src_pod", "$1", "pod", "(.+)"
              ),
              1
            )

        # pod:memory_cache_pressure_score:5m (#194)
        # 컨테이너 page cache 메모리 대비 limit 비율 (0-1). cache 는 kernel 이 reclaim 가능한 메모리라
        # 그 자체로 OOM 압박은 아니지만, working_set 이 cache 로 채워졌다면 RSS 압박과 구분해 "실제
        # 압박이 아님" 을 판정하는 데 쓴다. rss 룰과 동일하게 pod-level 집계 후 limit 과 join 한다.
        - record: pod:memory_cache_pressure_score:5m
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  sum by(node, namespace, pod) (container_memory_cache)
                  / on(namespace, pod) group_left()
                  sum by(namespace, pod) (kube_pod_container_resource_limits{resource="memory"}),
                  "src_namespace", "$1", "namespace", "(.+)"
                ),
                "src_pod", "$1", "pod", "(.+)"
              ),
              1
            )

        # pod:host_compute_stall_score:5m
        # host측 CUDA kernel launch rate 부족과 GPU device memory pressure 둘 중 큰 쪽을 채택한다.
        # 둘 다 GPU가 호스트 측 또는 device 측 자원 한계로 추가 kernel을 실행하지 못하는 상태를
        # 가리키므로 cross-validation 가치가 있다. 단순 max 라 두 신호가 동시에 높을 때 의미가 약화
        # 되는 한계는 docs에 명시한다.
        - record: pod:host_compute_stall_score:5m
          expr: |
            max by(node, src_namespace, src_pod, src_pod_uid) (
              clamp_min(
                clamp_max(
                  1 - (
                    sum by(node, src_namespace, src_pod, src_pod_uid) (rate(gpuobs_cuda_kernel_launches_total[5m]))
                    / on(node) group_left()
                    gpuobs_node_cuda_launch_baseline_per_sec
                  ),
                  1
                ),
                0
              )
              or
              pod:gpu_memory_utilization_ratio:5m
            )

        # #84 cross-node interference layer 의 node 단위 pressure score 5 종. 본 그룹의 pod-level
        # cause score 4 종 (cpu_throttle / memory_pressure / network_throughput / host_compute_stall) 을
        # node 차원으로 max rollup 한다. correlation-exporter 의 cross-node correlator 가 본 시계열을
        # victim_node / suspect_node 후보로 입력 받아 (victim_node != suspect_node) 페어의 Pearson 상관
        # 계수를 산정한다. 통합 node:pressure_score:5m 은 4 dimension max 의 평균으로 [0, 1] 단일
        # 점수를 노출해 운영자가 노드 단위 압박을 단일 시계열로 본다.
        - record: node:cpu_pressure_score:5m
          expr: max by(node) (pod:cpu_throttle_score:5m)

        # node:memory_pressure_score:5m (#274 재정의)
        # 기존 max(pod:memory_pressure_score) 는 pod 의 working_set 대비 limit 비율을 노드 지표로
        # 승격해, limit 을 타이트하게 잡은 관측 인프라 pod (dcgm-exporter 등) 가 노드를 영구 degraded
        # 로 만들었다 (실측: pod 지표 0.97 vs 노드 실제 사용률 19.8%). 노드의 메모리 압박은
        # node_exporter 실측 (1 - MemAvailable/MemTotal) 로 재정의한다. node_exporter 메트릭은 node
        # 라벨이 없어 node_uname_info 의 nodename 을 instance 조인으로 부여한다 (value 1 이라 곱해도
        # 값 불변). pod 단위 score (pod:memory_pressure_score) 는 그 pod 의 OOM 근접도로 의미가
        # 유효해 유지하며, 문제였던 것은 pod 지표의 노드 승격이다.
        # node_uname_info 는 max by(instance, nodename) 로 사전 집계한다. node-exporter 를 여러
        # scrape job 이 수집하는 구성에서는 job 라벨만 다른 중복 시리즈가 생겨 group_left 조인이
        # many-to-many 로 평가 실패 (시리즈 전멸) 할 수 있는데, 이는 본 저장소 밖의 monitoring 스택
        # 설정에 좌우되는 경계라 사전 집계로 방어한다.
        - record: node:memory_pressure_score:5m
          expr: |
            max by(node) (
              label_replace(
                (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                * on(instance) group_left(nodename) max by(instance, nodename) (node_uname_info),
                "node", "$1", "nodename", "(.+)"
              )
            )

        # network 압박은 pod:network_pressure_score:5m (throughput 과 retrans 의 element-wise max) 을
        # node 단위로 max rollup 한다. 기존 max(throughput or retrans) 는 동일 라벨 Pod 에서 OR 충돌로
        # retrans 가 누락될 수 있어, canonical pod score 로 통일해 정확성과 의미 일관성을 확보한다 (#154).
        - record: node:network_pressure_score:5m
          expr: max by(node) (pod:network_pressure_score:5m)

        # gpu 압박은 host_compute_stall_score 로 두어 host 측 launch 부족 또는 device memory 압박이
        # 노드 의 GPU 작업 진행을 막는 신호를 노드 단위로 노출한다.
        - record: node:gpu_pressure_score:5m
          expr: max by(node) (pod:host_compute_stall_score:5m)

        # 통합 pressure score 는 4 dimension 의 평균으로 정규화한다. 합 / 4 가 [0, 1] 범위를 자연스럽게
        # 유지해 운영자가 dashboard 또는 수동 query에서 노드 단위 압박을 단일 시계열로 확인할 수 있게
        # 한다. cross-node correlator는 본 통합 score를 입력으로 받지 않고 4 dimension score를 직접
        # 사용해 dimension 라벨 분포까지 노출한다. 본 통합 시리즈는 노출 (보조 신호) 만 담당한다.
        # 결측 dimension은 node 라벨이 없는 vector(0) 대신 cpu_pressure 기준 시계열에 0을 곱한 형태로
        # fallback해 vector 연산의 라벨 매칭 실패 (node 라벨이 한쪽에만 있어 결과가 empty가 되는 케이스)
        # 를 회피한다. node:cpu_pressure_score:5m이 결측인 노드는 본 통합 score 자체가 emit되지 않으나
        # 본 시리즈의 의도가 "어떤 dimension이라도 활성인 노드의 통합 점수" 이므로 cpu 자체가 비활성인
        # 노드는 분석 대상에서 자연 제외된다.
        - record: node:pressure_score:5m
          expr: |
            (
              node:cpu_pressure_score:5m
              + (node:memory_pressure_score:5m or node:cpu_pressure_score:5m * 0)
              + (node:network_pressure_score:5m or node:cpu_pressure_score:5m * 0)
              + (node:gpu_pressure_score:5m or node:cpu_pressure_score:5m * 0)
            ) / 4

        # cross-node correlator 의 victim 후보 latency 다. histogram_quantile 의 le 합산을 node 차원
        # 으로 둬 노드 단위 p99 를 산출한다. 노드 의 모든 pod p99 가 conflate 되어 latency-sensitive
        # workload 식별 력은 흐릿하나 본 시리즈의 raw signal 이며 follow-up 에서 workload-label filter
        # 도입 으로 보강 가능하다.
        - record: node:netobs_pod_stage_latency_p99:5m
          expr: |
            histogram_quantile(0.99,
              sum by(node, le) (
                rate(netobs_pod_stage_latency_labeled_seconds_bucket[5m])
              )
            )

        # #148 service-impact correlator 의 victim 후보 latency 다. 위 node 단위 rule 의 conflate 대신
        # netobs 의 src_workload (resolver 의 owner 해석 결과) 라벨로 집계해 workload (K8s Service 근사)
        # 단위 p99 를 산출한다. 위 node rule 주석이 예고한 workload-label 보강을 실현하며 correlation-
        # exporter 의 service-impact layer 가 본 시계열을 victim 으로 입력받아 suspect node 압박과의
        # Pearson 상관을 산정한다. 입력은 src_workload 라벨을 보유한 workload-level 메트릭 netobs_stage_
        # latency_labeled_seconds 이며 src_pod 를 쓰는 netobs_pod_stage_latency_labeled_seconds 와 구분된다.
        - record: workload:netobs_stage_latency_p99:5m
          expr: |
            histogram_quantile(0.99,
              sum by(src_namespace, src_workload, le) (
                rate(netobs_stage_latency_labeled_seconds_bucket[5m])
              )
            )

    # netobs-gpuobs.dominant-cause.recording 그룹은 #66 의 GPU 유휴 dominant cause 가중치 산정에
    # 사용하는 recording rule 을 모은다. 본 그룹의 첫 5 종은 node 와 Pod 차원으로 흩어진 cause score
    # 5 종을 cluster 단위 단일 값으로 max rollup 해 dominant cause weight 산정 단계에서 동일한 차원
    # 으로 비교 가능하게 한다. dominant cause 가 cluster 평균이 아니라 worst-case 신호를 따라가도록
    # max 를 채택한다. network_pressure cause 의 base score 는 canonical pod:network_pressure_score:5m
    # (throughput saturation 과 TCP 재전송 의 element-wise max) 의 rollup 이라, 재전송이 GPU 유휴를
    # 유발하는 경우도 network_pressure dominant cause 로 직접 분류된다 (#154). 두 신호의 스케일 차이는
    # 합산이 아닌 max 로 흡수해 cause 간 비교 의미를 유지한다. retrans 를 별도 cause slot 으로 분리하지
    # 않는 이유는 비목표 (재전송 원인 세부 분류) 와 정합하며, 단일 cause 유지로 gpu_idle_cause_sum:5m
    # 분모와 tie-breaker offset 이 변경 없이 자동 정합되기 때문이다.
    - name: netobs-gpuobs.dominant-cause.recording
      interval: 30s
      rules:
        # cluster:gpu_pcie_saturation_score:5m
        # 노드 단위 PCIe saturation score 의 cluster max. worst-case 노드의 PCIe 압박이 본 시계열 값.
        - record: cluster:gpu_pcie_saturation_score:5m
          expr: max(node:gpu_pcie_saturation_score:5m)

        # cluster:pod_cpu_throttle_score:5m
        # Pod 단위 CPU CFS throttle 비율의 cluster max. worst-case Pod 의 throttle 신호.
        - record: cluster:pod_cpu_throttle_score:5m
          expr: max(pod:cpu_throttle_score:5m)

        # cluster:pod_memory_pressure_score:5m
        # Pod 단위 메모리 working_set / limit 비율의 cluster max. worst-case Pod 의 OOM 임박도.
        - record: cluster:pod_memory_pressure_score:5m
          expr: max(pod:memory_pressure_score:5m)

        # cluster:pod_network_pressure_score:5m
        # Pod 단위 network pressure (throughput saturation 과 TCP 재전송 의 max) 의 cluster max. canonical
        # pod:network_pressure_score:5m 을 rollup 해 재전송이 GPU 유휴를 유발할 때도 network_pressure
        # cause 로 직접 분류되게 한다 (#154). retrans 가 throughput 보다 강한 worst-case Pod 가 본 값을
        # 결정한다. or vector(0) 로 network 트래픽이 없는 환경에서도 합 산출이 가능하다.
        - record: cluster:pod_network_pressure_score:5m
          expr: max(pod:network_pressure_score:5m) or vector(0)

        # cluster:pod_host_compute_stall_score:5m
        # Pod 단위 host 측 CUDA launch 부족 또는 GPU memory 포화 score 의 cluster max.
        - record: cluster:pod_host_compute_stall_score:5m
          expr: max(pod:host_compute_stall_score:5m)

        # gpu_idle_cause_sum:5m
        # 5 cause base score 의 합. cause weight 정규화의 분모로 쓰인다. base 시리즈가 비어 있는
        # cause 는 `or vector(0)` 로 0 으로 대체해 합이 NaN 으로 빠지지 않게 한다. dev cluster 처럼
        # PCIe / network 트래픽이 거의 없는 환경에서도 합 산출이 가능하게 한다.
        # node:dcgm_pcie_replay_score:5m (#133, #155)
        # 노드 단위 DCGM PCIe replay score. DCGM_FI_DEV_PCIE_REPLAY_COUNTER (PCIe link error 로 인한
        # retry 누적 카운터) 의 5 분 rate 를 node 단위 max 후 정규화 임계 (100 replays/sec) 로 나눠
        # 0-1 로 만든다. clamp_max 로 burst 시 1.0 상한 둔다. GPUIdleWithDCGMPCIeReplay alert 가
        # on(node) join 으로 본 score 를 사용해 어떤 노드의 PCIe link error 인지 식별 가능하게 한다.
        # dcgm-exporter 가 활성인 데이터센터 GPU 환경에서만 base 가 emit 되고, dev (DCGM 부재) 에서는
        # or on(node)(node:gpu_idle:5m * 0) fallback 이 GPU 노드별 0 을 채워 alert 가 발화하지 않는다.
        - record: node:dcgm_pcie_replay_score:5m
          expr: |
            clamp_max(
              max by(node) (rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER[5m])) / 100,
              1
            )
            or on(node) (node:gpu_idle:5m * 0)

        # cluster:dcgm_pcie_replay_score:5m (#133)
        # node 단위 score 의 cluster max. dominant cause 엔진이 worst-case 노드의 PCIe replay 를 따른다.
        - record: cluster:dcgm_pcie_replay_score:5m
          expr: max(node:dcgm_pcie_replay_score:5m) or vector(0)

        # node:nccl_collective_stall_score:5m (#134, #155)
        # 노드 단위 NCCL collective stall score. gpuobs 가 libnccl.so collective 심볼 uprobe 로 수집한
        # gpuobs_nccl_collective_duration_seconds histogram 의 _sum rate 를 node 단위로 합산 후 1.0 상한
        # 으로 clamp 한다. _sum 의 5 분 rate 는 초당 누적 collective wall-clock (collective-seconds/sec)
        # 이며 한 rank 가 시간의 100% 를 collective 대기에 쓰면 1.0 에 근접한다. GPUIdleWithNCCLCollective
        # Stall alert 가 on(node) join 으로 본 score 를 사용해 어떤 노드의 collective stall 인지 식별
        # 가능하게 한다. NCCL profiler 가 활성 (build tag nccl 이미지 + GPUOBS_NCCL_ENABLED=true +
        # 데이터센터 GPU) 인 노드에서만 base 가 emit 되고, dev (noop profiler) 에서는 or on(node)
        # (node:gpu_idle:5m * 0) fallback 이 GPU 노드별 0 을 채워 alert 가 발화하지 않는다.
        - record: node:nccl_collective_stall_score:5m
          expr: |
            clamp_max(
              sum by(node) (rate(gpuobs_nccl_collective_duration_seconds_sum[5m])),
              1
            )
            or on(node) (node:gpu_idle:5m * 0)

        # cluster:nccl_collective_stall_score:5m (#134)
        # node 단위 score 의 cluster max. dominant cause 엔진이 worst-case 노드의 collective stall 을 따른다.
        - record: cluster:nccl_collective_stall_score:5m
          expr: max(node:nccl_collective_stall_score:5m) or vector(0)

        # node:gpu_thermal_score:5m (#190)
        # 노드 단위 thermal 유휴 원인 score. gpuobs_thermal_correlation_score:5m 는 GPU 별 temperature
        # 와 hw_thermal_slowdown throttle 의 Pearson |corr| 로, 값이 클수록 온도 상승이 thermal throttle
        # 로 이어져 GPU 성능이 제약됨을 뜻한다. GPU 별 score 를 node max 로 rollup 한다. thermal
        # correlation 의 분모 (stddev) 가 0 인 (온도·throttle 변화가 없는) 노드에서는 base 가 비어
        # or on(node) (node:gpu_idle:5m * 0) fallback 이 GPU 노드별 0 을 채워 weight 가 0 으로 유지된다.
        - record: node:gpu_thermal_score:5m
          expr: |
            max by(node) (gpuobs_thermal_correlation_score:5m)
            or on(node) (node:gpu_idle:5m * 0)

        # cluster:gpu_thermal_score:5m (#190)
        # node 단위 score 의 cluster max. dominant cause 엔진이 worst-case 노드의 thermal throttle 을 따른다.
        - record: cluster:gpu_thermal_score:5m
          expr: max(node:gpu_thermal_score:5m) or vector(0)

        # pod:cgroup_contention_score:5m (#198, #224)
        # Pod 단위 cgroup PSI 경합 score (0-1). gpuobs 가 cgroup v2 cpu.pressure / memory.pressure /
        # io.pressure 의 some avg10 을 수집한 gpuobs_pod_*_pressure_ratio 3종의 5 분 max 를 (node,
        # src_namespace, src_pod) 단위로 취해 CPU / memory / 디스크 I/O stall 중 가장 심한 쪽을 pod 경합
        # 강도로 삼는다. cAdvisor 의 throttle-ratio / working-set-ratio 휴리스틱과 달리 실제 stall 시간을
        # 직접 반영한다. gpuobs 메트릭은 이미 src_namespace / src_pod 라벨을 달고 나와 label_replace 가
        # 불필요하다.
        - record: pod:cgroup_contention_score:5m
          expr: |
            clamp_max(
              max by(node, src_namespace, src_pod) (
                label_replace(max_over_time(gpuobs_pod_cpu_pressure_ratio[5m]), "psi_kind", "cpu", "", "")
                or
                label_replace(max_over_time(gpuobs_pod_memory_pressure_ratio[5m]), "psi_kind", "mem", "", "")
                or
                label_replace(max_over_time(gpuobs_pod_io_pressure_ratio[5m]), "psi_kind", "io", "", "")
              ),
              1
            )

        # cluster:pod_cgroup_contention_score:5m (#198)
        # Pod 단위 cgroup 경합 score 의 cluster max. worst-case Pod 의 PSI stall 을 GPU 유휴 cause 로 rollup 한다.
        - record: cluster:pod_cgroup_contention_score:5m
          expr: max(pod:cgroup_contention_score:5m) or vector(0)

        # pod:*_score_rise:5m (#244, fallback 교정 #285)
        # pod 계열 cause score 의 baseline (30m~1h30m 전 평균) 대비 상승분 (0 하한). memory limit 에
        # 상시 근접한 관측 인프라 pod (dcgm-exporter 등) 처럼 GPU 유휴 여부와 무관하게 일정한 신호는
        # baseline 과 현재값이 같아 0 에 수렴하고, GPU 유휴와 함께 나타난 신규 압박만 남는다. baseline
        # 이 없는 신생 시리즈는 `or score` self-baseline fallback 으로 rise = 0 이 되어 90분 이력이
        # 쌓일 때까지 침묵한다. 과거 `or (score * 0)` fallback 은 rise = 현재값이라 재배포마다 새로
        # 뜬 agent pod (상시 working_set/limit 0.66) 가 약 30분씩 alert 를 발화시키고 dominant cause
        # 를 오귀속시켰다 (#285 실측). 신생 pod 의 onset 즉시 감지는 포기하는 트레이드오프이며, 시작
        # 부터 임박한 포화는 rise 축이 아닌 절대값 기반 pod:*_score:5m 과 pressure API 의 몫이다.
        # 압박이 1.5h 이상 지속되면 baseline 이 따라잡아 rise 가 감쇠하는데, 장기 지속 압박도 동일하게
        # 절대값 기반 신호와 victim 단위 rule 이 계속 노출한다.
        - record: pod:cpu_throttle_score_rise:5m
          expr: |
            clamp_min(
              pod:cpu_throttle_score:5m
              - (avg_over_time(pod:cpu_throttle_score:5m[1h] offset 30m) or pod:cpu_throttle_score:5m),
              0
            )

        - record: pod:memory_pressure_score_rise:5m
          expr: |
            clamp_min(
              pod:memory_pressure_score:5m
              - (avg_over_time(pod:memory_pressure_score:5m[1h] offset 30m) or pod:memory_pressure_score:5m),
              0
            )

        - record: pod:network_pressure_score_rise:5m
          expr: |
            clamp_min(
              pod:network_pressure_score:5m
              - (avg_over_time(pod:network_pressure_score:5m[1h] offset 30m) or pod:network_pressure_score:5m),
              0
            )

        # network 서브 신호 2종의 rise. GPUIdleWithNetworkPressure alert 가 throughput (임계 0.7) 과
        # retrans (임계 0.05) 를 스케일이 달라 분리 판정하므로 canonical rise 와 별도로 둔다.
        - record: pod:network_throughput_score_rise:5m
          expr: |
            clamp_min(
              pod:network_throughput_score:5m
              - (avg_over_time(pod:network_throughput_score:5m[1h] offset 30m) or pod:network_throughput_score:5m),
              0
            )

        - record: pod:network_retrans_score_rise:5m
          expr: |
            clamp_min(
              pod:network_retrans_score:5m
              - (avg_over_time(pod:network_retrans_score:5m[1h] offset 30m) or pod:network_retrans_score:5m),
              0
            )

        - record: pod:cgroup_contention_score_rise:5m
          expr: |
            clamp_min(
              pod:cgroup_contention_score:5m
              - (avg_over_time(pod:cgroup_contention_score:5m[1h] offset 30m) or pod:cgroup_contention_score:5m),
              0
            )

        - record: pod:host_compute_stall_score_rise:5m
          expr: |
            clamp_min(
              pod:host_compute_stall_score:5m
              - (avg_over_time(pod:host_compute_stall_score:5m[1h] offset 30m) or pod:host_compute_stall_score:5m),
              0
            )

        # cluster:gpu_idle_*_rise:5m (#244)
        # GPU 유휴 노드의 pod rise max. 기존 cluster:pod_*_score (클러스터 전체 pod max) 가 GPU 와
        # 무관한 노드의 압박까지 dominant cause 로 둔갑시키던 것을, `and on(node)` 조인으로 GPU 유휴
        # 노드의 pod 로 좁힌다. gpu_idle_cause_sum 과 weight 의 pod 계열 5종이 본 시리즈를 소비하고,
        # cluster:pod_*_score 는 운영자용 클러스터 worst-case 뷰로 유지된다.
        - record: cluster:gpu_idle_cpu_throttle_rise:5m
          expr: max(pod:cpu_throttle_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: cluster:gpu_idle_memory_pressure_rise:5m
          expr: max(pod:memory_pressure_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: cluster:gpu_idle_network_pressure_rise:5m
          expr: max(pod:network_pressure_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: cluster:gpu_idle_cgroup_contention_rise:5m
          expr: max(pod:cgroup_contention_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: cluster:gpu_idle_host_compute_stall_rise:5m
          expr: max(pod:host_compute_stall_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: gpu_idle_cause_sum:5m
          expr: |
            (cluster:gpu_pcie_saturation_score:5m or vector(0))
            + (cluster:gpu_idle_cpu_throttle_rise:5m or vector(0))
            + (cluster:gpu_idle_memory_pressure_rise:5m or vector(0))
            + (cluster:gpu_idle_network_pressure_rise:5m or vector(0))
            + (cluster:gpu_idle_host_compute_stall_rise:5m or vector(0))
            + (cluster:dcgm_pcie_replay_score:5m or vector(0))
            + (cluster:nccl_collective_stall_score:5m or vector(0))
            + (cluster:gpu_thermal_score:5m or vector(0))
            + (cluster:gpu_idle_cgroup_contention_rise:5m or vector(0))

        # gpu_idle_cause_weight:5m{cause}
        # cause 의 정규화 가중치 (cause 별 base / cause 합). 분모가 0 인 idle window 는
        # `(gpu_idle_cause_sum:5m > 0.05)` 필터로 시리즈 자체가 emit 되지 않아 NaN 이 라벨 세트에
        # 끼지 않는다. 하한 0.05 는 노이즈 게이트다 (#244). 정규화가 잔여 노이즈 rise (실측 sum
        # 0.01 수준) 를 큰 weight 로 부풀려 무부하에서도 dominant 가 지목되는 것을 막고, 실제
        # onset (rise 0.3 이상) 은 하한을 크게 웃돌아 영향이 없다. cluster 의 어느 노드라도 GPU idle > 0.5 인 상태에서만 emit 되도록 AND 게이팅
        # 을 두어 idle 이 아닌 시간대의 cause weight 잡음이 dashboard 와 alert 의 신호 대 잡음비를
        # 떨어뜨리지 않게 한다. cause 라벨 enum 은 GPUIdleWith* 8 종 alert 와 1:1 매핑된다.
        # #244 부터 pod 계열 5종 (cpu_throttle / memory_pressure / network_pressure /
        # cgroup_contention / host_compute_stall) 의 base 는 클러스터 전체 max 가 아니라 GPU 유휴
        # 노드 스코프의 rise (cluster:gpu_idle_*_rise:5m) 라, GPU 와 무관한 노드의 압박과 상시
        # 포화 신호는 dominant cause 로 둔갑하지 않는다.
        - record: gpu_idle_cause_weight:5m
          labels:
            cause: pcie_saturation
          expr: |
            (
              (cluster:gpu_pcie_saturation_score:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        - record: gpu_idle_cause_weight:5m
          labels:
            cause: cpu_throttle
          expr: |
            (
              (cluster:gpu_idle_cpu_throttle_rise:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        - record: gpu_idle_cause_weight:5m
          labels:
            cause: memory_pressure
          expr: |
            (
              (cluster:gpu_idle_memory_pressure_rise:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        # cause: cgroup_contention (#198)
        # gpuobs 가 수집한 pod cgroup PSI stall (cpu.pressure / memory.pressure) 기반 경합 원인 가중치.
        # cAdvisor 의 CFS throttle / working-set 휴리스틱인 cpu_throttle / memory_pressure cause 와 달리
        # 실제 stall 시간을 반영해 pod 간 공동피해를 직접 드러낸다.
        - record: gpu_idle_cause_weight:5m
          labels:
            cause: cgroup_contention
          expr: |
            (
              (cluster:gpu_idle_cgroup_contention_rise:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        - record: gpu_idle_cause_weight:5m
          labels:
            cause: network_pressure
          expr: |
            (
              (cluster:gpu_idle_network_pressure_rise:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        - record: gpu_idle_cause_weight:5m
          labels:
            cause: host_compute_stall
          expr: |
            (
              (cluster:gpu_idle_host_compute_stall_rise:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        # #123/#133/#134 신규 cause 슬롯 2종. 둘 다 base score가 도입되어 해당 신호가 emit되는
        # 환경에서 weight가 활성된다.
        #
        # nccl_collective_stall은 #134에서 cluster:nccl_collective_stall_score:5m base score가
        # 도입되어 gpuobs가 libnccl.so collective uprobe로 gpuobs_nccl_collective_duration_seconds를
        # emit하는 환경 (build tag nccl 이미지 + GPUOBS_NCCL_ENABLED=true + 데이터센터 GPU) 에서
        # 활성된다. dev cluster의 RTX 3090 (noop profiler) 에서는 base 메트릭 부재로 or vector(0)
        # fallback이 0을 돌려줘 weight가 0으로 유지된다. NCCL collective operation (allreduce,
        # broadcast 등) 의 wait 신호로 기존 host_compute_stall (kernel launch rate 저하) 와 의미
        # 분리. allreduce가 rank 간 sync 대기로 GPU가 유휴 상태인 케이스를 구분한다.
        #
        # dcgm_pcie_replay는 #133에서 cluster:dcgm_pcie_replay_score:5m base score가 도입되어
        # dcgm-exporter가 DCGM_FI_DEV_PCIE_REPLAY_COUNTER를 emit하는 데이터센터 GPU 환경에서
        # 활성된다. dev cluster의 RTX 3090 (DCGM 부재) 에서는 base 메트릭 부재로 or vector(0)
        # fallback이 0을 돌려줘 weight가 0으로 유지된다. DCGM의 PCIe replay count 카운터 기반
        # hardware-level 신호로 기존 pcie_saturation (heuristic 대역폭 점유) 와 의미 분리. PCIe
        # link error로 인한 retry가 GPU의 compute 진입 지연을 직접 일으키는 케이스를 구분한다.
        - record: gpu_idle_cause_weight:5m
          labels:
            cause: nccl_collective_stall
          expr: |
            (
              (cluster:nccl_collective_stall_score:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        - record: gpu_idle_cause_weight:5m
          labels:
            cause: dcgm_pcie_replay
          expr: |
            (
              (cluster:dcgm_pcie_replay_score:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        # thermal 은 #190 에서 추가된 8 번째 cause 다. cluster:gpu_thermal_score:5m base 가 도입되어
        # temperature 와 hw_thermal_slowdown throttle 이 함께 움직이는 노드에서 weight 가 활성된다.
        # 온도·throttle 변화가 없는 dev 등에서는 base 가 0 이라 weight 가 0 으로 유지된다. 기존
        # host_compute_stall (kernel launch 부족) 이나 pcie_saturation (대역폭 점유) 와 의미 분리로,
        # 발열로 인한 clock 강하가 GPU 활용을 떨어뜨리는 케이스를 구분한다.
        - record: gpu_idle_cause_weight:5m
          labels:
            cause: thermal
          expr: |
            (
              (cluster:gpu_thermal_score:5m or vector(0))
              / (gpu_idle_cause_sum:5m > 0.05)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        # cluster:gpu_idle_dominant_cause:5m
        # 9 cause weight 중 최대값을 가진 cause 1 종만 단일 시리즈로 노출한다. 정확한 동률 케이스에
        # 서 cause enum 사전순 가장 앞 라벨이 채택되도록 1e-6 단위의 deterministic offset 을
        # cause 별로 가산해 tie-breaker 로 둔다. offset 은 사전순 (cgroup_contention, cpu_throttle,
        # dcgm_pcie_replay, host_compute_stall, memory_pressure, nccl_collective_stall,
        # network_pressure, pcie_saturation, thermal) 으로 9e-6 부터 1e-6 까지 부여한다. offset 단위는 어떤 실 weight
        # 값에도 미치지 못해 일반 케이스의 정렬을 바꾸지 않는다. weight 시리즈 자체가 idle 게이팅으로
        # emit 되지 않는 시간대는 본 record 도 자연 emit 되지 않는다.
        - record: cluster:gpu_idle_dominant_cause:5m
          expr: |
            topk(1,
              gpu_idle_cause_weight:5m
              + on(cause) (
                label_replace(vector(9e-6), "cause", "cgroup_contention", "", "")
                or label_replace(vector(8e-6), "cause", "cpu_throttle", "", "")
                or label_replace(vector(7e-6), "cause", "dcgm_pcie_replay", "", "")
                or label_replace(vector(6e-6), "cause", "host_compute_stall", "", "")
                or label_replace(vector(5e-6), "cause", "memory_pressure", "", "")
                or label_replace(vector(4e-6), "cause", "nccl_collective_stall", "", "")
                or label_replace(vector(3e-6), "cause", "network_pressure", "", "")
                or label_replace(vector(2e-6), "cause", "pcie_saturation", "", "")
                or label_replace(vector(1e-6), "cause", "thermal", "", "")
              )
            )

        # gpu_idle_dominant_cause_indicator:5m{cause}
        # GPUIdleDominantCauseSwitch alert 가 사용하는 cause 별 0/1 indicator 다. dominant cause 인
        # cause 는 1, idle 게이팅이 트리거된 상태에서 dominant 가 아닌 cause 는 0 으로 emit 되어
        # changes() 가 1 과 0 사이 전이를 안정적으로 카운트할 수 있다. label change 자체를 추적하는
        # Prometheus 표현식이 직접 지원되지 않아 본 indirect indicator 로 대체한다. dominant cause
        # 1 종 시리즈에 * 0 + 1 로 라벨 보존한 1 을 만들고 or 로 나머지 cause weight 5 종에 0 을 fill
        # 한다 (or 는 LHS 라벨 셋에 없는 RHS series 만 채우므로 dominant cause 는 1, 나머지 4 cause
        # 는 0 으로 emit). idle 게이팅이 꺼진 시간대는 양쪽 시리즈 모두 없어 본 indicator 도 자연
        # emit 되지 않는다.
        - record: gpu_idle_dominant_cause_indicator:5m
          expr: |
            (cluster:gpu_idle_dominant_cause:5m * 0 + 1)
            or (gpu_idle_cause_weight:5m * 0)

        # node:gpu_idle_cause_score:5m{node,cause} (#256)
        # 노드 단위 GPU idle 원인 귀속 base score 9 종. cluster 단위 gpu_idle_cause_weight:5m 와 pod
        # 단위 pod:gpu_idle_cause_score:5m 사이의 노드 scope 계층으로, 노드 하나의 GPU 가 왜 노는지를
        # 원인별로 설명한다. cause 정의와 정규화 규약은 cluster rule 과 동일해 세 scope 의 cause 해석이
        # 단일 진실원을 공유한다. 모든 cause 는 node:gpu_idle:5m > 0.5 게이팅으로 유휴 노드에서만
        # 산출되고, node 신호가 없는 원인 (dev 의 dcgm/nccl 등) 은 series 자체가 자연 제외된다.
        #
        # pod 계열 5 종은 pod:*_score_rise:5m (#244 baseline 대비 상승분) 을 node 별 max 로 집계한다.
        # cluster:gpu_idle_*_rise:5m 는 max() 로 node 라벨이 이미 소거돼 by(node) 재집계가 불가하므로
        # 동일 소스인 pod rise 를 직접 집계한다. device 계열 4 종은 node:gpu_*_score:5m 노드 신호를
        # 그대로 쓰되 유휴 게이팅만 덧댄다.
        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: cpu_throttle
          expr: max by(node) (pod:cpu_throttle_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: memory_pressure
          expr: max by(node) (pod:memory_pressure_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: network_pressure
          expr: max by(node) (pod:network_pressure_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: cgroup_contention
          expr: max by(node) (pod:cgroup_contention_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: host_compute_stall
          expr: max by(node) (pod:host_compute_stall_score_rise:5m and on(node) (node:gpu_idle:5m > 0.5))

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: pcie_saturation
          expr: node:gpu_pcie_saturation_score:5m and on(node) (node:gpu_idle:5m > 0.5)

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: dcgm_pcie_replay
          expr: node:dcgm_pcie_replay_score:5m and on(node) (node:gpu_idle:5m > 0.5)

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: nccl_collective_stall
          expr: node:nccl_collective_stall_score:5m and on(node) (node:gpu_idle:5m > 0.5)

        - record: node:gpu_idle_cause_score:5m
          labels:
            cause: thermal
          expr: node:gpu_thermal_score:5m and on(node) (node:gpu_idle:5m > 0.5)

        # node:gpu_idle_cause_sum:5m{node}
        # 노드별 9 cause base 의 합 (정규화 분모). 존재하는 cause 만 합산되고 pod:gpu_idle_cause_sum
        # 과 동일하게 vector(0) fallback 을 두지 않는다 (sum by(node) 의 라벨 매칭에 무라벨 항이 섞이지
        # 않게 하려는 것).
        - record: node:gpu_idle_cause_sum:5m
          expr: sum by(node) (node:gpu_idle_cause_score:5m)

        # node:gpu_idle_cause_weight:5m{node,cause}
        # 노드별 정규화 가중치 (cause score / 노드 cause 합). cluster weight 와 동일하게 분모에 노이즈
        # 하한 (> 0.05) 을 둬 무부하 잔여 노이즈가 dominant 로 부풀지 않게 하고, 분모 0 인 노드는 시리즈
        # 자체가 emit 되지 않아 NaN 잡음을 차단한다. on(node) group_left() 로 cause 라벨을 보존한다.
        - record: node:gpu_idle_cause_weight:5m
          expr: |
            node:gpu_idle_cause_score:5m
            / on(node) group_left()
            (node:gpu_idle_cause_sum:5m > 0.05)

        # node:gpu_idle_dominant_cause:5m{node,cause}
        # 노드별 dominant cause 단일 시리즈. cluster:gpu_idle_dominant_cause:5m 와 동일한 tie-breaker
        # (cause enum 사전순 epsilon) 를 노드 차원으로 적용해 동률 시 결정성을 확보한다.
        - record: node:gpu_idle_dominant_cause:5m
          expr: |
            topk by(node) (1,
              node:gpu_idle_cause_weight:5m
              + on(cause) group_left() (
                label_replace(vector(9e-6), "cause", "cgroup_contention", "", "")
                or label_replace(vector(8e-6), "cause", "cpu_throttle", "", "")
                or label_replace(vector(7e-6), "cause", "dcgm_pcie_replay", "", "")
                or label_replace(vector(6e-6), "cause", "host_compute_stall", "", "")
                or label_replace(vector(5e-6), "cause", "memory_pressure", "", "")
                or label_replace(vector(4e-6), "cause", "nccl_collective_stall", "", "")
                or label_replace(vector(3e-6), "cause", "network_pressure", "", "")
                or label_replace(vector(2e-6), "cause", "pcie_saturation", "", "")
                or label_replace(vector(1e-6), "cause", "thermal", "", "")
              )
            )

        # pod:gpu_idle_cause_score:5m{victim_namespace,victim_pod,cause}
        # #101 victim 단위 cause weight 산정 의 입력 helper. 기존 cluster 단위 cause score 5 종을
        # victim Pod 라벨 (victim_namespace 와 victim_pod) 로 정합 한다. 4 cause (cpu_throttle 와
        # memory_pressure 와 host_compute_stall 와 network_pressure) 는 이미 pod 단위 emit 중인 base
        # score 를 label_replace 로 src_namespace → victim_namespace, src_pod → victim_pod 로 alias
        # 한 뒤 (victim_namespace, victim_pod) 로 sum 해 잔여 라벨을 정리 한다. pcie_saturation 은
        # node 단위 단일 시리즈 (node:gpu_pcie_saturation_score:5m) 라 kube_pod_info 의 (node,
        # namespace, pod) 매핑 으로 GPU 노드 의 모든 Pod 에 PCIe score 를 broadcast 한다. PCIe 압박
        # 의 Pod 단위 attribution 은 불가능 하므로 노드 전체 Pod 에 동일 score 를 부여 한 뒤 dashboard
        # 와 alert 에서 운영자 가 victim 의 dimension 라벨 과 함께 해석 한다. dev cluster 에서 CUDA
        # workload 가 없는 경우 host_compute_stall base 시리즈 가 비어 자연 skip 되어 본 helper 도
        # 해당 cause 시리즈 가 emit 되지 않는다.
        - record: pod:gpu_idle_cause_score:5m
          labels:
            cause: pcie_saturation
          expr: |
            sum by(node, victim_namespace, victim_pod) (
              node:gpu_pcie_saturation_score:5m
              * on(node) group_right()
              (
                label_replace(label_replace(
                  sum by(node, namespace, pod) (kube_pod_info),
                  "victim_namespace", "$1", "namespace", "(.+)"),
                  "victim_pod", "$1", "pod", "(.+)")
                * 0 + 1
              )
            )

        - record: pod:gpu_idle_cause_score:5m
          labels:
            cause: cpu_throttle
          expr: |
            sum by(node, victim_namespace, victim_pod) (
              label_replace(label_replace(
                pod:cpu_throttle_score:5m,
                "victim_namespace", "$1", "src_namespace", "(.+)"),
                "victim_pod", "$1", "src_pod", "(.+)")
            )

        - record: pod:gpu_idle_cause_score:5m
          labels:
            cause: memory_pressure
          expr: |
            sum by(node, victim_namespace, victim_pod) (
              label_replace(label_replace(
                pod:memory_pressure_score:5m,
                "victim_namespace", "$1", "src_namespace", "(.+)"),
                "victim_pod", "$1", "src_pod", "(.+)")
            )

        - record: pod:gpu_idle_cause_score:5m
          labels:
            cause: network_pressure
          expr: |
            sum by(node, victim_namespace, victim_pod) (
              label_replace(label_replace(
                pod:network_pressure_score:5m,
                "victim_namespace", "$1", "src_namespace", "(.+)"),
                "victim_pod", "$1", "src_pod", "(.+)")
            )

        - record: pod:gpu_idle_cause_score:5m
          labels:
            cause: host_compute_stall
          expr: |
            sum by(node, victim_namespace, victim_pod) (
              label_replace(label_replace(
                pod:host_compute_stall_score:5m,
                "victim_namespace", "$1", "src_namespace", "(.+)"),
                "victim_pod", "$1", "src_pod", "(.+)")
            )

        # cause: cgroup_contention (#198) victim 단위. pod:cgroup_contention_score 는 이미 src_namespace /
        # src_pod 라벨 이라 cpu_throttle / memory_pressure victim 룰 과 동일 하게 victim_* 로 alias 한다.
        - record: pod:gpu_idle_cause_score:5m
          labels:
            cause: cgroup_contention
          expr: |
            sum by(node, victim_namespace, victim_pod) (
              label_replace(label_replace(
                pod:cgroup_contention_score:5m,
                "victim_namespace", "$1", "src_namespace", "(.+)"),
                "victim_pod", "$1", "src_pod", "(.+)")
            )

        # pod:gpu_idle_cause_sum:5m
        # 5 cause base score 의 victim 단위 합. 정규화 분모 로 쓰인다. 일부 cause base 가 비어 있는
        # victim 은 그 cause 항 만 자연 skip 되며 sum 은 존재 하는 cause 의 합 으로 산출 된다. cluster
        # 단위 gpu_idle_cause_sum:5m 와 달리 vector(0) fallback 을 두지 않는 이유는 sum by(victim_*)
        # 가 라벨 매칭 으로 동작 해 vector(0) 의 무라벨 항 이 정상 victim 시리즈 와 합쳐지지 않기
        # 때문이다.
        - record: pod:gpu_idle_cause_sum:5m
          expr: sum by(node, victim_namespace, victim_pod) (pod:gpu_idle_cause_score:5m)

        # pod:gpu_idle_cause_weight:5m{victim_namespace,victim_pod,cause}
        # victim Pod 단위 5 cause 정규화 가중치. cluster 단위 gpu_idle_cause_weight:5m 와 동일 산정
        # 식 (cause score / 5 cause 합) 을 victim 라벨 차원 으로 적용 한다. on(victim_namespace,
        # victim_pod) group_left() 로 cause 라벨 을 LHS 에서 그대로 보존 한다. (pod:gpu_idle_cause_
        # sum:5m > 0) 필터 로 분모 0 인 victim 은 시리즈 자체 가 emit 되지 않아 NaN 잡음 을 차단 한다.
        # cluster 단위 weight 와 동일 하게 어느 노드 라도 GPU idle > 0.5 인 시간대 에만 emit 되도록
        # idle 게이팅 을 둔다. 본 weight 는 correlation_noisy_neighbor_score{victim_namespace,
        # victim_pod} 와 (victim_namespace, victim_pod) 라벨 join 으로 매칭 되어 dashboard 와 alert
        # 가 victim 단위 dominant cause 식별 에 사용 한다.
        - record: pod:gpu_idle_cause_weight:5m
          expr: |
            (
              pod:gpu_idle_cause_score:5m
              / on(node, victim_namespace, victim_pod) group_left()
              (pod:gpu_idle_cause_sum:5m > 0)
            )
            and on() (max(node:gpu_idle:5m) > 0.5)

        # victim:gpu_idle_dominant_cause:5m{victim_namespace,victim_pod,cause}
        # #101 victim 단위 dominant cause 단일 시리즈. cluster:gpu_idle_dominant_cause:5m 와 동일
        # topk + tie-breaker 패턴 을 victim 차원 으로 적용 한다. victim 별 6 cause weight 중 최대값
        # cause 1 종 만 노출 해 dashboard 와 alert 에서 victim 단위 단일 cause string 으로 join 가능
        # 하다. 정확한 동률 케이스 에서 cause enum 사전순 가장 앞 라벨 이 채택 되도록 1e-6 단위 의
        # deterministic offset 을 cause 별로 가산해 tie-breaker 로 둔다. cluster 단위 rule 과 달리
        # pod:gpu_idle_cause_weight:5m 가 (victim_namespace, victim_pod, cause) 라벨 셋 을 가지므로
        # offset 의 vector 매칭 에 group_left() 가 필요 하다. weight 시리즈 가 idle 게이팅 으로 emit
        # 되지 않는 시간대 는 본 record 도 자연 emit 되지 않는다.
        - record: victim:gpu_idle_dominant_cause:5m
          expr: |
            topk by(node, victim_namespace, victim_pod) (1,
              pod:gpu_idle_cause_weight:5m
              + on(cause) group_left() (
                label_replace(vector(6e-6), "cause", "cgroup_contention", "", "")
                or label_replace(vector(5e-6), "cause", "cpu_throttle", "", "")
                or label_replace(vector(4e-6), "cause", "host_compute_stall", "", "")
                or label_replace(vector(3e-6), "cause", "memory_pressure", "", "")
                or label_replace(vector(2e-6), "cause", "network_pressure", "", "")
                or label_replace(vector(1e-6), "cause", "pcie_saturation", "", "")
              )
            )

        # victim:gpu_idle_dominant_cause_indicator:5m{victim_namespace,victim_pod,cause}
        # GPUIdleDominantCauseSwitch 와 동일 패턴 의 victim 단위 cause 별 0/1 indicator. victim 의
        # dominant cause 는 1, dominant 가 아닌 cause 4 종 은 0 으로 emit 되어 changes() 가 victim 별
        # cause swap 빈도 를 안정적으로 카운트 가능 하다. dominant cause 1 종 시리즈 에 * 0 + 1 로
        # 라벨 보존한 1 을 만들고 or 로 나머지 cause weight 4 종 에 0 을 fill 한다. idle 게이팅 이
        # 꺼진 시간대 는 양쪽 시리즈 모두 없어 본 indicator 도 자연 emit 되지 않는다. victim 단위
        # ambiguous alert 와 dashboard 의 dominant cause 색상 mapping 에 활용 된다.
        - record: victim:gpu_idle_dominant_cause_indicator:5m
          expr: |
            (victim:gpu_idle_dominant_cause:5m * 0 + 1)
            or (pod:gpu_idle_cause_weight:5m * 0)

        # gpu_idle_cause_weight_top3:5m{cause}
        # #101 secondary cause 가시화 의 cluster 단위 top3 시리즈. cluster:gpu_idle_dominant_cause:
        # 5m 가 top1 cause 1 종 만 노출 해 운영자 가 2 위 와 3 위 cause 와 의 격차 또는 동률 여부 를
        # 확인 불가 한 한계 를 보완 한다. dashboard 의 stacked time-series panel 에서 top3 cause 만
        # 색상 강조 후 나머지 2 cause 는 회색 처리 로 secondary 비교 와 cardinality 가시성 을 동시
        # 확보 한다. weight 시리즈 가 idle 게이팅 으로 emit 되지 않는 시간대 는 본 record 도 자연
        # emit 되지 않는다.
        - record: gpu_idle_cause_weight_top3:5m
          expr: topk(3, gpu_idle_cause_weight:5m)

        # pod:gpu_idle_cause_weight_top3:5m{victim_namespace,victim_pod,cause}
        # #101 victim 단위 top3 cause 시리즈. cluster 단위 top3 와 동일 의도 를 victim 차원 으로
        # 적용 한다. dashboard 의 victim selection drill-down 시 해당 victim 의 5 cause 중 top3 만
        # 강조 해 secondary 와 tertiary cause 비교 가 가능 하다. topk by(victim_namespace, victim_pod)
        # 로 victim 별 독립적 으로 top3 선정 한다.
        - record: pod:gpu_idle_cause_weight_top3:5m
          expr: topk by(node, victim_namespace, victim_pod) (3, pod:gpu_idle_cause_weight:5m)

    # netobs-gpuobs.thermal-correlation.recording 그룹은 #68 의 RTX consumer GPU thermal / power /
    # clock 상관 분석 layer 의 recording rule 을 모은다. 본 그룹의 helper 5종 (temp / throttle 의 avg
    # 와 stddev, 그리고 temp x throttle 의 avg) 은 Pearson 정의식 r = (avg(xy) - avg(x)avg(y)) /
    # (stddev(x) * stddev(y)) 를 PromQL 단독으로 산정하기 위한 입력이다. internal/correlation 라이브
    # 러리는 cross-correlation 관례에 따라 lag step 별 산출 + EnumeratePairs + correlation-exporter
    # Collector 체인이라 GPU 단위 단일 score 의 본 PR 형태와 다르므로 reuse 대상에서 제외한다. 라벨
    # 셋은 (node, gpu_uuid) 로 축약해 dashboard cross-reference join 시 group_left() 로 gpu_index 와
    # gpu_model 을 끌어올 수 있게 한다.
    - name: netobs-gpuobs.thermal-correlation.recording
      interval: 30s
      rules:
        # gpuobs_thermal_temp_avg:5m
        # temperature 의 5 분 이동 평균. Pearson 정의식의 avg(x) 항.
        - record: gpuobs_thermal_temp_avg:5m
          expr: |
            avg by(node, gpu_uuid) (
              avg_over_time(gpuobs_device_temperature_celsius[5m])
            )

        # gpuobs_thermal_throttle_avg:5m
        # hw_thermal_slowdown throttle 의 5 분 이동 평균. throttle 이 0/1 binary 라 평균은 [0, 1]
        # 사이 throttle 활성 비율이다. Pearson 정의식의 avg(y) 항.
        - record: gpuobs_thermal_throttle_avg:5m
          expr: |
            avg by(node, gpu_uuid) (
              avg_over_time(gpuobs_device_throttle_active{reason="hw_thermal_slowdown"}[5m])
            )

        # gpuobs_thermal_x_throttle_avg:5m
        # temperature 와 throttle 곱의 5 분 이동 평균. Pearson 정의식의 avg(xy) 항. throttle 라벨의
        # reason 차이로 vector matching 이 ignoring(reason) 으로 reason 만 무시하고 나머지 라벨로
        # 매치된다. subquery [5m:30s] 로 instant 곱을 range vector 로 변환한다.
        - record: gpuobs_thermal_x_throttle_avg:5m
          expr: |
            avg by(node, gpu_uuid) (
              avg_over_time(
                (
                  gpuobs_device_temperature_celsius
                  * ignoring(reason)
                  gpuobs_device_throttle_active{reason="hw_thermal_slowdown"}
                )[5m:30s]
              )
            )

        # gpuobs_thermal_temp_stddev:5m
        # temperature 의 5 분 표준편차. Pearson 정의식의 stddev(x) 항.
        - record: gpuobs_thermal_temp_stddev:5m
          expr: |
            avg by(node, gpu_uuid) (
              stddev_over_time(gpuobs_device_temperature_celsius[5m])
            )

        # gpuobs_thermal_throttle_stddev:5m
        # throttle 의 5 분 표준편차. throttle 이 항상 0 이거나 항상 1 인 평탄 시간대는 0 으로 떨어지며
        # 본 helper 가 Pearson 분모의 (denom > 0) 가드 입력으로 들어가 score 시리즈가 자연 제외된다.
        - record: gpuobs_thermal_throttle_stddev:5m
          expr: |
            avg by(node, gpu_uuid) (
              stddev_over_time(gpuobs_device_throttle_active{reason="hw_thermal_slowdown"}[5m])
            )

        # gpuobs_thermal_correlation_score:5m
        # temperature 와 hw_thermal_slowdown throttle 의 5 분 윈도우 lag 0 Pearson 상관계수의 절댓값
        # 이다. throttle 이 0/1 binary 라 엄밀히는 point-biserial correlation 이며, abs() 로 [0, 1]
        # 단조 score 로 노출해 dashboard 와 alert 는 양상관 강도만 본다. 분모 (stddev_temp x
        # stddev_throttle) 가 0 인 평탄 시간대는 (denom > 0) 필터로 시리즈 자체가 emit 되지 않아 NaN
        # 이 라벨 세트에 끼지 않는다.
        - record: gpuobs_thermal_correlation_score:5m
          expr: |
            clamp_max(
              abs(
                (
                  gpuobs_thermal_x_throttle_avg:5m
                  - (gpuobs_thermal_temp_avg:5m * gpuobs_thermal_throttle_avg:5m)
                )
                /
                (
                  (gpuobs_thermal_temp_stddev:5m * gpuobs_thermal_throttle_stddev:5m) > 0
                )
              ),
              1
            )

        # gpuobs_clock_drop_score:5m
        # graphics clock 의 현재 값 / 5 분 max 비율. 1.0 에 가까우면 정상 boost clock, 임계 미만이면
        # thermal 또는 power throttle 영향으로 clock 이 하향 조정된 상태다. graphics 도메인 한 가지만
        # 사용해 sm / mem / video 의 동시 노출이 만드는 score 의 라벨 폭증과 단일 시리즈 의도 어긋남을
        # 차단한다. 라벨 셋은 (node, gpu_uuid) 로 축약한다. idle GPU 에서 graphics clock 이 0 으로
        # 떨어지면 5 분 max 도 0 이라 0/0 NaN 잡음이 발생하므로 (max_over_time > 0) 분모 가드를 둬
        # 시리즈를 자연 skip 한다.
        - record: gpuobs_clock_drop_score:5m
          expr: |
            clamp_max(
              avg by(node, gpu_uuid) (
                gpuobs_device_clock_mhz{clock="graphics"}
                /
                (max_over_time(gpuobs_device_clock_mhz{clock="graphics"}[5m]) > 0)
              ),
              1
            )

    # netobs-gpuobs.drop-flow.recording 그룹은 #64 의 drop flow 5-tuple burst 검출을 위한 recording
    # rule 을 둔다. evaluation interval 30s, rate window 1m 으로 두어 ServiceMonitor 의 scrape
    # interval (15s) 보다 충분히 길어 sample 부족으로 인한 빈 결과를 회피한다. rate window 가 1m
    # 라 1 분 안의 burst 평균값을 산출하며 short burst (수 초 단위) 는 평균이 희석된다. 본 trade-off
    # 는 운영 환경의 sustained burst 감지 (alert) 가 우선이라 채택한다.
    - name: netobs-gpuobs.drop-flow.recording
      interval: 30s
      rules:
        # netobs_drop_burst:rate1m
        # 동일 5-tuple 의 drop 횟수를 1 분 윈도우에서 초당 평균으로 산출한다. src_namespace /
        # src_pod / 5-tuple / drop_reason / drop_category 라벨을 보존해 alert 에서 정확한 connection
        # 단위 식별이 가능하다.
        - record: netobs_drop_burst:rate1m
          expr: |
            sum by(src_namespace, src_pod, src_ip, src_port, dst_ip, dst_port, protocol, drop_reason, drop_category) (
              rate(netobs_drop_events_flow_total[1m])
            )

        # netobs_sock_teardown:rate5m
        # 소켓 종료 정리 (#345) 의 노드·워크로드 단위 5분 rate. NOT_SPECIFIED + TCP_CLOSE skb 는
        # packet drop 이 아니라 소켓 teardown 시 큐 잔여 skb 해제라, BPF 가 drop stage 에서 분리해
        # netobs_sock_teardown_total 로 emit 한다. 따라서 netobs_drop_events_labeled_total 기반의
        # 모든 drop 집계 (netobs_drop_burst / cluster:network_drop_5m_rate / network health) 는
        # 소스 단계부터 이 신호를 포함하지 않는다. 본 record 는 connection churn (짧은 TCP 연결
        # 반복) 을 drop 노이즈와 분리해 표기하는 전용 신호다.
        - record: netobs_sock_teardown:rate5m
          expr: |
            sum by(node, src_namespace, src_workload) (
              rate(netobs_sock_teardown_total[5m])
            )

    # netobs-gpuobs.flow-bandwidth.recording 그룹은 #193 flow 토폴로지 API 의 대역폭 해석을 사전 계산한다.
    # pod:network_mbps:5m 는 항상 수집되는 netobs_pod_bytes_total (nic layer) 기반이라 flow allow-list
    # 와 무관하게 emit 되고, flow:bytes_by_protocol:5m 는 netobs_flow_bytes_total 기반이라 NETOBS_FLOW_
    # ALLOW_NAMESPACES 활성 namespace 에서만 emit 된다. cross-node bytes 집계는 flow_bytes 에 dst_node
    # 라벨이 없어 본 그룹에서 제외하며 dst_node 계측 도입 시 별도 follow-up 으로 추가한다.
    - name: netobs-gpuobs.flow-bandwidth.recording
      interval: 30s
      rules:
        # pod:network_mbps:5m
        # Pod 별 방향별 NIC layer 대역폭 (Mbps). bytes/sec rate 에 8 을 곱하고 1e6 으로 나눠 Mbps 로
        # 환산한다. netobs_pod_bytes_total 은 dst 라벨이 없는 per-pod egress/ingress counter 라 항상
        # 수집되며 flow allow-list 와 독립이다.
        - record: pod:network_mbps:5m
          expr: |
            sum by(node, src_namespace, src_pod, direction) (
              rate(netobs_pod_bytes_total{layer="nic"}[5m])
            ) * 8 / 1e6

        # flow:bytes_by_protocol:5m
        # L4 protocol (TCP/UDP) 별 방향별 flow 대역폭 (bytes/sec). netobs_flow_bytes_total 의 protocol
        # 라벨로 분리한다. flow allow-list 가 켜진 namespace 에서만 base 가 emit 된다.
        - record: flow:bytes_by_protocol:5m
          expr: |
            sum by(protocol, direction) (
              rate(netobs_flow_bytes_total[5m])
            )

    # netobs-gpuobs.cluster-health.recording 그룹은 cluster 전체 단위의 4 카테고리 health score 를
    # 산출한다. observability overview dashboard (#53) 의 single-stat 패널이 본 record 4 종을 직접
    # 참조한다. 각 score 는 0 ~ 1 사이로 정규화되며 1 이 healthy, 0 이 worst 다. cluster 의 어느 노드
    # 나 Pod 라도 unhealthy 신호가 있으면 score 가 떨어지도록 max / quantile 기반 cluster aggregation
    # 을 적용한다. GPU 미설치 cluster 또는 traffic 없는 dev cluster 에서는 base series 가 비어 score
    # 가 산출되지 않을 수 있으며 본 경우 dashboard 에서 N/A 로 표시된다.
    - name: netobs-gpuobs.cluster-health.recording
      interval: 30s
      rules:
        # node:gpu_health_score:5m (#273 재정의)
        # 초기에는 "유휴 GPU 가 곧 문제" 전제로 사용률 자체를 health 로 썼으나, 유휴의 문제 여부는
        # 이후 gpu-idle 원인 귀속 (cluster/node/pod 3 scope) 이 전담하게 되어 전제가 바뀌었다. 사용률
        # 등식은 놀고 있는 건강한 GPU 를 overview weakest "gpu 0.00 (degraded)" 로 만드는 오도가 있어
        # 하드웨어 이상 신호 기반으로 재정의한다. unhealth = max(thermal score, 유의미 NVML 오류율
        # (유휴 GPU 의 양성 코드 Not Found / Not Supported 제외, alert 임계 1/s 정규화), 성능성
        # throttle 활성 (GPUObsThrottleActive 와 동일 reason 셋, 정보성 gpu_idle 제외)) 이고
        # health = 1 - unhealth 다. sig 라벨은 or 유니온에서 세 신호가 서로 가려지지 않게 하는
        # 구분자로 max 가 소거한다. throttle 신호는 avg_over_time 5분 평활 (#389) 이다. 순간 게이지
        # 원값을 쓰면 소비자 GPU 의 부스트성 sw_power_cap blip (스크레이프 1회) 이 unhealth 1 이 되어
        # health 0 으로 직행하고 cluster 판의 min() 이 전 클러스터를 0 으로 만들며, 같은 reason 셋의
        # GPUObsThrottleActive (for: 1m debounce) 보다 health 가 더 과민한 비대칭이 있었다. 평활로
        # thermal (5분 score) 및 NVML (5분 rate) 과 시간 축이 정합하고, blip 은 지속 비율만큼만
        # 기여하며 5분 내내 지속된 throttle 만 health 0 이 된다. 다른 node health 3종 (#264 블록)
        # 보다 앞에 두는 이유는 아래 cluster 판이 같은 그룹 내 순차 평가로 본 rule 을 지연 없이
        # 참조하기 위함이다. GPU 미설치 노드에서는 base series 가 비어 score 가 산출되지 않는다.
        - record: node:gpu_health_score:5m
          expr: |
            1 - clamp_max(
              max by(node) (
                label_replace(node:gpu_thermal_score:5m, "sig", "thermal", "", "")
                or label_replace(
                  clamp_max(sum by(node) (rate(gpuobs_nvml_errors_total{error_code!~"Not Supported|Not Found"}[5m])), 1),
                  "sig", "nvml", "", "")
                or label_replace(
                  max by(node) (avg_over_time(gpuobs_device_throttle_active{reason=~"hw_slowdown|hw_thermal_slowdown|hw_power_brake_slowdown|sw_thermal_slowdown|sw_power_cap"}[5m])),
                  "sig", "throttle", "", "")
              ),
              1
            )

        # cluster:gpu_health_score:5m (#273 재정의)
        # 노드 gpu health 의 최소값 (worst 노드). 위 node 판과 같은 그룹이라 순차 평가로 지연 없이
        # 참조하며, 복잡 유니온 산식의 중복을 피한다.
        - record: cluster:gpu_health_score:5m
          expr: min(node:gpu_health_score:5m)

        # cluster:cpu_health_score:5m
        # cluster 전체 Pod 의 cpu_throttle_score p95 의 inversion. p95 가 cluster 의 상위 5 % Pod 만
        # throttled 면 (대부분의 워크로드가 정상) score 가 높게 유지된다.
        - record: cluster:cpu_health_score:5m
          expr: |
            1 - clamp_max(
              quantile(0.95, pod:cpu_throttle_score:5m),
              1
            )

        # cluster:network_health_score:5m
        # 노드 단위 drop rate 의 cluster 최대값이 100/s 가 worst case 다. cluster 전체 sum 으로
        # 산출하면 노드 수가 늘수록 자연스럽게 drop 도 늘어 임계가 의미를 잃는다. max by(node) 로
        # 가장 압박 받는 노드 기준으로 산출해 cluster 규모와 무관한 health 신호를 만든다.
        - record: cluster:network_health_score:5m
          expr: |
            1 - clamp_max(
              max by(node) (sum by(node) (rate(netobs_drop_events_labeled_total[5m]))) / 100,
              1
            )

        # node:memory_health_score:5m (#274 실측 재정의, #286 위험 구간 매핑)
        # 기존 pod score p95 inversion 은 tight-limit 관측 인프라 pod 가 지배해 health 가 영구 ~0.2
        # 로 고정됐다. 노드 실측 압박 (node:memory_pressure_score, node_exporter 기반, #274) 을
        # 위험 구간으로 매핑한다. 선형 역수 (1 - usage) 는 정상 상주 사용률 (예: 0.58) 을 낮은
        # health 로 읽게 해 의미론이 어긋나므로 (#286), kubelet eviction 근접 의미로 사용률 0.8
        # 이하는 1.0, 0.8~0.95 는 선형 하강, 0.95 이상은 0 으로 산정한다. pressure 계열은 원시
        # 사용률 신호로 유지하고 health 층에서만 매핑한다. gpu 판 (#273) 과 동일하게 다른 node
        # health (#264 블록) 보다 앞의 본 위치에 두는 이유는 아래 cluster 판이 같은 그룹 내 순차
        # 평가로 본 rule 을 지연 없이 참조하기 위함이다. 참조 rule (pressure) 이 다른 그룹에 있어
        # 그룹 간 평가는 최대 1 interval 지연될 수 있으나 기존 rollup 체인들과 동일한 허용 범위다.
        - record: node:memory_health_score:5m
          expr: |
            clamp_max(
              clamp_min((0.95 - node:memory_pressure_score:5m) / 0.15, 0),
              1
            )

        # cluster:memory_health_score:5m (#274 실측 재정의, #286 위험 구간 매핑)
        # 노드 memory health 의 최소값 (worst 노드). gpu 판과 동일하게 같은 그룹 내 순차 평가로 위
        # node 판을 지연 없이 참조하며, 매핑 산식의 중복을 피한다.
        - record: cluster:memory_health_score:5m
          expr: min(node:memory_health_score:5m)

        # node:*_health_score:5m 4종 (#264)
        # cluster health 와 동일 산식을 노드 차원으로 이식해 node/{node} 가 노드별 4차원 health 를
        # 노출하게 한다. cpu 와 memory 는 노드 pod 의 pressure p95 inversion (quantile by(node)),
        # network 는 노드 drop rate inversion, gpu 는 노드 device 사용률 평균이다. gpu 는
        # node:gpu_util_ratio:5m 가 gpu_uuid 라벨로 device 별 다중 시리즈라 avg by(node) 로 노드 단위
        # 집계한다. cluster health rule 은 변경하지 않는다.
        # cpu limit (CFS quota) 을 가진 pod 가 없는 노드는 pod:cpu_throttle_score:5m 입력이 비어
        # quantile by(node) 가 그룹 자체를 만들지 않아 시리즈가 결측되고, GetNode API 가 health.cpu 를
        # 생략해 프론트가 0.00 (최악) 으로 오표시한다 (#347). cpu limit pod 가 없으면 throttle 이
        # 발생할 수 없어 CPU 공급 정체 없음 = 건강 1.0 이 정확한 판정이다. 전 노드에 존재하는
        # node:memory_health_score:5m (node_exporter 실측 기반, #274) 를 앵커로 * 0 + 1 로 1.0 을
        # 만들어 or 로 결합한다. throttle 이 있는 노드는 quantile 값이 or 좌변에 있어 그대로 유지되고,
        # 없는 노드만 우변의 1.0 을 받는다 (양변 모두 {node} 단일 라벨이라 시그니처 정합). 앵커는 같은
        # 그룹 상단에 순차 평가되어 지연이 없다. 이 프로젝트의 노드 fallback 관용구 (or on(node)
        # (... * 0)) 와 동일 축이다.
        # 결합 유의: 앵커가 memory_health 라 fallback 경로의 cpu health 가 node_exporter 가용성에
        # 간접 의존한다. node_exporter 가 빠진 노드는 cpu 와 memory health 가 동반 결측되어 일관은
        # 유지되나, 더 중립적 앵커가 필요하면 kube_node_info (kube-state, node_exporter 무관) 로 교체
        # 가능하다. 또한 fallback 의 1.0 은 실측이 아닌 "throttle 없음" 상수로, CPU 여유를 뜻하지
        # 않는다 (memory health 실측과 성격이 다름). cpu limit 없는 pod 의 노드 CPU 폭주는 cpu health
        # 가 아니라 node status 의 usage 축 (#333) 이 담당한다.
        - record: node:cpu_health_score:5m
          expr: |
            (
              1 - clamp_max(
                quantile by(node) (0.95, pod:cpu_throttle_score:5m),
                1
              )
            )
            or (node:memory_health_score:5m * 0 + 1)

        # node:memory_health_score:5m 는 gpu 판과 동일하게 cluster 판이 참조하는 순서 제약으로
        # cluster-health 블록 상단 (#286) 에 정의되어 있다.

        - record: node:network_health_score:5m
          expr: |
            1 - clamp_max(
              sum by(node) (rate(netobs_drop_events_labeled_total[5m])) / 100,
              1
            )

        # node:gpu_health_score:5m 는 cluster 판이 참조하는 순서 제약으로 cluster-health 블록 상단
        # (#273) 에 정의되어 있다.

    # netobs-gpuobs.alerts 그룹은 운영 임계 초과를 Alertmanager로 전달하는 alert rule을 모은다.
    # severity 라벨로 critical(즉시 대응)과 warning(추세 관찰)을 구분한다. for 절은 false-positive
    # 차단 목적으로 2분 이상을 기본으로 둔다. ECC와 PCIe replay 알람은 본 그룹에서 제외했다.
    # 두 메트릭(gpuobs_device_ecc_errors_total, gpuobs_device_pcie_replay_errors_total)의
    # emit 경로가 아직 구현되지 않아 알람이 dead alert가 되기 때문이며, 메트릭 emit이 추가되는
    # 시점에 본 그룹에 함께 들여온다.
    - name: netobs-gpuobs.alerts
      interval: 30s
      rules:
        # NetObsHighStageLatencyP99
        # 로컬 커널 처리 stage의 5분 윈도우 p99 latency가 0.4초를 초과하고 동시에 해당 stage의
        # 이벤트 발생률이 1event/s 이상일 때만 발화한다. 발생률 필터는 sparse 시리즈에서 +Inf 버킷
        # fallback이 만드는 노이즈를 차단한다. netobs_stage_latency_labeled_seconds의 버킷은
        # ExponentialBuckets(1e-6, 2, 20)이라 최상위 finite 경계가 0.524288s이고,
        # histogram_quantile은 이 경계를 넘는 값을 낼 수 없다. 기존 임계 1.0s는 이 천장 위라
        # 어떤 부하에서도 도달 불가한 dead alert였다(#362). 임계 0.4s는 최상위 finite 버킷
        # [0.262144s, 0.524288s] 안이라 도달 가능하며, 처리 stage의 실측 baseline p99(최대 약
        # 0.014s) 위로 충분한 여유를 둔다. 관측 상한은 0.524288s로 유지되어 그보다 큰 latency는
        # 천장에서 포화하지만 0.4s 임계는 여전히 발화한다.
        # stage!~ 매처로 대기/간격/네트워크 stage를 제외한다. to_veth(전송 간격)와 ack_wait(지연 ACK
        # 타이머, 설계상 최대 200~500ms)와 rcv_app(app pickup 대기)과 connect(핸드셰이크 왕복 RTT)은
        # 로컬 처리 병목이 아니라 트래픽 패턴·TCP 타이머·앱 스케줄링·네트워크 RTT에 좌우되어 정상
        # 상태에서도 구조적으로 천장 근처에 상주한다. 이들을 포함하면 임계 0.4s가 상시 오탐이 되므로
        # (#362 실측: 0.4 발화가 전부 to_veth·ack_wait), 처리 병목만 SLO 대상으로 남긴다. 더 큰 상한
        # 관측이 필요하면 histogram bucket 범위를 확장한 뒤 임계를 재설정하는 follow-up이 필요하다.
        # stage!~ 는 부정 목록이라 새 latency stage 추가 시 SLO 적합성을 재검토해야 부적합 stage가
        # 자동 포함돼 오탐이 되는 것을 막는다 (현재 retrans·drop·sock_teardown 은 latency histogram 을
        # emit 하지 않아 시리즈 부재로 무해). 제외한 stage(ack_wait·rcv_app·connect)의 실제 비정상은
        # 별도 alert 로 감지해야 하며 이 SLO 로는 잡지 않는다(#362 리뷰, follow-up). rate(count) > 1
        # 게이트는 sparse +Inf fallback 노이즈를 막는 대신 초당 1 event 미만 저트래픽 워크로드의 처리
        # 병목은 놓치는 트레이드오프가 있다.
        - alert: NetObsHighStageLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum by (le, stage, src_workload, src_namespace, node) (
                rate(netobs_stage_latency_labeled_seconds_bucket{stage!~"to_veth|ack_wait|rcv_app|connect"}[5m])
              )
            ) > 0.4
            and
            sum by (stage, src_workload, src_namespace, node) (
              rate(netobs_stage_latency_labeled_seconds_count{stage!~"to_veth|ack_wait|rcv_app|connect"}[5m])
            ) > 1
          for: 5m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs stage latency p99 over 0.4s (node={{ $labels.node }} workload={{ $labels.src_namespace }}/{{ $labels.src_workload }} stage={{ $labels.stage }})"
            description: "stage {{ $labels.stage }} latency p99 of workload {{ $labels.src_namespace }}/{{ $labels.src_workload }} on node {{ $labels.node }} is {{ $value | humanizeDuration }} over the last 5 minutes."

        # NetObsHighDropRate
        # drop_category별 drop rate가 10event/s를 초과하면 발화한다. 카테고리별로 분리해
        # 정책(policy)/큐 포화(queue)/checksum 등 원인 그룹을 즉시 식별할 수 있게 한다.
        - alert: NetObsHighDropRate
          expr: |
            sum by (node, drop_category, src_namespace, src_workload) (
              rate(netobs_drop_events_labeled_total[5m])
            ) > 10
          for: 2m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs drop rate over 10/s (node={{ $labels.node }} category={{ $labels.drop_category }})"
            description: "drop category {{ $labels.drop_category }} for workload {{ $labels.src_namespace }}/{{ $labels.src_workload }} on node {{ $labels.node }} is {{ $value }} events/sec sustained over 2 minutes. Reference docs/netobs/drop-reason.md for category semantics."

        # NetObsDropBurst
        # 동일 5-tuple 에서 drop rate 가 10 회/초 이상이고 1 분 지속 시 발화한다 (#64). 본 alert 는
        # netobs_drop_events_flow_total 메트릭이 emit 되는 namespace 한정으로 동작하며 cardinality
        # 가드를 통과한 5-tuple 만 검출 대상이다. burst rate 임계 10/s 는 dev cluster 의 합성 drop
        # 시나리오 (iptables -j DROP) 에서 sustained burst 의 하한값으로 검증되었다.
        - alert: NetObsDropBurst
          expr: |
            netobs_drop_burst:rate1m > 10
          for: 1m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs drop burst on 5-tuple (src={{ $labels.src_namespace }}/{{ $labels.src_pod }} dst={{ $labels.dst_ip }}:{{ $labels.dst_port }} proto={{ $labels.protocol }} reason={{ $labels.drop_reason }})"
            description: "drop burst rate {{ $value }} events/sec sustained over 1 minute for 5-tuple src={{ $labels.src_ip }}:{{ $labels.src_port }} → dst={{ $labels.dst_ip }}:{{ $labels.dst_port }} protocol={{ $labels.protocol }} drop_reason={{ $labels.drop_reason }}. See docs/netobs/drop-flow-analysis.md for triage workflow."

        # NetObsHighRetransmissionRate
        # TCP 재전송 rate가 5event/s를 넘으면 발화. 네트워크 혼잡, peer 처리 지연, 경로 패킷
        # 손실 셋 중 하나의 시그널이다.
        - alert: NetObsHighRetransmissionRate
          expr: |
            sum by (node, src_namespace, src_workload) (
              rate(netobs_retrans_events_labeled_total[5m])
            ) > 5
          for: 2m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs retransmission rate over 5/s (node={{ $labels.node }} workload={{ $labels.src_namespace }}/{{ $labels.src_workload }})"
            description: "TCP retransmission rate for workload {{ $labels.src_namespace }}/{{ $labels.src_workload }} on node {{ $labels.node }} is {{ $value }} events/sec sustained over 2 minutes."

        # NetObsTcpCongestion
        # 수신 Pod 의 TCP 혼잡 신호 alert (#65). max_srtt 가 200 ms 초과 (RTT degradation) 이고
        # 동시에 min_cwnd 가 5 분 전 5 분 baseline 의 50 % 미만으로 떨어진 경우 (cwnd backoff) 두
        # 조건 AND 로 false positive 를 차단한다. raw gauge 는 scrape 마다 reset 되어 window 내
        # min/max sample 을 의미하며 평소 baseline 과의 비교는 offset 5m 윈도우로 산출한다.
        # tcp_v4_rcv 는 emit 대상이 아니라 본 alert 는 rcv_demux 이후 stage 의 sample 만 본다.
        - alert: NetObsTcpCongestion
          expr: |
            (netobs_tcp_state_max_srtt_seconds > 0.2)
            and
            (
              netobs_tcp_state_min_cwnd
              < (avg_over_time(netobs_tcp_state_min_cwnd[5m] offset 5m) * 0.5)
            )
          for: 2m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs tcp congestion on receiving pod {{ $labels.namespace }}/{{ $labels.pod }} (node={{ $labels.node }})"
            description: "Receiving pod {{ $labels.namespace }}/{{ $labels.pod }} on node {{ $labels.node }} shows max srtt {{ $value | humanizeDuration }} with min_cwnd dropped below 50% of the previous 5-minute baseline, sustained over 2 minutes. Inspect peer congestion or downstream link saturation via netobs_tcp_state_min_cwnd / max_srtt_seconds / min_ssthresh."

        # GPUObsThrottleActive
        # hw_* / sw_thermal_slowdown / sw_power_cap reason은 운영상 문제 시그널이라 활성이면 critical.
        # gpu_idle / applications_clocks_setting / display_clock_setting / sync_boost는 정상 동작 신호라
        # reason 필터로 제외한다. for: 1m은 다른 critical보다 짧게 두어 throttle 발생을 즉시 포착한다.
        - alert: GPUObsThrottleActive
          expr: |
            gpuobs_device_throttle_active{reason=~"hw_slowdown|hw_thermal_slowdown|hw_power_brake_slowdown|sw_thermal_slowdown|sw_power_cap"} == 1
          for: 1m
          labels:
            severity: critical
            component: gpuobs
          annotations:
            summary: "GPU throttle active ({{ $labels.reason }}) on {{ $labels.node }} gpu_index={{ $labels.gpu_index }}"
            description: "GPU {{ $labels.gpu_index }} ({{ $labels.gpu_model }} uuid={{ $labels.gpu_uuid }}) on node {{ $labels.node }} is throttling due to {{ $labels.reason }}. Throughput is reduced. Check thermal headroom, power budget, or downstream hardware limits."

        # GPUObsThermalHeadroomLow
        # threshold(slowdown/hwslowdown/shutdown) 대비 5℃ 이내로 좁혀지면 발화. 기존 recording
        # rule node:gpu_temperature_headroom_celsius를 재사용해 노드 단위 최악 GPU 기준으로 평가한다.
        - alert: GPUObsThermalHeadroomLow
          expr: node:gpu_temperature_headroom_celsius < 5
          for: 2m
          labels:
            severity: critical
            component: gpuobs
          annotations:
            summary: "GPU thermal headroom below 5C on {{ $labels.node }} (threshold={{ $labels.threshold }})"
            description: "Thermal headroom for the worst GPU on node {{ $labels.node }} against threshold {{ $labels.threshold }} is {{ $value }}C. Thermal slowdown or shutdown is imminent. Check cooling, fan speed, or reduce GPU load."

        # GPUObsPowerHeadroomLow
        # power limit과 현재 사용량 차이가 10W 이내면 발화. 기존 recording rule
        # node:gpu_power_headroom_watts를 재사용한다. sw_power_cap throttle이 곧 발생할 수 있는 사전 시그널.
        - alert: GPUObsPowerHeadroomLow
          expr: node:gpu_power_headroom_watts < 10
          for: 2m
          labels:
            severity: warning
            component: gpuobs
          annotations:
            summary: "GPU power headroom below 10W on {{ $labels.node }}"
            description: "Power headroom (limit minus current usage) for the worst GPU on node {{ $labels.node }} is {{ $value }}W. The GPU is approaching its power limit and may start power-cap throttling. Consider reducing concurrent CUDA workloads."

        # GPUObsCudaStreamWaitHigh
        # cuStreamSynchronize 의 p99 host wait time 이 100ms 를 5 분 지속 초과하면 발화 (#67). GPU
        # 워크로드의 stream 단위 병목 (kernel 완료 대기, 대규모 memcpy 대기 등) 을 운영자가 즉시 식별
        # 할 수 있게 한다. cuEventSynchronize 는 event recording 의존 시점이 워크로드별로 너무 다양해
        # 동일 임계 적용이 부적절하므로 본 alert 의 expr 대상에서 제외한다. 임계 100ms 는 histogram
        # bucket 의 17 번째 경계 약 131ms 인근에서 정확한 p99 산정이 가능해 false positive 가 적다.
        # 그룹화 라벨에 src_pod_uid 를 포함해 롤링 업데이트 중 old/new Pod 이 같은 이름으로 공존할
        # 때 두 instance 의 sample 이 섞여 p99 가 잘못 산정되는 케이스를 차단한다. gpu_uuid 는 dev
        # 클러스터의 single GPU 전제로 의도적으로 드롭해 multi-GPU 워크로드 follow-up 까지 알람 단위
        # 를 Pod 로 유지한다.
        - alert: GPUObsCudaStreamWaitHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le, node, src_namespace, src_pod, src_pod_uid) (
                rate(gpuobs_cuda_stream_synchronize_seconds_bucket[5m])
              )
            ) > 0.1
            and
            sum by (node, src_namespace, src_pod, src_pod_uid) (
              rate(gpuobs_cuda_stream_synchronize_seconds_count[5m])
            ) > 0
          for: 5m
          labels:
            severity: warning
            component: gpuobs
          annotations:
            summary: "cuStreamSynchronize p99 over 100ms on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }})"
            description: "cuStreamSynchronize p99 host wait time for pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} (uid {{ $labels.src_pod_uid }}) on node {{ $labels.node }} is {{ $value | humanizeDuration }} sustained over 5 minutes. Inspect the workload's CUDA stream usage and the receiving GPU's kernel queue. See docs/gpuobs/cuda-sync-latency.md for triage workflow."

        # GPUObsThermalThrottleSustained
        # #68 의 RTX consumer GPU thermal correlation alert. thermal_correlation_score 가 0.8 초과로
        # 10 분 지속이고 같은 10 분 윈도우 안에 hw_thermal_slowdown throttle 이 실제로 발생한 적 있는
        # 케이스에만 발화한다. throttle 게이팅 없이 score 단독으로 발화하면 throttle 미발생 시간대의
        # 잡음 (분모가 매우 작은 평탄 시간대의 우연 상관) 이 누적되므로 max_over_time(throttle[10m]) == 1
        # AND 조건을 둔다. 일회성 thermal spike 가 아닌 sustained 패턴 감지가 본 alert 의 의도다.
        - alert: GPUObsThermalThrottleSustained
          expr: |
            gpuobs_thermal_correlation_score:5m > 0.8
            and
            max_over_time(
              (max by(node, gpu_uuid) (gpuobs_device_throttle_active{reason="hw_thermal_slowdown"}))[10m:30s]
            ) == 1
          for: 10m
          labels:
            severity: warning
            component: gpuobs
          annotations:
            summary: "GPU thermal throttle sustained on {{ $labels.node }} gpu_uuid={{ $labels.gpu_uuid }} (score={{ $value }})"
            description: "GPU {{ $labels.gpu_uuid }} on node {{ $labels.node }} shows sustained thermal throttle correlation with temperature for 10 minutes (score={{ $value }}, threshold 0.8). Check cooling, fan curve, ambient temperature, and reduce concurrent CUDA workloads. See docs/gpuobs/rtx-thermal-correlation.md for triage workflow."

    # netobs-gpuobs.gpu-idle.alerts 그룹은 GPU 유휴 상태와 7종 cause score 조합 alert을 모은다.
    # 단일 cause는 warning, host_compute_stall 은 host와 device 양쪽 자원 한계가 동시에 의심되므로
    # critical로 둔다. cutoff는 docs/correlation/diagnosis-gpu-idle.md 의 기본값 (warning 0.5, critical
    # 0.7-0.9) 을 따른다. for 5m으로 spike에 의한 false-positive를 차단한다. dcgm_pcie_replay 와
    # nccl_collective_stall 은 node 단위 base score (node:*_score:5m) 로 다른 5종과 동일하게 on(node)
    # 조인하며 데이터센터 GPU 환경에서만 발화한다 (#155).
    - name: netobs-gpuobs.gpu-idle.alerts
      interval: 30s
      rules:
        # GPUIdleWithPCIeSaturation
        # 노드 GPU 가 5분 평균 50% 이상 유휴이면서 PCIe saturation score 가 0.7 이상이면 발화.
        # GPU 작업 데이터가 PCIe 대역폭에 막혀 GPU가 일을 기다리는 시나리오. saturation score를 LHS에
        # 두어 alert의 $value가 PCIe score를 가리키도록 한다 ($value는 LHS 값으로 평가됨).
        - alert: GPUIdleWithPCIeSaturation
          expr: node:gpu_pcie_saturation_score:5m > 0.7 and on(node) node:gpu_idle:5m > 0.5
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with PCIe saturation on {{ $labels.node }} (score={{ $value }})"
            description: "Node {{ $labels.node }} GPUs are idle while PCIe saturation score is {{ $value }} (threshold 0.7). See docs/correlation/diagnosis-gpu-idle.md for diagnosis steps."

        # GPUIdleWithNetworkPressure
        # GPU 유휴 + (네트워크 throughput 포화 또는 재전송 비율 상승). Pod 단위 score라 어떤 pod이
        # 원인인지 src_namespace / src_pod 라벨로 식별 가능. retrans cutoff 0.05는 5% 이상 재전송 비율.
        # cause score를 LHS에 두어 $value 와 pod 라벨 (src_namespace, src_pod) 이 보존된다.
        - alert: GPUIdleWithNetworkPressure
          expr: |
            (
              pod:network_throughput_score_rise:5m > 0.7
              or
              pod:network_retrans_score_rise:5m > 0.05
            )
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with network pressure on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} score={{ $value }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} network throughput or retransmission score rose by {{ $value }} over its 30m-1h30m baseline while GPU is idle. Check whether the GPU workload depends on this pod's network I/O."

        # GPUIdleWithCPUThrottle
        # GPU 유휴 + 컨테이너 CPU CFS throttle. CPU limit 으로 인해 host측이 GPU에 작업을 보내지
        # 못하는 시나리오. cutoff 0.3은 30% 이상 period가 throttle된 상태. cause score를 LHS에 두어
        # $value 와 pod 라벨 이 보존된다.
        - alert: GPUIdleWithCPUThrottle
          expr: |
            (pod:cpu_throttle_score_rise:5m > 0.3)
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with CPU throttle on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} score={{ $value }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} CPU throttle score rose by {{ $value }} over its 30m-1h30m baseline while GPU is idle. Consider raising CPU limit or reducing concurrent CPU work."

        # GPUIdleWithMemoryPressure
        # GPU 유휴 + 컨테이너 메모리 working_set 이 limit에 임박. OOMKilled 전조이며 GPU 작업이 host
        # 메모리 부족으로 stall될 수 있다. cutoff 0.9은 working_set이 limit의 90%를 넘는 상태. cause
        # score를 LHS에 두어 $value (메모리 working_set / limit 비율) 와 pod 라벨 이 보존된다.
        # #244 절대 비율 (0.9) 대신 baseline 대비 상승분으로 판정한다. limit 에 상시 근접한 관측
        # 인프라 pod (dcgm-exporter 등) 의 오탐을 제거하고, 상승분 기준에서는 0.9 상승이 사실상
        # 불가능해 유의미한 신규 압박 임계로 0.3 을 쓴다.
        - alert: GPUIdleWithMemoryPressure
          expr: |
            (pod:memory_pressure_score_rise:5m > 0.3)
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with memory pressure on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} memory working_set / limit ratio rose by {{ $value | humanizePercentage }} over its 30m-1h30m baseline while GPU is idle. Consider raising memory limit before OOMKill."

        # GPUIdleWithHostComputeStall
        # GPU 유휴 + host측 CUDA launch 부족 또는 GPU device memory 포화. host 또는 device 측에서
        # GPU 작업을 진행할 수 없는 상태이며 다른 cause score와 무관하게 GPU 자체 활용이 막힌 critical
        # 시그널이다. cutoff 0.7은 baseline의 30% 미만 launch rate 또는 GPU memory 70% 이상. cause
        # score를 LHS에 두어 $value 와 pod 라벨 이 보존된다.
        - alert: GPUIdleWithHostComputeStall
          expr: |
            (pod:host_compute_stall_score_rise:5m > 0.7)
              and on(node)
            (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: critical
            component: correlation
          annotations:
            summary: "GPU idle with host compute stall on {{ $labels.node }} (pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} score={{ $value }})"
            description: "Pod {{ $labels.src_namespace }}/{{ $labels.src_pod }} on node {{ $labels.node }} host compute stall score (low CUDA launch rate or GPU memory saturation) rose by {{ $value }} over its 30m-1h30m baseline while GPU is idle. Inspect kernel launches via gpuobs_cuda_kernel_launches_total and GPU memory via pod:gpu_memory_utilization_ratio:5m."

        # GPUIdleWithDCGMPCIeReplay (#155)
        # GPU 유휴 + DCGM PCIe replay score 상승. dcgm_pcie_replay 는 dominant cause 엔진의 7 cause 중
        # 하나다. base score node:dcgm_pcie_replay_score:5m 가 node 단위라 기존 5 alert 와 동일하게
        # on(node) 로 같은 노드의 GPU 유휴와 결합해 cross-node 오탐을 막고 node 라벨로 조치 가능하게
        # 한다. dcgm-exporter 가 활성인 데이터센터 GPU 환경에서만 base 가 emit 되고 dev (DCGM 부재)
        # 에서는 score 가 0 이라 발화하지 않는다. PCIe link error 로 인한 retry 가 GPU compute 진입을
        # 지연시키는 hardware 신호다.
        - alert: GPUIdleWithDCGMPCIeReplay
          expr: |
            node:dcgm_pcie_replay_score:5m > 0.7
              and on(node) (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with DCGM PCIe replay on {{ $labels.node }} (score={{ $value }})"
            description: "DCGM PCIe replay score is {{ $value }} (threshold 0.7) on node {{ $labels.node }} while a GPU is idle. PCIe link errors (DCGM_FI_DEV_PCIE_REPLAY_COUNTER) are forcing retries that delay GPU compute. Inspect link health on datacenter GPUs. See docs/correlation/diagnosis-gpu-idle.md for diagnosis steps."

        # GPUIdleWithNCCLCollectiveStall (#155)
        # GPU 유휴 + NCCL collective stall score 상승. nccl_collective_stall 은 dominant cause 엔진의
        # 7 cause 중 하나다. base score node:nccl_collective_stall_score:5m 가 node 단위라 on(node) 로
        # 같은 노드의 GPU 유휴와 결합해 cross-node 오탐을 막고 node 라벨로 조치 가능하게 한다. NCCL
        # profiler 가 활성인 데이터센터 GPU 환경에서만 base 가 emit 되고 dev (noop profiler) 에서는
        # score 가 0 이라 발화하지 않는다. allreduce / broadcast 등 collective 의 rank 간 sync 대기로
        # GPU 가 유휴인 상태를 host_compute_stall (kernel launch 부족) 과 구분한다.
        - alert: GPUIdleWithNCCLCollectiveStall
          expr: |
            node:nccl_collective_stall_score:5m > 0.7
              and on(node) (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with NCCL collective stall on {{ $labels.node }} (score={{ $value }})"
            description: "NCCL collective stall score is {{ $value }} (threshold 0.7) on node {{ $labels.node }} while a GPU is idle. Ranks are spending wall-clock in collective wait (allreduce/broadcast sync). Inspect gpuobs_nccl_collective_duration_seconds. See docs/correlation/diagnosis-gpu-idle.md for diagnosis steps."

        # GPUIdleWithThermal (#190)
        # GPU 유휴 + thermal score 상승. thermal 은 dominant cause 엔진의 8 cause 중 하나다. base score
        # node:gpu_thermal_score:5m 가 node 단위라 on(node) 로 같은 노드의 GPU 유휴와 결합해 cross-node
        # 오탐을 막고 node 라벨로 조치 가능하게 한다. 온도·throttle 변화가 없는 노드에서는 score 가 0
        # 이라 발화하지 않는다. 발열로 인한 clock 강하가 GPU 활용을 떨어뜨리는 상태를 host_compute_stall
        # (kernel launch 부족) 과 구분한다. cause enum 과 GPUIdleWith* alert 의 1:1 매핑을 유지한다.
        - alert: GPUIdleWithThermal
          expr: |
            node:gpu_thermal_score:5m > 0.7
              and on(node) (node:gpu_idle:5m > 0.5)
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle with thermal throttle on {{ $labels.node }} (score={{ $value }})"
            description: "GPU thermal score is {{ $value }} (threshold 0.7) on node {{ $labels.node }} while a GPU is idle. Temperature and hw_thermal_slowdown throttle move together, so heat is capping clocks and GPU utilization. Inspect gpuobs_device_temperature_celsius and cooling. See docs/correlation/diagnosis-gpu-idle.md for diagnosis steps."

        # GPUIdleDominantCauseSwitch
        # GPU 유휴 dominant cause 가 10 분 안에 두 번 이상 swap 시 발화 (#66). cause 식별이 불안정한
        # 워크로드 (cause 간 신호가 cycling 하거나 동률에 근접) 를 검출한다. cause 별 0/1 indicator 의
        # 1 ↔ 0 전이를 합산해 임계를 잡는다. 1 회 swap 은 두 cause indicator 가 동시에 전이해 합 2 가
        # 발생하므로 2 회 swap 의 임계는 합 4 이상이다. for: 1m 으로 changes() 윈도우 내부의 단일
        # spike 가 firing 으로 즉시 이어지지 않게 한다.
        - alert: GPUIdleDominantCauseSwitch
          expr: |
            sum(changes(gpu_idle_dominant_cause_indicator:5m[10m])) >= 4
          for: 1m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle dominant cause unstable (>= 2 swaps in 10m)"
            description: "GPU idle dominant cause has swapped {{ $value | humanize }} indicator transitions across 5 causes in the last 10 minutes. Inspect gpu_idle_cause_weight:5m and cluster:gpu_idle_dominant_cause:5m to identify the alternating causes. See docs/observability/gpu-idle-dominant-cause.md for triage workflow."

        # GPUIdleDominantCauseAmbiguous
        # #101 cluster 단위 dominant cause 의 동률 ambiguous 상태 감지. 기존 GPUIdleDominantCauseSwitch
        # 는 시간축 flapping (10 분 안 2 회 이상 cause 전이) 을 잡지만 동일 시점 에 top1 과 top2 가
        # 거의 동률 인 ambiguous 상태 는 잡지 못한다. 본 alert 는 top1 weight 와 top2 weight 의 격차
        # 가 0.1 미만 이면서 동시에 magnitude (top1) 가 0.3 초과 일 때 발화 한다. magnitude 게이팅 은
        # noise floor (모든 cause 가 작은 값 일 때 의 무의미 한 동률) 를 차단 한다. severity 는 즉시
        # 대응 의미 가 아닌 자동 rule 의 dominant 판정 에서 manual 진단 으로 전환 해야 한다는 신호
        # 라 critical 이 아닌 warning 채택. for: 5m 으로 단발 spike false positive 차단.
        - alert: GPUIdleDominantCauseAmbiguous
          expr: |
            (
              max(topk(1, gpu_idle_cause_weight:5m))
              - max(bottomk(1, topk(2, gpu_idle_cause_weight:5m)))
            ) < 0.1
            and max(gpu_idle_cause_weight:5m) > 0.3
            and count(gpu_idle_cause_weight:5m) >= 2
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "GPU idle dominant cause ambiguous (top1 와 top2 격차 < 0.1)"
            description: "GPU idle dominant cause 의 top1 과 top2 weight 격차가 {{ $value | humanizePercentage }} 로 0.1 미만이며 top1 magnitude 는 0.3 초과 상태입니다. 자동 rule 의 dominant 선택이 noise 에 휘둘릴 위험이 있어 manual 진단 으로 전환이 필요합니다. gpu_idle_cause_weight_top3:5m 로 secondary cause 와 함께 비교하고 docs/observability/gpu-idle-dominant-cause.md 의 ambiguous 운영 워크플로 를 참조합니다."

        # VictimGPUIdleDominantCauseAmbiguous
        # #101 victim 단위 dominant cause ambiguous 상태 감지. cluster 단위 GPUIdleDominantCauseAmbiguous
        # 와 동일 패턴 을 victim 차원 으로 적용 해 victim 별 dominant cause 동률 을 잡는다. victim 별
        # ambiguous 가 다발 하면 cluster 단위 보다 먼저 발화 한다. labels 에 victim_namespace 와
        # victim_pod 를 보존 해 Alertmanager 가 victim 별 별도 alert 인스턴스 로 라우팅 한다.
        - alert: VictimGPUIdleDominantCauseAmbiguous
          expr: |
            (
              max by(node, victim_namespace, victim_pod) (topk by(node, victim_namespace, victim_pod) (1, pod:gpu_idle_cause_weight:5m))
              - max by(node, victim_namespace, victim_pod) (bottomk by(node, victim_namespace, victim_pod) (1, topk by(node, victim_namespace, victim_pod) (2, pod:gpu_idle_cause_weight:5m)))
            ) < 0.1
            and max by(node, victim_namespace, victim_pod) (pod:gpu_idle_cause_weight:5m) > 0.3
            and count by(node, victim_namespace, victim_pod) (pod:gpu_idle_cause_weight:5m) >= 2
          for: 5m
          labels:
            severity: warning
            component: correlation
          annotations:
            summary: "victim {{ $labels.victim_namespace }}/{{ $labels.victim_pod }} GPU idle dominant cause ambiguous"
            description: "victim {{ $labels.victim_namespace }}/{{ $labels.victim_pod }} 의 dominant cause top1 과 top2 weight 격차가 0.1 미만 이며 top1 magnitude 는 0.3 초과 상태입니다. victim 별 dashboard 의 cause weight stacked panel 로 secondary cause 와 의 격차 를 확인 합니다."

    # netobs-gpuobs.self-health.alerts 는 두 agent 자체의 운영 상태를 가시화한다. BPF 자원 포화 /
    # NVML 호출 실패 / informer staleness 같은 신호를 alert 로 노출해 데이터 품질 저하의 원인을
    # 데이터 자체보다 먼저 진단할 수 있게 한다. ObsAgentDown 은 verifier rejection / required attach
    # 실패 / agent crash 같은 fatal 케이스를 모두 cover 하고, ProgramUnavailable 두 종은 optional
    # attach 실패 (부분 실패) 를 cover 한다.
    - name: netobs-gpuobs.self-health.alerts
      interval: 30s
      rules:
        # ObsAgentDown
        # netobs-agent 또는 gpuobs-agent 인스턴스가 2 분 이상 scrape 실패 상태이면 발화. BPF object
        # 로드 실패 (verifier rejection 포함) / required kprobe attach 실패 / agent crash 같은 fatal
        # 케이스가 모두 본 alert 로 잡힌다. job 라벨이 어느 agent 인지 식별한다.
        - alert: ObsAgentDown
          expr: up{job=~"netobs-agent|gpuobs-agent"} == 0
          for: 2m
          labels:
            severity: critical
            component: observability
          annotations:
            summary: "{{ $labels.job }} on {{ $labels.instance }} is down"
            description: "{{ $labels.job }} on instance {{ $labels.instance }} has been unreachable for >= 2 minutes. Check pod status, BPF verifier output (kubectl logs), and required kprobe attach errors."

        # NetObsBpfProgramUnavailable
        # netobs optional kprobe 의 attach 실패가 5 분 이상 지속되면 발화. required attach 실패는
        # agent crash 로 이어져 ObsAgentDown 이 잡으므로 본 alert 는 부분 실패만 cover 한다.
        # #105 도입 후 본 alert 는 *현재 attach 미상태* 가시화 만 cover 하고 attach 실패 빈도 spike 는
        # NetObsBpfAttachFailureHigh 가 별도 cover 한다. 영구 실패 (program_loaded=0 지속) 와 transient
        # flap (실패 후 retry 성공) 의 구분이 두 alert 의 trigger 시점 차이로 가시화 된다.
        - alert: NetObsBpfProgramUnavailable
          expr: netobs_bpf_program_loaded == 0
          for: 5m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs BPF probe {{ $labels.symbol }} not attached on {{ $labels.instance }}"
            description: "Optional kprobe {{ $labels.symbol }} could not be attached on {{ $labels.instance }} (kernel build option or version difference). Receive-path or drop-path metrics may be missing. Inspect agent logs for the attach error message."

        # NetObsBpfAttachFailureHigh
        # #105 의 BPF program attach 실패 발생 을 5 분 윈도우 increase 로 감지 해 2 분 이상 지속 시 발화.
        # NetObsBpfProgramUnavailable 이 현재 attach 미상태 의 gauge 신호 라면 본 alert 는 startup 이후
        # attach 시도 의 실패 발생 신호 다. attach 시도 는 agent startup 시점 1 회 만 발생 하므로 rate 기반
        # 임계값 (예: > 0.1/s) 은 5 분 윈도우 에서 max 1/300=0.0033 으로 절대 발화 하지 않 는다. 본 alert 는
        # increase(...[5m]) > 0 으로 "직전 5 분 안 1 회 라도 실패" 를 단정 감지 한다. retry budget 안에서
        # transient flap 이 반복 되어도 마지막 시도 가 success 면 attach_total{result="failure"} 가 증가
        # 하지 않 으므로 영구 실패 만 본 alert 로 발화 된다. 라벨 partition (program) 으로 어느 program 의
        # 실패 가 발생 했는지 즉시 식별 가능.
        - alert: NetObsBpfAttachFailureHigh
          expr: sum by(program) (increase(netobs_bpf_program_attach_total{result="failure"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs BPF program {{ $labels.program }} attach failed {{ $value | humanize }} times in 5m"
            description: "BPF program {{ $labels.program }} attach has failed at least once in the last 5 minutes for 2 minutes (#105). Check netobs_bpf_program_attach_retry_total for the failure reason (symbol_not_found / kernel_version_mismatch / btf_missing / verifier_rejected / permission_denied / link_internal_error / other). Cross-reference with netobs_bpf_program_loaded for current state. See docs/netobs/bpf-self-health.md for the remediation matrix."

        # GPUObsCudaSymbolUnavailable
        # gpuobs uprobe 의 attach 실패가 5 분 이상 지속되면 발화. #41 의 기존 메트릭을 self-health
        # row 의 source 로 재사용해 신규 메트릭 도입을 회피한다. libcuda 심볼 (cu* prefix) 만 cover
        # 하고 libcudart 심볼 (cuda* prefix) 은 GPUOBS_CUDA_LIBCUDART_PATH 가 비어 있는 운영 의도
        # 케이스에서도 0 으로 emit 되어 false positive 가 되므로 본 alert 범위에서 제외한다.
        - alert: GPUObsCudaSymbolUnavailable
          expr: gpuobs_cuda_symbol_available{symbol!~"cuda.*"} == 0
          for: 5m
          labels:
            severity: warning
            component: gpuobs
          annotations:
            summary: "gpuobs CUDA symbol {{ $labels.symbol }} not attached on {{ $labels.instance }}"
            description: "Uprobe for {{ $labels.symbol }} could not be attached (libcuda ABI drift or capability gap). CUDA event metrics may be incomplete. Verify libcuda.so path and CAP_BPF / CAP_PERFMON / CAP_SYS_PTRACE on the daemonset pod."

        # NetObsAgentBpfDropsHigh
        # events ringbuf 가 가득 차서 reserve 가 실패한 비율이 2 분 이상 10/s 를 넘으면 발화.
        # userspace reader 가 producer 속도를 못 따라가는 신호이며 ringbuf 크기 또는 reader 처리량
        # 검토가 필요하다.
        - alert: NetObsAgentBpfDropsHigh
          expr: rate(netobs_bpf_ringbuf_drops_total[5m]) > 10
          for: 2m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs ringbuf drop rate {{ $value | humanize }}/s on {{ $labels.instance }}"
            description: "netobs events ringbuf reserve failed at >10/s for 2 minutes on {{ $labels.instance }}. The userspace reader is falling behind producers. Consider raising the ringbuf size in bpf/netlat.bpf.c or reducing event emit rate."

        # NetObsBpfMapUtilizationHigh
        # netobs_bpf_map_utilization_ratio 는 map 필터 없이 전역 임계라 refresher 가 노출하는 모든 map
        # (starts / pod_bytes / flow_bytes / netobs_drop_stacks) 의 현재 entry 수가 max_entries 의 80%
        # 를 5 분 이상 넘으면 발화한다. 특히 flow_bytes 는 5-tuple 키라 노드 규모에 비례해 차므로 (#351)
        # 본 alert 가 evict 임박의 주 감시 신호다. LRU evict 가 동작해 1.0 도달은 통상 일어나지 않지만
        # 0.8 안정 초과는 max_entries 가 워크로드 규모를 따라가지 못한다는 신호다. 수용 조건 ("80% 초과
        # 시 alert 정상 발화") 을 충족한다.
        - alert: NetObsBpfMapUtilizationHigh
          expr: netobs_bpf_map_utilization_ratio > 0.8
          for: 5m
          labels:
            severity: warning
            component: netobs
          annotations:
            summary: "netobs BPF map {{ $labels.map }} {{ $value | humanizePercentage }} full on {{ $labels.instance }}"
            description: "netobs BPF map {{ $labels.map }} on {{ $labels.instance }} has been >80% full for 5 minutes. LRU evict will start dropping older entries. Inspect max_entries in bpf/netlat.bpf.c and consider raising it."

        # GPUObsAgentNvmlErrorsHigh
        # NVML wrapper 호출 실패가 2 분 이상 1/s 를 넘으면 발화. NOT_SUPPORTED 같은 정상 케이스는
        # markUnsupported 캐싱이 첫 호출 이후 차단하므로 본 alert 가 발화하는 케이스는 driver issue,
        # GPU unresponsive, ECC / RM 버전 mismatch 같은 의미 있는 신호다.
        - alert: GPUObsAgentNvmlErrorsHigh
          expr: rate(gpuobs_nvml_errors_total[5m]) > 1
          for: 2m
          labels:
            severity: warning
            component: gpuobs
          annotations:
            summary: "gpuobs NVML call {{ $labels.call }} failing with {{ $labels.error_code }} on {{ $labels.instance }}"
            description: "gpuobs NVML wrapper call {{ $labels.call }} has been failing at >1/s for 2 minutes on {{ $labels.instance }} with error code {{ $labels.error_code }}. Inspect nvidia-smi, driver logs (dmesg), and GPU power / thermal state."

        # ObsAgentInformerStale
        # netobs 또는 gpuobs agent 의 kube informer 가 5 분 넘게 어떤 watch event 도 못 받으면 발화.
        # API server 단절 / RBAC 실수 / NetworkPolicy 차단 같은 케이스를 잡는다. 첫 이벤트 전 startup
        # 윈도우 fallback (agent 기동 시각) 이 본 임계 안에서는 자연 통과해 false positive 를 막는다.
        - alert: ObsAgentInformerStale
          expr: max by (job, instance) (netobs_informer_sync_lag_seconds or gpuobs_informer_sync_lag_seconds) > 300
          for: 5m
          labels:
            severity: critical
            component: observability
          annotations:
            summary: "{{ $labels.job }} informer stale {{ $value | humanizeDuration }} on {{ $labels.instance }}"
            description: "{{ $labels.job }} on {{ $labels.instance }} has not received any kube watch event for {{ $value | humanizeDuration }}. Check API server reachability, NetworkPolicy, and the agent ServiceAccount RBAC (pods/services/nodes watch verbs)."

        # #88 capacity-trends z-score anomaly alert 4종. 본 alert 군은 capacity planning 의 선행
        # 신호 (즉시 대응 불요 의 warning severity) 라 throttle 류 critical alert 와 component
        # 라벨로 분리한다 (gpuobs-capacity, netobs-capacity, cpu-capacity, memory-capacity). |z| > 3
        # 은 정규분포의 99.7% 신뢰구간 outside 라 normal shift 벗어난 usage pattern 을 의미하고,
        # 30 분 sustained 조건으로 일시적 spike 의 alert flapping 을 차단한다. baseline (30일 offset
        # 30일) 의 stddev 가 0 인 평탄 구간 은 record 자체가 미 emit 되어 alert 도 자연 통과한다.
        - alert: GPUUtilAnomalyDetected
          expr: abs(cluster:gpu_util_zscore:1h) > 3
          for: 30m
          labels:
            severity: warning
            component: gpuobs-capacity
          annotations:
            summary: "GPU utilization capacity anomaly (z={{ $value }})"
            description: "Cluster GPU utilization 의 z-score 가 30일 baseline 대비 |z|={{ $value }} 로 30 분 sustained 됐다. 99.7% 신뢰구간 outside (3-sigma rule) 의 normal shift 신호다. capacity-trends heatmap 패널에서 시간대 패턴을 확인하고 필요 시 GPU 자원 재할당 또는 워크로드 schedule 조정을 검토하라."

        - alert: NetworkUtilAnomalyDetected
          expr: abs(cluster:network_zscore:1h) > 3
          for: 30m
          labels:
            severity: warning
            component: netobs-capacity
          annotations:
            summary: "Network throughput capacity anomaly (z={{ $value }})"
            description: "Cluster network throughput score 의 z-score 가 30일 baseline 대비 |z|={{ $value }} 로 30 분 sustained 됐다. capacity-trends overlay 패널에서 시간대 분포를 확인하고 필요 시 NIC bandwidth 또는 Pod replica 재설정을 검토하라."

        - alert: CPUThrottleAnomalyDetected
          expr: abs(cluster:cpu_throttle_zscore:1h) > 3
          for: 30m
          labels:
            severity: warning
            component: cpu-capacity
          annotations:
            summary: "CPU throttle capacity anomaly (z={{ $value }})"
            description: "Cluster CPU CFS throttle ratio 의 z-score 가 30일 baseline 대비 |z|={{ $value }} 로 30 분 sustained 됐다. capacity-trends heatmap 패널에서 시간대 패턴을 확인하고 필요 시 CPU limit 상향 또는 워크로드 재배치를 검토하라."

        - alert: MemoryPressureAnomalyDetected
          expr: abs(cluster:memory_pressure_zscore:1h) > 3
          for: 30m
          labels:
            severity: warning
            component: memory-capacity
          annotations:
            summary: "Memory pressure capacity anomaly (z={{ $value }})"
            description: "Cluster memory working_set / limit ratio 의 z-score 가 30일 baseline 대비 |z|={{ $value }} 로 30 분 sustained 됐다. OOM 임박 위험 으로 memory limit 상향 또는 워크로드 재배치를 검토하라."

        # #89 resource-anomaly-spike z-score spike alert 4종. 본 alert 군은 #88 의 capacity-trends
        # alert (장기 capacity planning, 30분 sustained) 와 다른 즉시 RCA spike 감지 (5분 sustained)
        # 의도라 component 라벨을 *-anomaly 로 분리한다 (gpuobs-anomaly, netobs-anomaly, cpu-anomaly,
        # memory-anomaly). baseline window 7일 의 stddev 가 평탄한 케이스는 z-score record 자체가
        # 미 emit 되어 alert 도 자연 통과한다. |z| > 3 은 정규분포 의 99.7% 신뢰구간 outside (3-sigma
        # rule) 라 즉시 대응 필요 신호이지만 severity 는 warning 유지로 throttle 류 critical alert
        # 와 운영 채널 분리한다.
        - alert: GPUUtilSpikeDetected
          expr: abs(cluster:gpu_util_zscore:5m) > 3
          for: 5m
          labels:
            severity: warning
            component: gpuobs-anomaly
          annotations:
            summary: "GPU utilization spike (z={{ $value }})"
            description: "Cluster GPU utilization 의 5분 z-score 가 직전 7일 baseline 대비 |z|={{ $value }} 로 5분 sustained 됐다. 99.7% 신뢰구간 outside (3-sigma rule) 의 즉시 RCA spike 신호다. observability-overview 의 Resource anomaly spike row 에서 시점 확인 후 drill-down 으로 GPU 워크로드 의 root cause 추적 또는 워크로드 재배치를 검토 하라."

        - alert: NetworkDropSpikeDetected
          expr: abs(cluster:network_drop_zscore:5m) > 3
          for: 5m
          labels:
            severity: warning
            component: netobs-anomaly
          annotations:
            summary: "Network drop spike (z={{ $value }})"
            description: "Cluster network drop event rate 의 5분 z-score 가 직전 7일 baseline 대비 |z|={{ $value }} 로 5분 sustained 됐다. link quality 이상 또는 NIC saturation 의 즉시 RCA spike 신호다. netobs-overview 의 drop rate 패널에서 drop_category 별 분포 확인 후 drill-down 으로 root cause 추적 하라."

        - alert: CPUThrottleSpikeDetected
          expr: abs(cluster:cpu_throttle_zscore:5m) > 3
          for: 5m
          labels:
            severity: warning
            component: cpu-anomaly
          annotations:
            summary: "CPU throttle spike (z={{ $value }})"
            description: "Cluster CPU CFS throttle ratio 의 5분 z-score 가 직전 7일 baseline 대비 |z|={{ $value }} 로 5분 sustained 됐다. 즉시 RCA spike 신호 로 CPU limit 상향 또는 워크로드 재배치를 검토 하라."

        - alert: MemoryPressureSpikeDetected
          expr: abs(cluster:memory_pressure_zscore:5m) > 3
          for: 5m
          labels:
            severity: warning
            component: memory-anomaly
          annotations:
            summary: "Memory pressure spike (z={{ $value }})"
            description: "Cluster memory working_set / limit ratio 의 5분 z-score 가 직전 7일 baseline 대비 |z|={{ $value }} 로 5분 sustained 됐다. OOM 임박 즉시 RCA spike 신호 로 memory limit 상향 또는 워크로드 재배치를 검토 하라."

    # netobs-gpuobs.cross-correlation.recording 그룹은 #86 의 GPU-network cross-correlation 통합
    # 패널이 직접 참조하는 사전 집계 시계열을 둔다. 패널은 단일 timeseries 에 4 시계열 (GPU
    # utilization, GPU memory used ratio, network throughput, network p99 latency) 과 correlation
    # overlay 1 시리즈를 같은 timeline 에 정렬한다. dev cluster spike 결과 gpuobs_pod_* 의 Pod
    # scope utilization 이 NVML 비지원 환경 (RTX 3090 단일 GPU, MIG / MPS 미적용) 이라 산정 불가
    # 라 GPU 시계열은 device scope (node, gpu_uuid) 로 강등하고 network 시계열은 Pod scope (node,
    # src_namespace, src_pod, src_pod_uid) 그대로 둔다. 두 도메인의 join 은 같은 timeline 정렬만
    # 보장하며 Pod 단위 정합은 본 이슈 범위 밖이다. 본 group 의 4 record 모두 5 분 윈도우 평균 /
    # rate / histogram_quantile 산정이라 evaluation 직후 즉시 채워지지 않고 최소 5 분의 sample
    # 누적이 필요하다. Grafana 패널은 unit override (percentunit / bps / s) 로 SI prefix 자동 표기
    # 를 받으므로 본 record 의 raw 값을 그대로 query 단에서 참조한다.
    - name: netobs-gpuobs.cross-correlation.recording
      interval: 30s
      rules:
        # node:gpu_util_ratio:5m
        # device 단위 GPU utilization 의 5 분 평균을 0-1 스케일 percentunit 으로 변환. 기존
        # node:gpu_util_p95:5m 가 p95 percentile 이라 worst-case 신호인 반면 본 record 는 average
        # 신호로 GPU 의 sustained 부하 추세를 보여준다. cross-correlation 패널은 spike 보다 sustained
        # 추세 비교가 의도라 average 를 채택한다. 라벨 셋은 avg by(node, gpu_uuid, gpu_index) 로 명시
        # 고정해 job / instance / pod 같은 scrape 라벨을 drop 하고 device 단위 cardinality 만 노출한다.
        # 본 파일의 다른 node:* record (node:gpu_util_p95:5m 등) 와 동일한 by(...) 규약을 따른다.
        - record: node:gpu_util_ratio:5m
          expr: avg by(node, gpu_uuid, gpu_index) (avg_over_time(gpuobs_device_utilization_percent[5m])) / 100

        # node:gpu_memory_used_ratio:5m
        # device 단위 GPU memory used / total 의 5 분 평균. 0-1 percentunit 스케일. Pod scope GPU
        # memory ratio (pod:gpu_memory_utilization_ratio:5m) 가 base 시리즈 부재로 dev cluster 에서
        # 산출되지 않는 환경 한계를 우회하는 device scope fallback 이다. 분자 / 분모를 먼저 avg
        # by(node, gpu_uuid, gpu_index) 로 안정화해 scrape 라벨 (job, instance, pod 등) 을 사전 drop
        # 한 뒤 ratio 를 계산한다. 안정화 없이 raw 라벨로 division 하면 향후 라벨 추가 시 동일 device
        # 시그니처 가 다중 sample 로 분기 되어 many-to-many 매칭 에러 가 발생할 위험이 있다. 본 파일의
        # 다른 node:* record 와 동일한 by(...) 규약 및 cardinality 안정성 을 우선한다.
        - record: node:gpu_memory_used_ratio:5m
          expr: |
            avg by(node, gpu_uuid, gpu_index) (avg_over_time(gpuobs_device_memory_used_bytes[5m]))
            / on(node, gpu_uuid, gpu_index)
            avg by(node, gpu_uuid, gpu_index) (avg_over_time(gpuobs_device_memory_total_bytes[5m]))

        # pod:network_throughput_bps:5m
        # Pod 단위 양방향 network throughput 의 5 분 평균을 bits/sec 로 변환. 기존
        # pod:network_egress_rate:5m 가 egress 단방향 만 다루고 unit 이 bytes/sec 라 Grafana 의
        # bps 자동 SI prefix 표기 (Mbps / Gbps) 와 어울리지 않는다. 본 record 는 layer="l4" 의 ingress
        # + egress 합산을 8 배해 bps 로 직접 노출한다. Pod 라벨 셋은 (node, src_namespace, src_pod,
        # src_pod_uid) 유지.
        - record: pod:network_throughput_bps:5m
          expr: |
            sum by(node, src_namespace, src_pod, src_pod_uid) (
              rate(netobs_pod_bytes_total{layer="l4"}[5m])
            ) * 8

        # pod:network_p99_latency_seconds:5m
        # Pod 단위 stage latency 의 5 분 윈도우 p99. histogram_quantile 의 le 합산을 Pod 라벨 셋
        # 차원으로 두어 stage 별 분리 없이 Pod 단위 latency 의 worst-case 신호를 단일 시계열로
        # 노출한다. cross-correlation 패널 의 의도는 network pressure 신호 한 가지이므로 stage 분
        # 리 (rcv / xmit / retrans 등) 는 후속 drill-down 자리 (netobs-overview dashboard) 에 위임.
        - record: pod:network_p99_latency_seconds:5m
          expr: |
            histogram_quantile(0.99,
              sum by(le, node, src_namespace, src_pod, src_pod_uid) (
                rate(netobs_pod_stage_latency_labeled_seconds_bucket[5m])
              )
            )

        # pod:gpu_network_correlation_score:5m (#120)
        # GPU 사용률과 network 대역폭의 Pod 단위 동조 강도 score. pod:gpu_util_p95:5m 를 100 으로 나눠
        # 0-1 비율 로 정규화 한 GPU factor 와 pod:network_throughput_bps:5m 를 netobs_node_nic_capacity_
        # bytes_per_sec * 8 (bytes/sec 의 bps 환산) 으로 나눠 0-1 점유율 로 정규화 한 network factor
        # 의 곱 형태 다. clamp_max 로 점유율 1.0 상한 두어 burst 시 score 폭주 차단. 라벨 셋은
        # 4 Pod 라벨 join key (node, src_namespace, src_pod, src_pod_uid) 로 두 도메인 정합 한다.
        # gpu_uuid 는 max by 로 GPU 1 개 이상 사용 Pod 의 worst GPU 채택 후 라벨에서 drop. 외부 곱셈은
        # LHS 와 RHS 가 4 Pod 라벨 셋 동일 한 1-to-1 매칭 이라 on(...) 만 사용. 내부 분모 분기 의
        # / on(node) group_left() 는 4 라벨 LHS 와 1 라벨 RHS 의 many-to-one 매칭 이라 그대로 유지.
        - record: pod:gpu_network_correlation_score:5m
          expr: |
            (
              max by(node, src_namespace, src_pod, src_pod_uid) (pod:gpu_util_p95:5m) / 100
            )
            * on(node, src_namespace, src_pod, src_pod_uid)
            clamp_max(
              pod:network_throughput_bps:5m
                / on(node) group_left()
                (netobs_node_nic_capacity_bytes_per_sec * 8),
              1.0
            )

    # netobs-gpuobs.capacity-trends.recording 그룹은 #88 의 capacity-trends 패널이 직접 참조하는
    # 1시간 윈도우 사전 집계와 z-score 시계열을 둔다. 패널은 4 도메인 (GPU utilization, network
    # throughput, CPU throttle, memory pressure) 의 4주 heatmap (요일 x 시간대) 과 multi-series
    # overlay 그리고 30일 baseline 대비 z-score 를 같은 row 에 정렬한다. PromQL 단에서 day_of_week
    # 와 hour_of_day 를 라벨로 부착하는 trick 은 label_replace 의 src_label 제약 으로 불가하므로
    # raw 1시간 aggregate 만 emit 하고 Grafana heatmap panel 의 calculate=true 옵션과 timezone
    # Asia/Seoul 설정으로 X축 (hour-of-day) 과 Y축 (day-of-week) 변환을 dashboard 단에서 처리한다.
    # 본 group 의 4 avg record 는 30s 평가 cycle 이지만 expr 자체가 1시간 윈도우 평균이라 evaluation
    # 직후 즉시 채워지고 30일 / 60일 retention 정합은 Commit 1 의 60일 retention 상향에 의존한다.
    # z-score 4종 은 (stddev > 0) 가드 와 clamp(-5, 5) 로 NaN 과 +Inf 시각화 잡음을 차단한다.
    - name: netobs-gpuobs.capacity-trends.recording
      interval: 1m
      rules:
        # cluster:gpu_util_1h_avg
        # cluster 단위 GPU utilization 의 1시간 평균. 4주 heatmap 과 multi-series overlay 의 base
        # 시계열로 사용된다. cluster scope 라 노드 차이를 drop 하는 max by() 로 cluster 전체 worst-case 의 부하
        # 추세 를 단일 시리즈로 노출 한다.
        - record: cluster:gpu_util_1h_avg
          expr: max by() (avg_over_time(gpuobs_device_utilization_percent[1h]))

        # cluster:network_1h_avg
        # cluster 단위 network throughput score 의 1시간 평균 (0-1 percentunit). 기존
        # pod:network_throughput_score:5m 의 1시간 윈도우 확장 형태. heatmap 표시를 위해 cluster
        # max 채택.
        - record: cluster:network_1h_avg
          expr: max by() (avg_over_time(pod:network_throughput_score:5m[1h]))

        # cluster:cpu_throttle_1h_avg
        # cluster 단위 CPU CFS throttle 비율의 1시간 평균. capacity planning 의 4 도메인 통합 시각
        # 화 를 위해 GPU / network 와 동일 패턴 적용. 본 record 가 0.3 이상 sustained 면 cluster 전체
        # CPU limit 재조정 신호.
        - record: cluster:cpu_throttle_1h_avg
          expr: max by() (avg_over_time(pod:cpu_throttle_score:5m[1h]))

        # cluster:memory_pressure_1h_avg
        # cluster 단위 memory working_set / limit 비율의 1시간 평균. 0.9 이상 sustained 면 OOM 임박
        # 신호. capacity planning 의 4 도메인 중 마지막 도메인 으로 동일 패턴 적용.
        - record: cluster:memory_pressure_1h_avg
          expr: max by() (avg_over_time(pod:memory_pressure_score:5m[1h]))

        # cluster:gpu_util_zscore:1h
        # 30일 baseline (avg + stddev) 대비 current 1시간 평균 의 z-score. baseline window 가 평탄
        # 한 케이스 (stddev=0) 는 (stddev > 0) 가드 로 시리즈 미-emit 처리 해 NaN 방지하고, +Inf
        # 시각화 잡음 차단 을 위해 clamp(-5, 5) 로 산출 범위 제한 한다. |z| > 3 임계 는 99.7%
        # 신뢰구간 outside (3-sigma rule) 라 capacity-trends alert (Commit 4) 의 발화 조건 이다.
        - record: cluster:gpu_util_zscore:1h
          expr: |
            clamp(
              (
                cluster:gpu_util_1h_avg
                - avg_over_time(cluster:gpu_util_1h_avg[30d] offset 30d)
              )
              / (stddev_over_time(cluster:gpu_util_1h_avg[30d] offset 30d) > 0),
              -5, 5
            )

        # cluster:network_zscore:1h
        # network throughput score 의 z-score. 동일 패턴.
        - record: cluster:network_zscore:1h
          expr: |
            clamp(
              (
                cluster:network_1h_avg
                - avg_over_time(cluster:network_1h_avg[30d] offset 30d)
              )
              / (stddev_over_time(cluster:network_1h_avg[30d] offset 30d) > 0),
              -5, 5
            )

        # cluster:cpu_throttle_zscore:1h
        # CPU throttle 의 z-score. 동일 패턴.
        - record: cluster:cpu_throttle_zscore:1h
          expr: |
            clamp(
              (
                cluster:cpu_throttle_1h_avg
                - avg_over_time(cluster:cpu_throttle_1h_avg[30d] offset 30d)
              )
              / (stddev_over_time(cluster:cpu_throttle_1h_avg[30d] offset 30d) > 0),
              -5, 5
            )

        # cluster:memory_pressure_zscore:1h
        # memory pressure 의 z-score. 동일 패턴.
        - record: cluster:memory_pressure_zscore:1h
          expr: |
            clamp(
              (
                cluster:memory_pressure_1h_avg
                - avg_over_time(cluster:memory_pressure_1h_avg[30d] offset 30d)
              )
              / (stddev_over_time(cluster:memory_pressure_1h_avg[30d] offset 30d) > 0),
              -5, 5
            )

    # netobs-gpuobs.resource-anomaly-spike.recording 그룹은 #89 의 즉시 spike 감지용 5분 윈도우
    # z-score 시계열을 둔다. #88 capacity-trends 의 1시간 윈도우 z-score (장기 capacity planning)
    # 와 시간 척도를 분리해 record 명에 :5m suffix 를 명시하고 baseline window 도 [7d] offset 7d
    # 로 축소해 단기 spike 감지 의도를 강화한다. 4 도메인 (GPU util, network drop, CPU throttle,
    # memory pressure) 의 base avg / rate 4종 과 z-score 4종 을 동시 emit 한다. base 도메인 은 capacity
    # 의 health 신호 와 다른 raw spike 신호 라 network 는 throughput score 가 아닌 drop rate 를
    # 직접 채택한다. z-score 4종 모두 (stddev > 0) 가드와 clamp(-5, 5) 적용 으로 NaN 과 +Inf 시각화
    # 잡음을 차단한다. baseline window 7일 누적 부족 케이스 (신규 배포 직후) 는 stddev 가드로 record
    # 자체 미 emit 되어 graceful degradation 처리.
    - name: netobs-gpuobs.resource-anomaly-spike.recording
      interval: 30s
      rules:
        # cluster:gpu_util_5m_avg
        # cluster 단위 GPU utilization 의 5분 평균. spike 감지 용 baseline 시리즈. 1시간 평균
        # (cluster:gpu_util_1h_avg) 과 시간 윈도우 만 다르고 동일 base 메트릭 채택.
        - record: cluster:gpu_util_5m_avg
          expr: max by() (avg_over_time(gpuobs_device_utilization_percent[5m]))

        # cluster:network_drop_5m_rate
        # cluster 단위 network drop event 의 5분 rate. capacity-trends 의 network throughput
        # score 와 다른 신호 도메인 으로 drop rate 자체를 직접 채택해 link quality 이상 의 raw
        # spike 감지가 가능하다. drop_category 와 src_namespace 차원은 sum by() 로 cluster scope
        # 단일 시리즈로 축약 한다.
        - record: cluster:network_drop_5m_rate
          expr: sum by() (rate(netobs_drop_events_labeled_total[5m]))

        # cluster:cpu_throttle_5m_avg
        # cluster 단위 CPU CFS throttle 비율의 5분 평균. cluster:cpu_throttle_1h_avg 와 윈도우
        # 만 다른 동일 base 메트릭 (pod:cpu_throttle_score:5m) 채택.
        - record: cluster:cpu_throttle_5m_avg
          expr: max by() (avg_over_time(pod:cpu_throttle_score:5m[5m]))

        # cluster:memory_pressure_5m_avg
        # cluster 단위 memory working_set / limit 비율의 5분 평균. capacity-trends 패턴 정합 으로
        # 본 이슈 명시 3 도메인 외 추가 4번째 도메인 으로 #88 의 4 도메인 (GPU/network/CPU/memory)
        # 일관성 확보. OOM 임박 spike 의 즉시 감지 용도.
        - record: cluster:memory_pressure_5m_avg
          expr: max by() (avg_over_time(pod:memory_pressure_score:5m[5m]))

        # cluster:gpu_util_zscore:5m
        # 직전 7일 baseline (avg + stddev offset 5m) 대비 현재 5분 평균의 z-score. baseline window
        # offset 5m 은 직전 5분 부터 7일치 데이터 를 baseline 으로 채택해 docs 의 "직전 7일 baseline"
        # 표현과 정합하고 5분 윈도우 즉시 spike 감지 의도 와 일관성 확보. 평탄 baseline (stddev=0)
        # 케이스 의 spike 감지 불가 risk 차단 위해 clamp_min 으로 stddev 최소값 (도메인별 floor) 보장.
        # GPU util 의 floor=1 은 1% 의 최소 변동 stddev 보장 으로 정상 GPU 사용 변동 의 lower bound.
        # clamp(-5, 5) 는 +Inf 시각화 잡음 차단 의 안전 가드.
        - record: cluster:gpu_util_zscore:5m
          expr: |
            clamp(
              (
                cluster:gpu_util_5m_avg
                - avg_over_time(cluster:gpu_util_5m_avg[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:gpu_util_5m_avg[7d] offset 5m), 1),
              -5, 5
            )

        # cluster:network_drop_zscore:5m
        # network drop rate 의 z-score. drop 이 정상 상황 에 0 으로 유지 되는 케이스 가 많아
        # baseline stddev=0 위험 가장 높다. floor=0.1 (event/s) 로 평탄 baseline 시에도 spike
        # 감지 가능 보장.
        - record: cluster:network_drop_zscore:5m
          expr: |
            clamp(
              (
                cluster:network_drop_5m_rate
                - avg_over_time(cluster:network_drop_5m_rate[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:network_drop_5m_rate[7d] offset 5m), 0.1),
              -5, 5
            )

        # cluster:cpu_throttle_zscore:5m
        # CPU throttle 의 z-score. throttle 비율 (0-1) 이 정상 상황에 0 인 케이스 baseline 평탄
        # 위험 차단 위해 floor=0.01 (1% throttle ratio) 적용.
        - record: cluster:cpu_throttle_zscore:5m
          expr: |
            clamp(
              (
                cluster:cpu_throttle_5m_avg
                - avg_over_time(cluster:cpu_throttle_5m_avg[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:cpu_throttle_5m_avg[7d] offset 5m), 0.01),
              -5, 5
            )

        # cluster:memory_pressure_zscore:5m
        # memory pressure 의 z-score. memory 사용량 이 일정 하게 유지 되는 케이스 baseline 평탄
        # 위험 차단 위해 floor=0.01 (1% memory ratio) 적용.
        - record: cluster:memory_pressure_zscore:5m
          expr: |
            clamp(
              (
                cluster:memory_pressure_5m_avg
                - avg_over_time(cluster:memory_pressure_5m_avg[7d] offset 5m)
              )
              / clamp_min(stddev_over_time(cluster:memory_pressure_5m_avg[7d] offset 5m), 0.01),
              -5, 5
            )
