# #410 CAP_SYS_PTRACE 제거 patch. capabilities.add 를 BPF 와 PERFMON 2종으로 교체한다. strategic
# merge 는 list 를 교체로 처리하므로 add 목록 전체를 다시 적는다.
#
# 영향: multi-GPU 노드에서 non-root 워크로드의 NVIDIA_VISIBLE_DEVICES 를 읽지 못해 ordinal 과 UUID
# 매핑이 best-effort 로 떨어진다. /proc/<pid>/cgroup (mode 0444) 기반 Pod 귀속과 NVML device 메트릭은
# 영향받지 않는다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpuobs-agent
  namespace: ebpf-project
spec:
  template:
    spec:
      containers:
        - name: gpuobs-agent
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - PERFMON
