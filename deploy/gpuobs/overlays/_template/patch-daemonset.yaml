# 클러스터별 GPU 노드 대상과 폴링 튜닝 자리 (#289). prod overlay 와 동일한 라벨 스킴을 기본으로
# 두고, 필요 시 클러스터 정책에 맞게 조정한다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpuobs-agent
  namespace: ebpf-project
spec:
  template:
    spec:
      # GPU 노드 중 observability 활성화 라벨이 있는 fleet 에 배포한다. accelerator=nvidia 가
      # control-plane 을 자연 제외하므로 별도 affinity 는 두지 않는다.
      nodeSelector:
        accelerator: nvidia
        observability.netobs/enabled: "true"
      containers:
        - name: gpuobs-agent
          imagePullPolicy: IfNotPresent
          env:
            # CHANGEME: NVML 폴링 주기. GPU 수가 많은 노드에서 폴링 비용이 크면 늘린다 (기본 5s).
            - name: GPU_POLL_INTERVAL
              value: "5s"
            # CUDA/NCCL 라이브러리 경로는 미지정 시 배포판별 후보 (Debian multiarch, RHEL lib64,
            # GPU Operator driver 컨테이너) 를 자동 순회한다 (#296). 후보 밖 특수 경로만 아래처럼
            # 고정한다 (컨테이너 내 /host 프리픽스 기준).
            # - name: GPUOBS_CUDA_LIBCUDA_PATH
            #   value: "/host/usr/lib/x86_64-linux-gnu/libcuda.so.1"
            # - name: GPUOBS_NCCL_LIB_PATH
            #   value: "/host/usr/lib/x86_64-linux-gnu/libnccl.so.2"
