apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ebpf-project 네임스페이스는 netobs base 가 이미 생성하므로 본 base 는 namespace 리소스를 별도로
# 두지 않는다. rca-summarizer 단독 deploy 는 운영상 발생하지 않으며 netobs / gpuobs / correlation
# deploy 가 선행됨을 전제한다.
namespace: ebpf-project

resources:
  - alertmanagerconfig.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
