# #234 Alertmanager → rca-summarizer webhook 라우팅. kube-prometheus-stack 의 Alertmanager CR 이
# `alertmanagerConfigSelector: {}` 라 본 CRD 는 자동 선택된다. 단 AlertmanagerConfig 는 기본
# (OnNamespace) 전략에서 자기 네임스페이스 matcher 를 강제하는데, 관측 alert 의 namespace 라벨은
# victim pod 네임스페이스를 따르거나 없어서 매칭이 깨진다. 따라서 Alertmanager CR 에
# `alertmanagerConfigMatcherStrategy: {type: None}` 적용이 선행돼야 한다 (아래 kubectl patch 1회).
#
#   kubectl -n monitoring patch alertmanager kube-prometheus-stack-alertmanager \
#     --type merge -p '{"spec":{"alertmanagerConfigMatcherStrategy":{"type":"None"}}}'
#
# 라우팅 매처는 관측 rule 전반이 부여하는 component 라벨로 잡아 Watchdog 같은 스택 기본 alert 를
# 제외한다. resolved 알림도 전달해 (sendResolved) webhook 이 상태 전이를 인지할 수 있게 한다.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: rca-summarizer
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: rca-summarizer
    app.kubernetes.io/part-of: ebpf-project
spec:
  route:
    receiver: rca-summarizer
    matchers:
      - name: component
        matchType: "=~"
        value: "correlation|netobs|gpuobs|observability|cpu|memory|prometheus"
    groupBy: ["alertname"]
    groupWait: 15s
    groupInterval: 1m
    repeatInterval: 30m
  receivers:
    - name: rca-summarizer
      webhookConfigs:
        - url: "http://rca-summarizer.ebpf-project.svc.cluster.local:9850/webhook"
          sendResolved: true
