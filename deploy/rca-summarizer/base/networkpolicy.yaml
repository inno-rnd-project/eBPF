# rca-summarizer 는 무인증 POST /webhook 을 노출하므로 (#419) 네트워크 계층에서 접근 출처를
# 한정한다. 관측 스택의 netobs (#357) / gpuobs (#281) / correlation-exporter (#217) NetworkPolicy
# 규약과 동일 구조다. 허용 출처는 두 갈래다.
#   - monitoring namespace: Alertmanager 의 webhook 발신과 Prometheus 의 /metrics scrape
#   - 동일 namespace 의 correlation-exporter: GET /rca 프록시 (#234, 프론트엔드의 단일 진입점)
# 무인증 + NetworkPolicy 모델은 correlation API 와 동일 기조로 유지하며 (이슈 비목표), egress 는
# 범위 외라 제한하지 않는다 (policyTypes 에 Egress 미포함). kubelet probe 는 로컬 노드 host 발신
# 이라 정책과 무관하게 허용된다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rca-summarizer
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: rca-summarizer
    app.kubernetes.io/part-of: ebpf-project
    app.kubernetes.io/component: rca-summarizer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rca-summarizer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: correlation-exporter
      ports:
        - port: 9850
          protocol: TCP
