apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rca-summarizer
  namespace: ebpf-project
  labels:
    # release 라벨은 kube-prometheus-stack Prometheus 인스턴스의 serviceMonitorSelector 에 매치되도록
    # 둔다. helm release 이름이 다른 환경은 overlay 의 ServiceMonitor patch 로 본 라벨을 덮는다.
    release: kube-prometheus-stack
    app.kubernetes.io/name: rca-summarizer
    app.kubernetes.io/part-of: ebpf-project
spec:
  namespaceSelector:
    matchNames:
      - ebpf-project
  selector:
    matchLabels:
      app.kubernetes.io/name: rca-summarizer
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # #178 stale 시리즈 근본 정리. rca-summarizer 는 단일 replica Deployment 라 pod/instance 를 drop
      # 해도 collision 이 없고, 재시작 시 바뀌던 pod/instance stale churn 만 제거된다.
      metricRelabelings:
        - regex: pod|instance
          action: labeldrop
