apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netobs-agent
  namespace: ebpf-project
spec:
  template:
    spec:
      # control-plane 포함 여부는 opt-in 라벨로 결정한다 (#341). affinity 이중 잠금은 제거됐고
      # base 의 toleration 은 스케줄 허용만 한다.
      nodeSelector:
        observability.netobs/enabled: "true"
      containers:
        - name: netobs-agent
          imagePullPolicy: IfNotPresent
