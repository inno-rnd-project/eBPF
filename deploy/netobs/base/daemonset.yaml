apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netobs-agent
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: netobs-agent
    app.kubernetes.io/part-of: ebpf-project
    app.kubernetes.io/component: network-observer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netobs-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netobs-agent
        app.kubernetes.io/part-of: ebpf-project
        app.kubernetes.io/component: network-observer
    spec:
      serviceAccountName: netobs-agent
      hostPID: true
      containers:
        - name: netobs-agent
          image: netobs-agent
          imagePullPolicy: IfNotPresent
          args:
            - "-listen"
            - ":9810"
            - "-print-events=false"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBE_METADATA_REFRESH
              value: "30s"
            - name: DROP_REASON_FORMAT_PATH
              value: "/sys/kernel/tracing/events/skb/kfree_skb/format"
            # #83 drop event 의 kernel stack capture 가 사용 하는 kallsyms 경로 다. host 의
            # /proc/kallsyms 를 그대로 bind mount 해 container 의 /host/proc/kallsyms 로 노출 하고
            # 본 env 로 명시적 으로 가리켜 future container runtime 변경 / PID namespace 격리 변경
            # 에도 의존성 이 안정적 으로 유지 되게 한다.
            - name: NETOBS_KALLSYMS_PATH
              value: "/host/proc/kallsyms"
            # #193 pod 간 flow 토폴로지 API 의 소스 netobs_flow_bytes_total 을 emit 할 src namespace
            # allow-list 다. flow 메트릭은 기본 off 이며 본 목록의 namespace 에서 출발하는 5-tuple flow
            # 만 emit 한다. cardinality 는 FlowGuard 의 LRU (NETOBS_FLOW_MAX_ACTIVE 기본 1024) 로 제한된다.
            - name: NETOBS_FLOW_ALLOW_NAMESPACES
              value: "ebpf-project,correlation-stress,default"
          ports:
            - name: metrics
              containerPort: 9810
              protocol: TCP
          # #216 privileged 를 제거하고 drop ALL 후 최소 capabilities 로 축소한다. BPF 는 bpf()
          # syscall (프로그램 로드와 map), PERFMON 은 kprobe/kretprobe 의 perf_event_open, SYSLOG 는
          # kptr_restrict=1 상태에서 /proc/kallsyms 실주소 읽기 (drop stack symbol resolve) 에 필요하다.
          # SYS_ADMIN 은 Ubuntu 커널 전용 kernel.perf_event_paranoid=4 대응이다. 이 레벨은 CAP_PERFMON
          # 까지 무력화해 perf_kprobe PMU 생성이 permission denied 로 실패함을 dev canary 에서 실측했다
          # (표준 커널 의 paranoid<=2 환경 에서는 SYS_ADMIN 없이 PERFMON 만으로 충분해 제거 가능하다).
          # RemoveMemlock 은 kernel 5.11+ 의 memcg 기반 BPF 계정 감지 시 no-op 이라 CAP_SYS_RESOURCE 가
          # 불필요하고, cgroup 기반 Pod 귀속이라 gpuobs 의 CAP_SYS_PTRACE 도 불필요하다.
          # readOnlyRootFilesystem 은 BPF 산출물이 바이너리에 임베드되고 로그가 stdout 이라 디스크
          # 쓰기가 없어 함께 강화한다. privileged 대비 전체 capability 와 장치 접근, LSM/seccomp 해제가
          # 사라져 blast radius 가 명시된 4 종 으로 한정된다.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # seccomp 를 암묵 상태 (kubelet seccompDefault 의존) 로 두지 않고 RuntimeDefault 로 명시
            # 고정한다. 런타임 기본 프로파일은 bpf 와 perf_event_open 을 capability 게이팅으로 허용
            # (CAP_BPF / CAP_PERFMON / CAP_SYS_ADMIN 보유 시) 하므로 아래 add 집합과 함께 정상
            # 동작함을 dev canary 의 attach 전수로 실측했다. kubelet 이 향후 seccompDefault 를 켜도
            # 동작이 변하지 않는다.
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - PERFMON
                - SYSLOG
                - SYS_ADMIN
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # #216 map/link pin 을 쓰지 않아 (fd 기반 lifetime) 쓰기가 불필요해 read-only 로 강등한다.
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
              readOnly: true
            - name: sys-kernel-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: sys-kernel-tracing
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            # #83 drop stack capture 의 userspace symbol resolver 가 사용 하는 host /proc/kallsyms
            # 의 read-only bind mount 다. privileged 컨테이너 의 CAP_SYSLOG 로 kptr_restrict=1
            # 상태 에서도 실제 주소 reading 이 가능 함을 dev cluster 에서 사전 검증 했다.
            - name: host-proc-kallsyms
              mountPath: /host/proc/kallsyms
              readOnly: true
            # #228 cgroup id 역매핑 스캐너가 pod 슬라이스 디렉터리 inode 를 stat 하는 host cgroup2
            # 계층의 read-only bind mount 다. gpuobs-agent 의 동일 마운트와 같은 구성이다.
            - name: host-sys-fs-cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: sys-kernel-btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: sys-kernel-tracing
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: host-proc-kallsyms
          hostPath:
            path: /proc/kallsyms
            type: File
        - name: host-sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory