apiVersion: v1
kind: Namespace
# #410 PSA 단계 하향. warn 과 audit 을 baseline 으로 조여 위반 워크로드를 수집하고, enforce 는
# privileged 를 유지한다. agent 2종이 hostPID: true 를 요구하는데 이는 baseline 위반이라 enforce 를
# baseline 으로 내리면 agent pod 자체가 admission 에서 거부된다. enforce 하향은 agent 를 별도
# namespace 로 분리하거나 API server 의 PSA exemption 을 두는 선행 작업이 필요해 후속으로 분리한다.
# warn/audit 단계에서 correlation-exporter 와 workload-injector 가 생성하는 부하 pod 의 위반이
# 이벤트와 kubectl 경고로 드러나므로, 그 목록을 근거로 baseline 준수 스펙으로 좁힌 뒤 enforce 를
# 내린다.
metadata:
  name: ebpf-project
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    app.kubernetes.io/part-of: ebpf-project
