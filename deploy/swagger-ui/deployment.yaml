# 이슈 #100 의 자체 dashboard 용 REST API layer 의 Swagger UI 진입점. swaggerapi/swagger-ui 공식
# image 가 URLS 환경 변수 로 spec 표시를 native 지원 한다. netobs 와 gpuobs 의 REST API 는 미사용
# scaffold 라 #171 에서 제거 했고, REST API 는 소비처 (injector) 가 있는 correlation-exporter 만
# 유지 한다. 따라서 본 URLS 는 correlation-exporter 의 /api/v1/swagger.json 만 등록 한다. correlation
# 의 개별 swagger UI (/api/v1/swagger/index.html) 도 그대로 유지 되므로 본 Pod 는 보조 진입점 이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: api-docs
    app.kubernetes.io/part-of: ebpf-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swagger-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swagger-ui
        app.kubernetes.io/component: api-docs
        app.kubernetes.io/part-of: ebpf-project
    spec:
      containers:
        - name: swagger-ui
          image: swaggerapi/swagger-ui:v5.18.2
          ports:
            - containerPort: 8080
              name: http
          env:
            # URLS 는 multi-spec dropdown 의 source URL 목록이다. 동일 namespace 의 Service 숏네임
            # 으로 접근해 namespace 하드코딩을 회피한다. 본 swagger-ui Pod 가 ebpf-project 외 다른
            # namespace 로 배포되면 deployment 자체 가 함께 그 namespace 의 agent Service 를 가리키게
            # 된다. port-forward 통한 로컬 브라우저 접근 시 dropdown 에서 spec 로드 가 실패 하는데
            # 이는 cluster DNS 미해석 한계 라 별도 ingress 또는 cluster 내부 접근 권장 (README 참조).
            - name: URLS
              value: >-
                [{"url":"http://correlation-exporter:9830/api/v1/swagger.json","name":"correlation"}]
            - name: URLS_PRIMARY_NAME
              value: "correlation"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
