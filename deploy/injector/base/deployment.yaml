apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-injector-controller
  namespace: ebpf-project
  labels:
    app.kubernetes.io/name: workload-injector
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: ebpf-project
spec:
  # leader election 으로 단일 active controller 가 보장 되므로 replica 는 1 로 고정 한다. multi
  # replica HA 는 본 이슈 비목표 다 (leader election 이 standby replica 의 의미를 갖지만 본 controller
  # 의 blocking reconcile 특성 상 hot-standby 가치가 낮다).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-injector
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-injector
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: workload-injector
      containers:
        - name: controller
          image: workload-injector
          imagePullPolicy: IfNotPresent
          # -mode=controller 로 분기. CLI 전용 flag 는 받지 않으며 controller 전용 flag 만 노출.
          args:
            - "-mode=controller"
            - "-controller-metrics-addr=:9841"
            - "-controller-health-addr=:9842"
            - "-controller-leader-election=true"
            - "-controller-leader-election-namespace=ebpf-project"
          env:
            # CheckClusterLabel 의 prod cluster 차단 게이트. 본 라벨 매칭 Node 가 cluster 에 없으면
            # reconcile 이 fail-fast 한다. dev cluster 의 어떤 노드 라도 environment=dev 라벨 을
            # 가지고 있어야 controller 가 동작 한다.
            - name: INJECTOR_ALLOW_CLUSTER_LABEL
              value: "environment=dev"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            # scoreTrigger 평가 시 correlation 간섭 score snapshot 을 조회 할 exporter base URL.
            - name: CORRELATION_URL
              value: "http://correlation-exporter.ebpf-project.svc.cluster.local:9830"
          ports:
            - name: metrics
              containerPort: 9841
              protocol: TCP
            - name: health
              containerPort: 9842
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
