apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workload-injector
  namespace: ebpf-project
  labels:
    # release 라벨은 podmonitor.yaml 과 동일하게 kube-prometheus-stack 의 ruleSelector 에 매칭되도록
    # 둔다. helm release 이름이 다른 환경은 overlay 의 patch 로 본 라벨을 덮는다.
    release: kube-prometheus-stack
    app.kubernetes.io/name: workload-injector
    app.kubernetes.io/component: prometheus-rules
    app.kubernetes.io/part-of: ebpf-project
spec:
  groups:
    # workload-injector.alerts 는 injection 의 정상 / 비정상 lifecycle 과 blast radius 가시성을 둔다.
    - name: workload-injector.alerts
      # #412 전역 기본값 의존이던 평가 주기를 명시한다 (kube-prometheus-stack 기본 30s 동일).
      interval: 30s
      # #412 rule 산출 시리즈 폭주 backstop. 초과 시 그룹 평가가 실패로 기록되어 폭주가
      # 조용히 스토리지를 채우는 대신 가시화된다. 현행 최대 그룹이 수백 시리즈라 2000 은
      # 정상 운영에 닿지 않는다.
      limit: 2000
      rules:
        # InjectorActive
        # injector_active == 1 가 30 초 지속 시 정보성 알림. 운영자가 injection 실행 사실을 즉시
        # 감지해 모니터링 / 결과 검증 흐름으로 전환 가능하다. 부하 종료 후 active=0 reset 으로 자동
        # 해소된다.
        - alert: InjectorActive
          expr: |
            injector_active == 1
          for: 30s
          labels:
            severity: info
            component: injector
          annotations:
            summary: "workload-injector active (target={{ $labels.target_namespace }}/{{ $labels.target_pod }}@{{ $labels.target_node }} kind={{ $labels.kind }})"
            description: "workload-injector 가 target {{ $labels.target_namespace }}/{{ $labels.target_pod }} 노드 {{ $labels.target_node }} 에 {{ $labels.kind }} 부하를 발사 중이다. internal/injector/README.md 의 runbook 절차를 참고한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/injector/README.md#injectoractive"

        # BlastRadiusHigh
        # correlation_blast_radius_score 가 0.5 를 5 분 지속 시 발화. group 키에서 target_node 와
        # victim_pod_uid 를 제외해 동일 페어가 Pod 재시작 전후로 중복 발화하지 않게 한다.
        - alert: BlastRadiusHigh
          expr: |
            max by (target_namespace, target_pod, kind, victim_namespace, victim_pod) (
              correlation_blast_radius_score
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            component: injector
          annotations:
            summary: "high blast radius (target={{ $labels.target_namespace }}/{{ $labels.target_pod }} victim={{ $labels.victim_namespace }}/{{ $labels.victim_pod }} kind={{ $labels.kind }})"
            description: "target {{ $labels.target_namespace }}/{{ $labels.target_pod }} 의 {{ $labels.kind }} 부하가 victim {{ $labels.victim_namespace }}/{{ $labels.victim_pod }} 의 latency 를 baseline 대비 {{ $value }} 이상 증가시켰다. 합성 부하의 영향 범위가 예상보다 큰 경우이거나 victim 측 운영 워크로드에 영향을 주는 신호다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/injector/README.md#blastradiushigh"

        # InjectorStuck
        # injector_active == 1 가 35 분 지속 시 발화. binary 의 DurationLimit (30 분) + linger (30 초)
        # 를 모두 넘어가는 시간이라 정상 lifecycle 에서는 절대 발생하지 않는다. cleanup 실패 또는
        # binary 가 Stop 호출에 도달하지 못한 상태가 의심된다.
        - alert: InjectorStuck
          expr: |
            injector_active == 1
          for: 35m
          labels:
            severity: critical
            component: injector
          annotations:
            summary: "injector stuck (target={{ $labels.target_namespace }}/{{ $labels.target_pod }} kind={{ $labels.kind }})"
            description: "workload-injector 의 active=1 시계열이 35 분 이상 지속되었다. binary 의 DurationLimit (30 분) 을 초과한 상태라 정상 lifecycle 이 아니다. Job 의 Pod 상태와 spawn 한 stress Pod 의 잔존 여부를 점검한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/internal/injector/README.md#injectorstuck"

        # LoadScenarioReconcilerStalled
        # #102 의 controller mode 가 마지막 reconcile 시점 으로부터 5 분 초과 시 발화. controller worker
        # stall (blocking 부하 인가 가 LoadScenario.spec.duration 의 max 30 분 안에 끝나지 못하는 케이스),
        # leader election lease 분실, manager goroutine 죽음 등 이 검출 된다. controller 가 dev cluster
        # 전용 이라 본 alert 도 dev cluster 의 controller 배포 상태 에서만 의미 가 있다.
        - alert: LoadScenarioReconcilerStalled
          expr: |
            max(loadscenario_reconcile_timestamp_seconds) > 0
            and (time() - max(loadscenario_reconcile_timestamp_seconds) > 300)
          for: 1m
          labels:
            severity: critical
            component: injector
          annotations:
            summary: "loadscenario controller stalled (last reconcile > 5m ago)"
            description: "workload-injector 의 controller mode 가 5 분 이상 reconcile 호출 없이 멈춰 있다. timestamp 가 0 이거나 시리즈 자체 가 비어 있는 경우 (LoadScenario CR 부재 또는 controller 미배포) 는 자연 false positive 가 발생 하지 않도록 max(...) > 0 게이팅 을 둔다. leader election lease, manager goroutine, reconcile 흐름 의 갱신 여부 를 점검 한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/docs/injector/auto-scenarios.md#loadscenarioreconcilerstalled"

        # LoadScenarioConsecutiveFailures
        # 특정 LoadScenario 의 마지막 run 결과 가 error 인 상태 가 1 시간 이상 지속 시 warning 발화.
        # spec.maxFailures 초과 로 자동 suspend 가 된 LoadScenario 도 본 시리즈 가 1 시간 지속 됨 으로
        # 자연 검출 되지만 본 expr 자체 는 suspend 여부 를 직접 판단 하지 않는다. 운영자 가 본 alert
        # 수신 시 status.conditions 의 Suspended type 으로 자동 suspend 여부 를 확인 한 뒤 부하 정의
        # 또는 target 상태 점검 후 spec.suspend=false 또는 maxFailures 조정 으로 재개 결정 한다.
        - alert: LoadScenarioConsecutiveFailures
          expr: |
            loadscenario_last_run_status{result="error"} == 1
          for: 1h
          labels:
            severity: warning
            component: injector
          annotations:
            summary: "loadscenario {{ $labels.namespace }}/{{ $labels.loadscenario }} consecutive failures"
            description: "LoadScenario {{ $labels.namespace }}/{{ $labels.loadscenario }} 의 마지막 run 이 error 결과 로 1 시간 이상 지속 되었다. status.conditions 의 Suspended type 으로 자동 suspend 여부 확인 후 부하 정의 또는 target 상태 를 점검 한다."
            runbook_url: "https://github.com/inno-rnd-project/eBPF/blob/main/docs/injector/auto-scenarios.md#loadscenarioconsecutivefailures"
