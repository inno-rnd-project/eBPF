apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-injector
  labels:
    app.kubernetes.io/name: workload-injector
    app.kubernetes.io/part-of: ebpf-project
rules:
  # target Pod 식별과 nodeName 조회. cluster 전체 namespace 가 target 일 수 있어 cluster-scope.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # cluster label gate (CheckClusterLabel) 가 Node 라벨로 매칭.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch", "get"]
  # 동시 injection lock 의 ConfigMap annotation lease.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  # #102 controller mode 의 LoadScenario CRD reconcile 권한.
  - apiGroups: ["injector.netobs.io"]
    resources: ["loadscenarios"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["injector.netobs.io"]
    resources: ["loadscenarios/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["injector.netobs.io"]
    resources: ["loadscenarios/finalizers"]
    verbs: ["update"]
  # #102 controller mode 의 leader election lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # #102 controller mode 의 leader election event emit.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
