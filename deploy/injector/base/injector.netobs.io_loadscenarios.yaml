---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: loadscenarios.injector.netobs.io
spec:
  group: injector.netobs.io
  names:
    kind: LoadScenario
    listKind: LoadScenarioList
    plural: loadscenarios
    shortNames:
    - ls
    singular: loadscenario
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.lastScheduleTime
      name: LastSchedule
      type: date
    - jsonPath: .status.lastSuccessfulRunTime
      name: LastSuccess
      type: date
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LoadScenario 는 dev cluster 에서 schedule 따라 자동 부하 를 인가 하는 CRD 다.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoadScenarioSpec 는 LoadScenario 의 사용자 정의 입력이다.
            properties:
              concurrencyPolicy:
                default: Forbid
                description: ConcurrencyPolicy 는 진행 중 injection 과 겹칠 때 의 처리 정책 이다.
                  기본값 Forbid.
                enum:
                - Allow
                - Forbid
                - Replace
                type: string
              duration:
                description: |-
                  Duration 은 1 회 부하 인가 시간이다. internal/injector/safety.CheckDuration 의 상한
                  (30 분) 을 따른다. metav1.Duration 으로 표기 해 "5m" 같은 친숙한 표현 을 받는다.
                type: string
              intensity:
                description: |-
                  Intensity 는 부하 강도다. kind 별 단위 가 다르며 (cpu: millicores, memory: Mi/Gi,
                  network: M/G, gpu: 1 단위 fraction) safety.CheckIntensity 에서 kind 별 상한과 비교한다.
                minLength: 1
                type: string
              kind:
                description: Kind 는 부하 종류 enum 이다.
                enum:
                - cpu
                - memory
                - network
                - gpu
                type: string
              maxFailures:
                default: 3
                description: |-
                  MaxFailures 는 연속 실패 임계 이다. status.consecutiveFailures 가 본 값을 초과 하면
                  LoadScenario 의 suspend 상태 가 true 로 자동 전환 되어 다음 run 이 트리거 되지 않는다.
                  기본값 3.
                format: int32
                minimum: 1
                type: integer
              schedule:
                description: |-
                  Schedule 은 cron 표현식 또는 "@every <duration>" 형식이다. controller 의 cron parser 가
                  본 문자열을 next run time 산정에 사용 한다. 예: "0 0 * * *" (매일 자정), "@every 5m".
                minLength: 1
                type: string
              spikeAlertAssertion:
                default: false
                description: |-
                  SpikeAlertAssertion 이 true 이면 controller 가 부하 종료 후 5 분 polling window 동안
                  z-score spike alert (CPUThrottleSpike / MemoryPressureSpike / NetworkDropSpike /
                  GPUUtilizationSpike) 발화 여부 를 Prometheus query 로 확인 해 status 에 기록 한다.
                type: boolean
              suspend:
                default: false
                description: |-
                  Suspend 가 true 이면 schedule 따른 다음 run 이 트리거 되지 않는다. 운영자가 임시 disable
                  하거나 controller 의 maxFailures 가드 가 자동 설정 한다.
                type: boolean
              targetRef:
                description: TargetRef 는 부하 대상 Pod 다.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - duration
            - intensity
            - kind
            - schedule
            - targetRef
            type: object
          status:
            description: LoadScenarioStatus 는 controller 가 reconcile 결과 를 기록 하는 영역이다.
            properties:
              conditions:
                description: |-
                  Conditions 는 controller-runtime convention 의 condition 배열 이다. 본 CRD 가 노출 하는
                  condition type 은 다음 4 종 이다.
                    - Ready (controller 가 LoadScenario 를 reconcile 가능 한 상태)
                    - Scheduled (마지막 run 이 schedule 따라 정상 트리거 됨)
                    - SpikeAlertObserved (spikeAlertAssertion = true 일 때 마지막 run 의 alert hit 여부)
                    - Suspended (maxFailures 초과 또는 운영자 명시 suspend)
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: |-
                  ConsecutiveFailures 는 마지막 successful run 이후 연속 실패 횟수 이다. successful run 마다 0
                  으로 reset 된다.
                format: int32
                type: integer
              lastObservedSpikeAlerts:
                description: |-
                  LastObservedSpikeAlerts 는 spikeAlertAssertion 이 true 일 때 마지막 run 종료 직후
                  firing 으로 관측 된 alertname 목록 이다. hit 가 없으면 빈 배열 또는 nil.
                items:
                  type: string
                type: array
              lastScheduleTime:
                description: LastScheduleTime 은 controller 가 마지막 으로 run 을 트리거 한 시각
                  이다.
                format: date-time
                type: string
              lastSuccessfulRunTime:
                description: LastSuccessfulRunTime 은 마지막 으로 정상 종료 된 run 의 시각 이다.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
