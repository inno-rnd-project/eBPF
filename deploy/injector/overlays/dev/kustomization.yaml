apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# #420 전역 namespace transformer 를 제거했다. base 의 모든 namespaced 리소스가 명시 namespace
# 를 갖고 있고, 전역 필드는 default namespace 의 추가 Role (role-default.yaml) 까지 ebpf-project
# 로 덮어써 ID 충돌을 일으킨다.
resources:
  - ../../base
  - role-default.yaml

# #420 dev 는 default namespace 도 부하 대상으로 허용한다 (role-default.yaml 의 RBAC 과 정합).
# strategic merge 라 env 는 name 키 기준으로 병합된다.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workload-injector-controller
        namespace: ebpf-project
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: INJECTOR_ALLOWED_TARGET_NAMESPACES
                    value: "ebpf-project,default"

# 컨트롤러 이미지는 ghcr 레지스트리에서 받는다. 종전 로컬 전용 태그(workload-injector:x.y.z)는
# 빌드한 노드의 docker에만 존재해, 그 노드가 DiskPressure로 파드를 축출하고 kubelet 이미지 GC가
# 로컬 이미지를 지운 뒤 다른 노드로 재스케줄된 파드가 ImagePullBackOff에 빠졌다.
# make image-push-all이 ghcr에 같은 태그를 push하므로 newTag는 make bump가 그대로 갱신한다.
images:
  - name: workload-injector
    newName: ghcr.io/inno-rnd-project/workload-injector
    newTag: "3.4.1"
# base 가 Job 매니페스트를 두지 않으므로 dev overlay 도 patch-job 을 두지 않는다. 운영자는
# test/injector-examples/{cpu,network,gpu}.yaml 을 직접 edit (TARGET_POD / INTENSITY / DURATION) 후
# kubectl apply -f 로 단일 injection 을 실행한다. dev 의 imagePullPolicy: Never 는 example yaml 의
# 기본값으로 두어 있다.
